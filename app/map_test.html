<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>读三国 · 地图</title>
<style>
  :root{--paper:#f6f2e9;--ink:#2b2620;--ink2:#6b6357;--ink3:#9a9284;--line:#ddd4c2;--accent:#9c2b1f;--water:#6f8fa3;--person:#8a5a1f;--paper2:#fffdf8}
  *{margin:0;padding:0;box-sizing:border-box}
  body{height:100vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:"Noto Serif SC",STSong,SimSun,serif;overflow:hidden}
  /* 地图上的文字是图形注记：禁止选中（否则点击拖动出现蓝色选区），点击穿透由各组 pointer-events 控制 */
  svg{user-select:none;-webkit-user-select:none}
  svg text{user-select:none;-webkit-user-select:none}
  button{font-family:inherit}

  /* ---------- 顶栏 ---------- */
  .top{display:flex;align-items:center;gap:14px;padding:9px 18px;border-bottom:1px solid var(--line);background:var(--paper2);flex:none}
  .top .t{font-size:15px;letter-spacing:2px}
  .top .meta{font-size:11.5px;color:var(--ink3)}
  .grow{flex:1}
  .zc{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:4px;background:#fff;overflow:hidden}
  .zc button{width:28px;height:26px;border:0;background:transparent;color:var(--ink2);font-size:15px;cursor:pointer;line-height:1}
  .zc button:hover{background:#f4ead9;color:var(--accent)}
  .zc .fit{width:auto;padding:0 10px;font-size:12px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .zc .lb{font-size:11.5px;color:var(--ink2);padding:0 9px;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
  .tag{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--ink3)}

  /* ---------- 布局 ---------- */
  .main{flex:1;display:flex;min-height:0}
  .side{width:300px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--paper2)}
  .tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
  .tabs div{flex:1;text-align:center;padding:9px 0;font-size:12.5px;cursor:pointer;color:var(--ink2)}
  .tabs div.on{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
  .search{padding:8px 10px;border-bottom:1px solid var(--line);flex:none}
  .search input{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:4px;font-family:inherit;font-size:13px;background:#fff;color:var(--ink)}
  .search input:focus{outline:none;border-color:var(--accent)}
  .list{flex:1;overflow-y:auto;font-size:13px;min-height:80px}
  .item{padding:7px 12px;cursor:pointer;border-bottom:1px dashed var(--line);display:flex;gap:8px;align-items:baseline}
  .item:hover{background:#f4efe3}
  .item.on{background:#f2e5cd;box-shadow:inset 3px 0 0 var(--accent)}
  .item .nm{font-size:13.5px}
  .item .ty{font-size:10.5px;color:var(--ink3);margin-left:auto;white-space:nowrap}
  .item .sub{display:block;font-size:10.5px;color:var(--ink3);margin-top:1px}

  /* ---------- 侧栏底部：原卡片文字内容改放这里 ---------- */
  .detail{flex:none;border-top:1px solid var(--line);background:#fbf7ee;max-height:46%;overflow-y:auto;padding:12px 14px;font-size:12.5px}
  .detail.empty{color:var(--ink3);font-size:12px;line-height:1.9;max-height:none;padding:14px}
  .detail h4{font-size:15px;font-weight:400;margin-bottom:2px;display:flex;align-items:baseline;gap:7px}
  .detail h4 .k{font-size:10.5px;color:var(--ink3);border:1px solid var(--line);border-radius:3px;padding:1px 5px}
  .detail .rows{margin-top:8px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;line-height:1.6}
  .detail .rows .k{color:var(--ink3);font-size:11.5px;white-space:nowrap}
  .detail .rows .v{color:#4a443b}
  .detail .desc{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);color:#4a443b;line-height:1.75}
  .detail .lit{font-size:11px;color:var(--accent)}
  .detail .nd{padding:3px 0 3px 11px;border-left:2px solid var(--line);position:relative;color:var(--ink2);line-height:1.6}
  .detail .nd.on{border-color:var(--accent);color:var(--ink)}
  .detail .nd::before{content:"";position:absolute;left:-4px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--line)}
  .detail .nd.on::before{background:var(--accent)}
  .detail .nd b{color:var(--accent);font-weight:600;margin-right:5px}
  .btn{font-size:11.5px;padding:3px 10px;border:1px solid var(--accent);color:var(--accent);border-radius:3px;cursor:pointer;background:transparent;font-family:inherit}
  .btn:hover{background:rgba(156,43,31,.07)}

  /* ---------- 地图 ---------- */
  .stage{flex:1;position:relative;min-width:0;background:#f3ede0;overflow:hidden}
  #svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #svg.grabbing{cursor:grabbing}
  .hint{position:absolute;left:14px;bottom:14px;font-size:11.5px;color:var(--ink2);background:rgba(255,253,248,.9);
        padding:6px 11px;border-radius:4px;border:1px solid var(--line);pointer-events:none;line-height:1.7}
  .hint b{font-weight:400;color:var(--accent)}
  .scale{position:absolute;right:14px;bottom:14px;font-size:11px;color:var(--ink2);background:rgba(255,253,248,.9);
         padding:5px 10px;border-radius:4px;border:1px solid var(--line);pointer-events:none}

  /* ═══ 与 reader 的「绢本设色 v2」对齐（2026-10-30）：顶栏/侧栏用深木色，
         纸色留给地图与详情，两页不像两个产品 ═══ */
  body{background:#e9dfc4}
  .top{background:
      linear-gradient(180deg,rgba(255,240,205,.10),rgba(255,240,205,0) 46%),
      linear-gradient(180deg,#3a2f1e 0%,#2c2315 58%,#241c10 100%);
    border-bottom:2px solid #6d5730;
    box-shadow:inset 0 1px 0 rgba(240,215,160,.16),0 2px 0 rgba(194,160,92,.16),0 3px 18px rgba(28,20,10,.42)}
  .top .t{color:#e0c68c;letter-spacing:4px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .top .meta{color:#a08c65}
  .tag{color:#a08c65;border-color:rgba(194,160,92,.28);background:rgba(255,240,205,.05)}
  .zc{background:rgba(253,249,238,.96);border-color:#6d5730}
  .zc button{color:#6b5f4c}
  .zc button:hover{background:#f2e6cc;color:#a3442f}
  .zc .lb{color:#6b5f4c}
  .side{background:
      linear-gradient(180deg,rgba(255,238,200,.05),transparent 30%),
      linear-gradient(180deg,#332a1a 0%,#3b301f 55%,#332a1a 100%);
    border-right:1px solid #5c4a2c;
    box-shadow:inset -1px 0 0 rgba(194,160,92,.14),3px 0 16px rgba(28,20,10,.18)}
  .tabs{border-bottom:1px solid rgba(194,160,92,.24)}
  .tabs div{color:#c4b48e}
  .tabs div:hover{background:rgba(232,206,150,.07);color:#f2e3c0}
  .tabs div.on{color:#f7e8c2;background:linear-gradient(180deg,rgba(194,160,92,.22),rgba(194,160,92,.04));
    box-shadow:inset 0 -2px 0 #c2a05c}
  .search{border-bottom:1px solid rgba(194,160,92,.18)}
  .search input{background:rgba(253,249,238,.95);border-color:#5c4a2c;color:#2b2620}
  .item{color:#c4b48e;border-bottom:1px dashed rgba(194,160,92,.15)}
  .item:hover{background:rgba(232,206,150,.08);color:#f2e3c0}
  .item.on{background:linear-gradient(90deg,rgba(163,52,42,.34),rgba(163,52,42,.04));
    color:#f8e9c6;box-shadow:inset 3px 0 0 #bd4a35}
  .item .nm{color:inherit}
  .item .ty,.item .sub{color:#9d8a63}
  .item.on .ty,.item.on .sub{color:#cbb894}
  .detail{background:
      repeating-linear-gradient(90deg,rgba(150,120,70,.05) 0 1px,transparent 1px 27px),
      linear-gradient(180deg,#fdf8ec,#f8f1de);
    border-top:1px solid #cdb98d}
  .detail.empty{color:#9a8a6c;background:
      repeating-linear-gradient(90deg,rgba(150,120,70,.05) 0 1px,transparent 1px 27px),
      linear-gradient(180deg,#faf3e1,#f4ead4)}
  .stage{background:#e6dcc2;box-shadow:inset 0 0 40px rgba(90,72,45,.12)}
  .hint,.scale{background:rgba(253,249,238,.92);border-color:#d6c39c;color:#6b5f4c;
    box-shadow:0 1px 4px rgba(60,45,25,.1)}
  .btn{color:#8c3a2a;border-color:#a3442f}
  .btn:hover{background:rgba(163,52,42,.08)}
</style>
</head>
<body>
<div class="top">
  <div class="t">地图</div>
  <div class="meta" id="canvas-meta"></div>
  <div class="grow"></div>
  <div class="tag">可缩放</div>
  <div class="zc">
    <button id="zo" title="缩小">−</button>
    <div class="lb" id="zlb">1.00×</div>
    <button id="zi" title="放大">＋</button>
    <button class="fit" id="zfit" title="回到全图">全图</button>
  </div>
</div>
<div class="main">
  <div class="side">
    <div class="tabs">
      <div class="on" data-tab="place">地名（<span id="cnt-place"></span>）</div>
      <div data-tab="county">县邑（<span id="cnt-county"></span>）</div>
      <div data-tab="battle">战役</div>
    </div>
    <div class="search"><input id="q" placeholder="检索地名 / 今地 / 州郡…"></div>
    <div class="list" id="list"></div>
    <div class="detail empty" id="detail">点击左侧列表或地图上的点位，此处显示该地详情。地图可自由缩放：滚轮、双击、拖拽。</div>
  </div>
  <div class="stage">
    <svg id="svg"></svg>
    <div class="hint">滚轮 / 双击 <b>缩放</b>　·　拖拽 <b>平移</b>　·　点击点位 <b>定位</b></div>
    <div class="scale" id="scale"></div>
  </div>
</div>
<script>/* ============================================================================
   读三国 · 地图内核 MapCore
   ----------------------------------------------------------------------------
   唯一实现：只在 app/map_core.js 里维护，build.py 在构建时把本文件内容内联进
   map_test.html 与 reader.html（占位符 /*__MAPCORE__*\/）。**不要在模板里再写
   第二份底图/缩放/注记逻辑**——两套代码漂移是此前多轮「改了一处另一处没改」的根源。

   三条硬规则（历史踩坑总结，改动前先读）
   1) 屏幕像素恒定：凡「观感尺寸」不随缩放变化的元素（选中靶心、战线节点），
      一律写 data-sz = 屏幕像素，再由 applySpacing(root, pz) 按 1/pz 折回画布单位。
      动画每帧都要重新 apply 一次，否则缩放过程中会跑形。
   2) 感知缩放 pz ≠ 视图比例 z：viewBox 显示宽度往往小于画布宽（卡片内嵌小图更小），
      屏幕上的真实倍率是 z × clientWidth / C.w。所有注记字号、阈值都按 pz 算，
      否则小图上标签会缩成看不见的白点。
   3) 数据里的坐标已由构建脚本投影成像素，前端不做任何投影运算。
   ========================================================================== */
window.MapCore = (function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var num = function (v) { return Math.round(v * 1000) / 1000; };

  function el(n, a) {
    var e = document.createElementNS(NS, n);
    if (a) for (var k in a) if (a[k] != null) e.setAttribute(k, a[k]);
    return e;
  }
  function dLine(pts) { return pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0] + ',' + p[1]; }).join(' '); }
  /* pts 既可以是单环 [[x,y],…]，也可以是「多环」[[[x,y],…],…]——同一州的
     主环 + 飞地/离岛必须画成一条 path，否则前端按「每州 2 条 path」配对会错位
     （多环州点州名时边界线不高亮，见 build.py::_zhoupoly_refit 的说明）。 */
  function dPoly(pts) {
    if (pts && pts.length && Array.isArray(pts[0]) && Array.isArray(pts[0][0]))
      return pts.map(function (r) { return dLine(r) + ' Z'; }).join(' ');
    return dLine(pts) + ' Z';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  /* 汉字按 1em、其他按 .52em 估宽：名牌每帧定位时用它代替 getBBox（重排代价太高） */
  function textW(s, fs) {
    var n = 0;
    for (var i = 0; i < String(s).length; i++) n += /[\u3400-\u9fff\uff00-\uffef]/.test(String(s)[i]) ? 1 : 0.52;
    return n * fs;
  }

  /* 地名类型 → 定位比例。兜底表与 scripts/build.py 的 SCALE_BY_TYPE 同源；
     build 会把 DATA.scale_by_type 注进来，正式页面以数据为准。 */
  var ZOOM_BY_TYPE = {
    '都城': 2.6, '州域': 1.5, '郡治': 2.8, '重镇': 2.8, '城': 3.2, '县': 3.2,
    '关隘': 3.4, '渡口': 3.0, '要津': 3.0, '战场': 3.0, '山': 3.0, '原': 3.0,
    '水系': 1.2, '宫殿': 3.6, '陵墓': 3.6
  };
  function zoomFor(type, table) { return (table || ZOOM_BY_TYPE)[type] || 3.0; }

  /* ---------------- 底图 ---------------- */
  /* 地形晕渲（构建时生成的 PNG，已按同一画布投影） */
  function terrainLayer(svg, C, GEO) {
    if (GEO.terrain) {
      var img = el('image', { x: 0, y: 0, width: C.w, height: C.h, preserveAspectRatio: 'none' });
      img.setAttribute('href', GEO.terrain);
      svg.appendChild(img);
      return img;
    }
    svg.appendChild(el('rect', { x: 0, y: 0, width: C.w, height: C.h, fill: '#f3ede0' }));
    for (var x = 0; x < C.w; x += 100) svg.appendChild(el('line', { x1: x, y1: 0, x2: x, y2: C.h, stroke: '#e7dfcd', 'stroke-width': 1 }));
    for (var y = 0; y < C.h; y += 100) svg.appendChild(el('line', { x1: 0, y1: y, x2: C.w, y2: y, stroke: '#e7dfcd', 'stroke-width': 1 }));
    return null;
  }
  /* 水系（河 + 湖），大势视图用它做淡显底 */
  function waterLayer(GEO, opacity) {
    var g = el('g', { 'pointer-events': 'none' });
    if (opacity != null) g.setAttribute('opacity', opacity);
    (GEO.rivers || []).forEach(function (r) {
      g.appendChild(el('path', { d: dLine(r.pts), fill: 'none', stroke: r.color, 'stroke-width': r.w, 'stroke-linecap': 'round', opacity: .85 }));
    });
    (GEO.lakes || []).forEach(function (l) {
      g.appendChild(el('path', { d: dPoly(l.pts), fill: '#a8c4d4', stroke: '#7fa2b8', 'stroke-width': .8, opacity: .85 }));
    });
    return g;
  }

  /* 完整底图：地形 → 岸线 → 州界 → 湖 → 河 → 州名 → 县点 → 县名/水名注记
     返回 refs，供 decorScale / 选中态消隐注记使用 */
  function drawBase(svg, C, GEO) {
    svg.innerHTML = '';
    /* 数据裁剪框比画布外扩一圈（投影留余量），整层裁到画布矩形，避免越界绘制 */
    var defs = el('defs', {});
    svg.appendChild(defs);
    var cp = el('clipPath', { id: 'cvclip' });
    cp.appendChild(el('rect', { x: 0, y: 0, width: C.w, height: C.h }));
    defs.appendChild(cp);
    /* 跨区域地理高亮的斜纹填充：青灰 45° 细纹——地理分区≠行政界线的另一种语言
       （州=红实线、郡=橙实线、分区=青斜纹，三者一眼可分） */
    var pat = el('pattern', { id: 'hatchRegion', width: 8, height: 8, patternUnits: 'userSpaceOnUse',
                              patternTransform: 'rotate(45)' });
    pat.appendChild(el('rect', { width: 8, height: 8, fill: 'rgba(70,110,112,.34)' }));
    pat.appendChild(el('line', { x1: 0, y1: 0, x2: 0, y2: 8, stroke: 'rgba(47,81,83,.72)', 'stroke-width': 3 }));
    defs.appendChild(pat);

    var base = el('g', { 'clip-path': 'url(#cvclip)' });
    svg.appendChild(base);
    terrainLayer(base, C, GEO);

    if (!GEO.terrain)
      (Array.isArray(GEO.coast[0][0]) ? GEO.coast : [GEO.coast]).forEach(function (seg) {
        base.appendChild(el('path', { d: dLine(seg), fill: 'none', stroke: '#8a7a5c', 'stroke-width': 2.2, 'stroke-linejoin': 'round' }));
      });

    /* 州界：米白晕底 + 淡紫虚线（与县名暖褐、水名藏蓝区分），描边按屏幕像素恒定 */
    var gZhouPoly = el('g', {});
    base.appendChild(gZhouPoly);
    (GEO.zhoupoly || []).forEach(function (poly) {
      var d = dPoly(poly.pts || poly);
      gZhouPoly.appendChild(el('path', { d: d, fill: 'none', stroke: '#fdf8ea', 'stroke-width': 3, opacity: .3, 'vector-effect': 'non-scaling-stroke' }));
      gZhouPoly.appendChild(el('path', { d: d, fill: 'none', stroke: '#8b5a9e', 'stroke-width': 1.1, 'stroke-dasharray': '7 6', 'stroke-linecap': 'round', opacity: .62, 'vector-effect': 'non-scaling-stroke' }));
    });

    /* 三州交汇「界碑」：≥3 州环共享的坐标点画实心小点。
       虚线 dash 相位在各弧独立，三州共点处可能恰好都是间隙，观感像一道微缝——
       界碑点把交汇处钉住，既是标准制图符号，也顺手消了这个观感问题。
       （数据层审计 scripts/audit_zhou_gaps.py：相邻州距离全 0，共点精确共享。） */
    var zhouPtCount = {};
    (GEO.zhoupoly || []).forEach(function (poly) {
      var seenInPoly = {};
      (poly.pts || poly).forEach(function (p) {
        var k = p[0] + ',' + p[1];
        if (seenInPoly[k]) return;
        seenInPoly[k] = 1;
        (zhouPtCount[k] = zhouPtCount[k] || { n: 0, x: p[0], y: p[1] }).n++;
      });
    });
    Object.keys(zhouPtCount).forEach(function (k) {
      var v = zhouPtCount[k];
      if (v.n < 3) return;
      /* zhoupoly 的 pts 在构建时已投影为画布坐标，直接用 */
      base.appendChild(el('circle', {
        cx: v.x, cy: v.y, r: 2.2, fill: '#8b5a9e', opacity: .8,
        stroke: '#f7f2e6', 'stroke-width': .8, 'paint-order': 'stroke',
        'vector-effect': 'non-scaling-stroke', 'pointer-events': 'none'
      }));
    });

    base.appendChild(waterLayer(GEO, null));

    /* 郡界：与州界同为行政界线，但弱一档——州界是紫实虚加晕底、字大而重；
       郡界用更细的浅赭褐点线、无晕底，只在放大到能看清县名时才浮现（pz≥1.6）。
       每个郡一个 <g data-jun>，内含主环 + 飞地环，供 junHighlight 单独提亮。 */
    var gJunPoly = el('g', { 'pointer-events': 'none' });
    base.appendChild(gJunPoly);
    (GEO.junpoly || []).forEach(function (j) {
      var g = el('g', { 'data-jun': j.n });
      var rings = [j.p].concat(j.e || []);
      rings.forEach(function (ring) {
        if (!ring || ring.length < 3) return;
        g.appendChild(el('path', {
          d: dPoly(ring), fill: 'none', stroke: '#5c6f8e', 'stroke-width': 0.75,
          'stroke-dasharray': '3 3.5', 'stroke-linecap': 'round', opacity: .42,
          'vector-effect': 'non-scaling-stroke'
        }));
      });
      gJunPoly.appendChild(g);
    });

    var gZhouLb = el('g', { 'pointer-events': 'none' });
    base.appendChild(gZhouLb);
    (GEO.zhou || []).forEach(function (z) {
      var t = el('text', {
        x: z.x, y: z.y, 'text-anchor': 'middle', fill: '#5d3f6b', 'font-size': 26,
        'font-family': 'serif', opacity: .9, 'letter-spacing': 4,
        stroke: '#f7f2e6', 'stroke-width': 2, 'paint-order': 'stroke', 'stroke-linejoin': 'round',
        'vector-effect': 'non-scaling-stroke', 'data-zhou': z.name
      });
      t.textContent = z.name;
      gZhouLb.appendChild(t);
    });

    /* 羌中：凉州与益州、司隶西部之间的留白不是漏画——东汉此地为羌胡所居，
       未设郡县（谭图作「羌中」）。加注记说明，读者才不会当成渲染缺口报 bug。
       坐标 (106.1,35.7) 经 build.py 同款投影换算 → (486.4, 383.1)。 */
    var qzT = el('text', {

": 125.35, "lat": 38.72, "modern": "", "adm": "幽州·乐浪郡", "prec": "精确", "ch": null, "zoom": 3.2}, {"id": "c_豫州_沛国_龙亢", "name": "龙亢", "type": "县", "x": 907.7, "y": 500.8, "lng": 116.75, "lat": 33.15, "modern": "", "adm": "豫州·沛国", "prec": "精确", "ch": null, "zoom": 3.2}, {"id": "c_交州_南海郡_龙川", "name": "龙川", "type": "县", "x": 848.4, "y": 918.5, "lng": 115.25, "lat": 24.1, "modern": "", "adm": "交州·南海郡", "prec": "精确", "ch": null, "zoom": 3.2}, {"id": "c_交州_交趾郡_龙编", "name": "龙编", "type": "郡治", "x": 478.5, "y": 1056.9, "lng": 105.9, "lat": 21.1, "modern": "", "adm": "交州·交趾郡", "prec": "精确", "ch": null, "zoom": 2.8}], "battles": [{"id": "da_xing_shan_zhi_zhan", "name": "大兴山之战", "event_id": "huang_jin_qi_yi", "year": 184, "date_text": "中平元年（184）", "place_name": "大兴山", "summary": "刘关张首战：张飞刺邓茂于马下，关羽斩程远志为两段，五百义勇破黄巾五万。", "nodes": [{"seq": 1, "kind": "集结", "label": "涿县出师", "desc": "邹靖引玄德等三人，统兵五百出涿县。", "x": 876.8, "y": 208.2}, {"seq": 2, "kind": "行军", "label": "南行赴敌", "desc": "领军前进，直至大兴山下。", "x": 874.9, "y": 212.3}, {"seq": 3, "kind": "遭遇", "label": "两军相对", "desc": "贼众披发，以黄巾抹额；玄德出马大骂。", "x": 872.5, "y": 214.2}, {"seq": 4, "kind": "交战", "label": "阵前斩将", "desc": "张飞刺邓茂，关羽斩程远志。", "x": 872.1, "y": 214.6}, {"seq": 5, "kind": "追击", "label": "倒戈溃散", "desc": "众贼倒戈而走，玄德挥军追赶。", "x": 870.1, "y": 216.9}]}, {"id": "qing_zhou_jie_wei", "name": "青州解围之战", "event_id": "huang_jin_qi_yi", "year": 184, "date_text": "中平元年（184）", "place_name": "青州", "summary": "刘备以寡敌众，先退三十里示弱，再以左右伏兵三路夹攻，解青州之围。", "nodes": [{"seq": 1, "kind": "集结", "label": "涿郡受命", "desc": "龚景牒文求救，邹靖将兵五千同玄德等南下。", "x": 876.8, "y": 208.2}, {"seq": 2, "kind": "行军", "label": "南下青州", "desc": "自涿郡南下，经冀州界入青州。", "x": 901.8, "y": 276.9}, {"seq": 3, "kind": "交战", "label": "初战不利", "desc": "贼分兵混战，玄德兵寡不胜，退三十里下寨。", "x": 953.2, "y": 327.7}, {"seq": 4, "kind": "屯驻", "label": "分兵设伏", "desc": "关羽伏山左、张飞伏山右，鸣金为号。", "x": 959.1, "y": 330.0}, {"seq": 5, "kind": "交战", "label": "诱敌过岭", "desc": "玄德鼓噪而进，接战即退，诱贼过山岭。", "x": 957.2, "y": 330.9}, {"seq": 6, "kind": "追击", "label": "三路夹攻", "desc": "伏兵齐出，回身复杀，直赶至青州城下。", "x": 961.1, "y": 332.3}]}, {"id": "bei_mang_shan_bian", "name": "北邙山之变", "event_id": "shi_chang_shi_zhi_luan", "year": 189, "date_text": "中平六年（189）八月", "place_name": "北邙山", "summary": "张让、段珪劫少帝与陈留王夜奔北邙山，闵贡追至，张让投水；董卓随后迎驾还宫，攫取朝权。", "nodes": [{"seq": 1, "kind": "起事", "label": "宫中出逃", "desc": "张让、段珪劫少帝与陈留王，冒烟突火连夜奔走。", "x": 738.5, "y": 432.5}, {"seq": 2, "kind": "奔逃", "label": "夜至北邙山", "desc": "约二更时分，避入山中，饥寒交迫，伏于岸边草堆。", "x": 737.6, "y": 422.3}, {"seq": 3, "kind": "追及", "label": "闵贡追至", "desc": "贡赶段珪问天子何在，段珪被杀，张让投水。", "x": 739.6, "y": 423.7}, {"seq": 4, "kind": "结局", "label": "董卓迎驾", "desc": "帝与陈留王还宫途中，为董卓大军所「迎」，朝权自此易手。", "x": 735.2, "y": 420.5}]}, {"id": "si_shui_guan_zhi_zhan", "name": "汜水关之战", "event_id": "tao_dong_shi_ba_lu", "year": 190, "date_text": "初平元年（190）正月—二月", "place_name": "汜水关", "summary": "孙坚攻汜水关先胜后败（袁术断粮），华雄下关搦战连斩联军数将，关羽温酒斩华雄，关前大振。", "nodes": [{"seq": 1, "kind": "集结", "label": "诸侯屯酸枣", "desc": "十八路诸侯陆续到齐，营寨连接二百余里。", "x": 823.4, "y": 402.5}, {"seq": 2, "kind": "行军", "label": "坚为前部", "desc": "孙坚引程普、黄盖、韩当四将杀奔汜水关来。", "x": 770.0, "y": 421.8}, {"seq": 3, "kind": "受挫", "label": "华雄掩杀", "desc": "鲍忠抢功被斩；袁术断粮，坚军自乱，华雄夜袭，祖茂战死。", "x": 766.9, "y": 421.4}, {"seq": 4, "kind": "搦战", "label": "雄挑赤帻", "desc": "华雄引铁骑下关，以长竿挑孙太守赤帻，连斩联军诸将。", "x": 769.6, "y": 425.1}, {"seq": 5, "kind": "决战", "label": "温酒斩华雄", "desc": "关羽出阵，鼓声大振处提华雄之头掷于地上，其酒尚温。", "x": 766.1, "y": 424.2}]}, {"id": "hu_lao_guan_zhi_zhan", "name": "虎牢关之战", "event_id": "tao_dong_shi_ba_lu", "year": 190, "date_text": "初平元年（190）", "place_name": "虎牢关", "summary": "吕布虎牢关前连败联军数将，张飞出战、关羽夹攻、刘备掣双股剑，三英合围，吕布倒拖画戟退上虎牢关。", "nodes": [{"seq": 1, "kind": "对峙", "label": "分兵把关", "desc": "李傕、郭汜把汜水关；董卓与吕布自领大军屯虎牢关。", "x": 767.3, "y": 424.2}, {"seq": 2, "kind": "集结", "label": "董卓屯虎牢", "desc": "卓军十五万据关，截联军中路，袁绍聚众商议。", "x": 774.4, "y": 425.1}, {"seq": 3, "kind": "搦战", "label": "吕布连斩三将", "desc": "方悦五合被刺、穆顺一戟毙命、武安国断腕而逃。", "x": 776.0, "y": 423.7}, {"seq": 4, "kind": "决战", "label": "三英战吕布", "desc": "张飞先出，关羽夹攻，刘备掣剑——三英围住吕布厮杀。", "x": 772.4, "y": 424.2}, {"seq": 5, "kind": "败退", "label": "布走上关", "desc": "吕布虚刺一戟，倒拖画戟飞马而回，卓兵大败。", "x": 775.6, "y": 426.9}]}, {"id": "xing_yang_fu_ji_zhan", "name": "荥阳伏击战", "event_id": "tao_dong_shi_ba_lu", "year": 190, "date_text": "初平元年（190）二月", "place_name": "荥阳", "summary": "诸侯不肯追击，曹操独引兵追董卓；至荥阳中徐荣之伏，大败，曹洪让马扶操渡河，仅以身免。", "nodes": [{"seq": 1, "kind": "西走", "label": "焚洛阳弃城", "desc": "卓焚宫室、驱百万口西赴长安，留徐荣断后设伏。", "x": 738.9, "y": 432.9}, {"seq": 2, "kind": "设伏", "label": "伏军山坞", "desc": "李儒教徐荣伏军荥阳城外山坞之旁，以待追兵。", "x": 773.2, "y": 424.2}, {"seq": 3, "kind": "追击", "label": "操军轻进", "desc": "诸侯不从，操独引万余人连夜追来。", "x": 776.0, "y": 426.5}, {"seq": 4, "kind": "伏发", "label": "大败中箭", "desc": "伏兵四出，操中箭中枪，坐骑被夺，赖曹洪让马得免。", "x": 776.7, "y": 423.7}, {"seq": 5, "kind": "败归", "label": "愤别联军", "desc": "操归营见诸侯置酒高会，愤而出走，联军自此离析。", "x": 823.4, "y": 402.5}]}, {"id": "pan_he_zhi_zhan", "name": "磐河·界桥之战", "event_id": "pan_he_xiang_zheng", "year": 191, "date_text": "初平二年（191）冬", "place_name": "磐河", "summary": "绍军磐河桥东、瓒军桥西；麴义伏盾斩严纲大破白马义从，赵云单骑救主，刘关张来援，董卓假诏和解。", "nodes": [{"seq": 1, "kind": "起兵", "label": "瓒出幽州", "desc": "公孙越被杀，瓒尽起幽州之兵攻绍，以报弟仇。", "x": 878.0, "y": 198.5}, {"seq": 2, "kind": "夺州", "label": "绍据冀州", "desc": "逢纪献策赚韩馥，绍不费一兵而得冀州，兼并其众。", "x": 819.9, "y": 300.5}, {"seq": 3, "kind": "对峙", "label": "会于磐河", "desc": "两军会于磐河之上，绍军桥东、瓒军桥西。", "x": 850.3, "y": 316.2}, {"seq": 4, "kind": "伏发", "label": "麴义斩严纲", "desc": "白马义从轻进，盾下弩发，严纲被斩，瓒军大败。", "x": 852.3, "y": 315.2}, {"seq": 5, "kind": "救主", "label": "赵云突阵", "desc": "绍兵合围，赵云单骑突入救瓒，且战且退。", "x": 848.8, "y": 317.1}, {"seq": 6, "kind": "来援", "label": "三雄冲阵", "desc": "刘关张引兵冲阵，绍军溃退，自此相拒月余。", "x": 851.1, "y": 318.5}]}, {"id": "xian_shan_zhi_zhan", "name": "岘山之战", "event_id": "sun_jian_zhi_si", "year": 192, "date_text": "初平三年（192）", "place_name": "岘山", "summary": "孙坚破樊城、围襄阳；蒯良遣吕公诱敌，坚夜追入岘山，伏兵四起，中箭滚石而亡，年三十七。", "nodes": [{"seq": 1, "kind": "起兵", "label": "坚出长沙", "desc": "坚以夺玺截路之恨，尽起江东兵伐刘表，水陆并进。", "x": 757.0, "y": 727.8}, {"seq": 2, "kind": "首捷", "label": "樊城破黄祖", "desc": "黄祖出战败走，坚乘胜进围襄阳。", "x": 725.0, "y": 551.9}, {"seq": 3, "kind": "围城", "label": "坚围襄阳", "desc": "蒯良守城运筹，遣吕公夜缒出城求救并诱敌。", "x": 725.5, "y": 553.4}, {"seq": 4, "kind": "中伏", "label": "岘山殒命", "desc": "坚追吕公入山，号炮起处乱箭滚石俱下，坚卒，年三十七。", "x": 727.7, "y": 555.7}]}, {"id": "chang_an_zhi_zhan", "name": "长安之战", "event_id": "li_jue_guo_si_zhi_luan", "year": 192, "date_text": "初平三年（192）五月—六月", "place_name": "长安", "summary": "贾诩一言激起凉州兵十万西攻长安；吕布迎战失利，城内降兵反戈，城破，王允殉难，四将专权。", "nodes": [{"seq": 1, "kind": "起兵", "label": "贾诩献策", "desc": "四将逃居陕西，诩曰「不如相率而西，攻长安」。", "x": 349.9, "y": 280.2}, {"seq": 2, "kind": "进军", "label": "昼夜兼程", "desc": "聚十余万凉州兵，杀奔长安，沿途收卓旧部。", "x": 596.7, "y": 444.8}, {"seq": 3, "kind": "会战", "label": "布迎失利", "desc": "吕布出迎，傕退山以矢石困之，郭汜自后夹击。", "x": 600.3, "y": 446.7}, {"seq": 4, "kind": "城破", "label": "降兵内应", "desc": "城中叱降兵反戈，长安遂破，死者数万。", "x": 598.7, "y": 445.3}, {"seq": 5, "kind": "结局", "label": "王允殉难", "desc": "允拒降坠楼而死，四将纵兵大掠，把持朝政。", "x": 597.5, "y": 443.9}]}, {"id": "xuzhou_fu_chou", "name": "徐州屠城之战", "event_id": "cao_tao_xuzhou_zhi_zhan", "year": 194, "date_text": "兴平元年（194）", "place_name": "徐州", "summary": "曹操为父复仇东征，所过屠戮；刘备孔融驰援不支，吕布袭兖州令操罢兵——徐州之祸暂解。", "nodes": [{"seq": 1, "kind": "出兵", "label": "起大军东征", "desc": "留荀彧程昱守鄄城，尽起大军令屠城。", "x": 881.2, "y": 399.2}, {"seq": 2, "kind": "攻伐", "label": "所过屠戮", "desc": "攻拔徐州城池，鸡犬不留，泗水不流。", "x": 924.7, "y": 449.5}, {"seq": 3, "kind": "救援", "label": "北海解围", "desc": "刘备关羽驰援，数十合斩管亥，与田楷会徐州。", "x": 1004.6, "y": 337.8}, {"seq": 4, "kind": "对峙", "label": "徐州城下", "desc": "陶谦让徐州，刘备初辞不受。", "x": 922.7, "y": 448.6}, {"seq": 5, "kind": "结局", "label": "吕布袭兖州", "desc": "陈宫张邈迎吕布，操退兵回救，徐州暂解。", "x": 859.8, "y": 390.5}]}, {"id": "puyang_zhi_bian", "name": "濮阳中伏", "event_id": "puyang_zhi_zhan", "year": 194, "date_text": "兴平元年（194）", "place_name": "濮阳", "summary": "田氏诈降诱操入城，吕布伏兵四起；吕布当面戟击操盔而不识，典韦冲杀救主——操平生最险一役。", "nodes": [{"seq": 1, "kind": "诱敌", "label": "田氏献门", "desc": "城内大户田氏诈降，操自率军入。", "x": 839.7, "y": 380.3}, {"seq": 2, "kind": "中伏", "label": "六将围操", "desc": "北巷张辽、东巷臧霸、西巷高顺、南巷郝萌等围之。", "x": 841.6, "y": 379.4}, {"seq": 3, "kind": "脱身", "label": "布不识操", "desc": "布戟击操盔问「曹操何在」，操反指黄马者。", "x": 837.7, "y": 381.7}, {"seq": 4, "kind": "救主", "label": "典韦冲杀", "desc": "操遇火坠马，典韦再入救出。", "x": 840.8, "y": 382.6}]}, {"id": "xuzhou_yi_shou", "name": "下邳夜袭", "event_id": "lv_bu_xi_xuzhou", "year": 196, "date_text": "建安元年（196）", "place_name": "徐州", "summary": "张飞醉酒鞭曹豹，豹引吕布夜袭下邳；飞醉不能战，弃城而走——刘备半生基业一夜易手。", "nodes": [{"seq": 1, "kind": "内应", "label": "豹修书布", "desc": "张飞醉鞭曹豹，豹连夜书吕布约袭。", "x": 925.9, "y": 448.6}, {"seq": 2, "kind": "夜袭", "label": "布入下邳", "desc": "布五百骑先入，举火呐喊，飞醉卧不醒。", "x": 924.7, "y": 449.5}, {"seq": 3, "kind": "易主", "label": "徐州易手", "desc": "飞弃城走，备家小陷落，布自领州事。", "x": 922.7, "y": 450.9}]}, {"id": "wancheng_ye_zhan", "name": "宛城夜战", "event_id": "wancheng_zhi_bian", "year": 197, "date_text": "建安二年（197）正月", "place_name": "宛城", "summary": "绣夜袭曹营，典韦失戟死战于辕门，操中箭由昂让马得脱——宛城一夜，操折典韦、昂、安民三人。", "nodes": [{"seq": 1, "kind": "夜起", "label": "绣军四起", "desc": "二更绣军举火喊杀，曹营仓促应战。", "x": 740.7, "y": 507.5}, {"seq": 2, "kind": "死战", "label": "典韦据辕门", "desc": "韦失戟步战，挟两尸迎敌，至死不退。", "x": 742.6, "y": 508.4}, {"seq": 3, "kind": "脱身", "label": "昂让马", "desc": "操中箭，昂以己马授操，父子自此永诀。", "x": 739.1, "y": 506.1}, {"seq": 4, "kind": "收兵", "label": "淯水祭奠", "desc": "操收兵淯水岸，设祭哭典韦。", "x": 743.5, "y": 535.4}]}, {"id": "dong_gui_hu_jia", "name": "护驾东归", "event_id": "xian_di_dong_gui", "year": 195, "date_text": "兴平二年（195）", "place_name": "弘农", "summary": "杨奉董承等护献帝东归，李傕郭汜追击，东涧曹阳血战——帝后徒步渡河，随驾者十不存一。", "nodes": [{"seq": 1, "kind": "出逃", "label": "长安出关", "desc": "傕汜相攻，帝后随杨奉董承出关东走。", "x": 599.9, "y": 445.8}, {"seq": 2, "kind": "血战", "label": "东涧之败", "desc": "傕汜追至东涧，董承杨奉力战，辎重尽弃。", "x": 668.4, "y": 429.2}, {"seq": 3, "kind": "再败", "label": "曹阳再战", "desc": "复败于曹阳，士卒死者不可胜数。", "x": 670.7, "y": 430.2}, {"seq": 4, "kind": "北渡", "label": "徒步过河", "desc": "帝后徒步渡黄河至安邑。", "x": 666.0, "y": 427.8}, {"seq": 5, "kind": "还都", "label": "洛阳残破", "desc": "至洛阳宫室尽毁，随驾十不存一。", "x": 737.7, "y": 432.9}]}, {"id": "jiangdong_pingding", "name": "江东平定战", "event_id": "sun_ce_ding_jiangdong", "year": 195, "date_text": "兴平二年（195）起", "place_name": "曲阿", "summary": "牛渚—秣陵—曲阿—吴郡—会稽，孙策数年连破刘繇、严白虎、王朗，尽定江东。", "nodes": [{"seq": 1, "kind": "渡江", "label": "首夺牛渚", "desc": "以玉玺质术借兵三千，渡江首捷。", "x": 976.1, "y": 566.8}, {"seq": 2, "kind": "攻坚", "label": "秣陵降礼", "desc": "薛礼、笮融屯秣陵拒之，城破礼死。", "x": 990.0, "y": 555.2}, {"seq": 3, "kind": "会战", "label": "曲阿破繇", "desc": "神亭酣斗收太史慈，繇败走豫章。", "x": 1017.3, "y": 555.7}, {"seq": 4, "kind": "西进", "label": "乌程破虎", "desc": "严白虎弟请和被杀，虎走余杭为凌操所杀。", "x": 1041.4, "y": 604.6}, {"seq": 5, "kind": "奇袭", "label": "夜出查渎", "desc": "佯攻查渎，夜袭王朗屯处。", "x": 1046.2, "y": 639.2}, {"seq": 6, "kind": "定局", "label": "会稽定", "desc": "朗败降，虞翻来归，江东遂定。", "x": 1057.2, "y": 647.5}]}, {"id": "xutian_dawei", "name": "许田打围", "event_id": "yidai_zhao", "year": 199, "date_text": "建安四年（199）", "place_name": "许田", "summary": "操借天子仪仗打围，受贺僭越「遮前欺后」；关羽拍弓欲杀，备止之——汉曹决裂的标志性一幕。", "nodes": [{"seq": 1, "kind": "出猎", "label": "借天子仪仗", "desc": "操请帝田猎，帝曰「欲观卿之武艺」。", "x": 800.1, "y": 460.2}, {"seq": 2, "kind": "僭越", "label": "遮帝受贺", "desc": "操纵马遮于帝前受「万岁」之贺。", "x": 801.7, "y": 459.2}, {"seq": 3, "kind": "杀机", "label": "云长欲斩", "desc": "关羽拍弓欲杀，备摇手止之。", "x": 798.5, "y": 461.5}]}, {"id": "bai_ma_zhi_wei", "name": "白马之围", "event_id": "guandu_zhi_zhan", "year": 200, "date_text": "建安五年（200）", "place_name": "白马", "summary": "颜良围白马，刘延告急。曹操引兵解围，关羽为先锋遥望麾盖，刺颜良于万军之中——斩首而还，白马之围遂解。", "nodes": [{"seq": 1, "kind": "围城", "label": "颜良围白马", "desc": "袁绍遣颜良十万攻刘延于白马，围之甚急。", "x": 819.5, "y": 388.6}, {"seq": 2, "kind": "出兵", "label": "声东击西", "desc": "操佯渡延津，绍分兵西应；操轻兵疾趋白马。", "x": 806.8, "y": 408.9}, {"seq": 3, "kind": "攻伐", "label": "阵斩颜良", "desc": "关羽望见麾盖，策马刺良于万军之中，斩首而还。", "x": 820.7, "y": 386.8}, {"seq": 4, "kind": "结局", "label": "白马解围", "desc": "袁军夺气溃退，围解；操表关羽汉寿亭侯。", "x": 824.6, "y": 390.0}]}, {"id": "yan_jin_zhi_zhan", "name": "延津之战", "event_id": "guandu_zhi_zhan", "year": 200, "date_text": "建安五年（200）", "place_name": "延津", "summary": "文丑刘备引兵追曹军，操令弃辎重于道。袁军争拾，操纵兵击之，关羽飞马直入刺文丑于马下。", "nodes": [{"seq": 1, "kind": "追击", "label": "文丑渡河", "desc": "文丑刘备引兵渡河追曹军，欲复白马之仇。", "x": 806.8, "y": 408.9}, {"seq": 2, "kind": "诱敌", "label": "辎重饵敌", "desc": "操令弃辎重于道，南退诱敌。", "x": 810.8, "y": 415.4}, {"seq": 3, "kind": "对峙", "label": "袁军争财", "desc": "袁军争拾辎重，阵形大乱。", "x": 812.8, "y": 413.1}, {"seq": 4, "kind": "攻伐", "label": "阵斩文丑", "desc": "关羽飞马直入，脑后一刀斩文丑于马下。", "x": 810.0, "y": 410.8}, {"seq": 5, "kind": "结局", "label": "袁军再败", "desc": "绍又折一将，河北夺气；备见旗号欲招关羽被阻。", "x": 808.8, "y": 409.8}]}, {"id": "guandu_battle", "name": "官渡决战", "event_id": "guandu_zhi_zhan", "year": 200, "date_text": "建安五年（200）", "place_name": "官渡", "summary": "以七万对七十万的官渡决战。土山地道相持，曹军粮尽几溃；许攸来投献乌巢之计，曹操亲率五千夜袭焚粮，张郃高览降曹反攻，袁军十万精锐一朝丧尽。", "nodes": [{"seq": 1, "kind": "出兵", "label": "袁军南下", "desc": "袁绍起七十万分营官渡，东西连营数十里。", "x": 820.7, "y": 384.5}, {"seq": 2, "kind": "对峙", "label": "土山霹雳车", "desc": "绍筑土山俯射，操造霹雳车发石；地道对长堑，相持月余。", "x": 799.6, "y": 428.4}, {"seq": 3, "kind": "攻伐", "label": "劫粮韩猛", "desc": "荀攸荐徐晃史涣截击韩猛，焚其粮草。", "x": 806.8, "y": 410.8}, {"seq": 4, "kind": "转折", "label": "许攸来投", "desc": "攸家属被审配收系，叛绍投操，献乌巢之计。", "x": 796.9, "y": 426.9}, {"seq": 5, "kind": "攻伐", "label": "夜袭乌巢", "desc": "操亲率五千诈打袁军旗号，四面纵火焚粮，淳于琼被擒。", "x": 816.7, "y": 403.8}, {"seq": 6, "kind": "结局", "label": "袁军大溃", "desc": "张郃高览降曹反攻，绍幅巾单骑北渡，八百余骑还邺。", "x": 823.4, "y": 352.9}]}, {"id": "bo_wang_po", "name": "博望坡之战", "event_id": "sangu_miaolu", "year": 208, "date_text": "建安十三年（208）", "place_name": "博望坡", "summary": "操遣夏侯惇十万攻新野。孔明新拜军师，众将不服；亮调关羽张飞屯博望坡两侧山林候火，赵云诈败诱敌。惇追至博望坡芦苇狭道，火起满山，曹军大溃。", "nodes": [{"seq": 1, "kind": "进兵", "label": "夏侯惇十万压境", "desc": "操遣惇领兵十万直逼新野。", "x": 763.3, "y": 507.7}, {"seq": 2, "kind": "诱敌", "label": "赵云诈败", "desc": "赵云出战只败不胜，诱惇入博望坡狭道。", "x": 755.4, "y": 496.2}, {"seq": 3, "kind": "火攻", "label": "火烧博望坡", "desc": "火起两翼芦苇山林，曹军大溃。", "x": 755.4, "y": 496.2}, {"seq": 4, "kind": "结局", "label": "惇突围走", "desc": "夏侯惇冒烟突走，回宛城请罪；孔明初战立威。", "x": 740.7, "y": 507.7}]}, {"id": "xin_ye_battle", "name": "新野之战", "event_id": "jingzhou_yizhu_huoshaoinye", "year": 208, "date_text": "建安十三年（208）", "place_name": "新野", "summary": "曹仁曹洪大军继至。孔明令百姓避入樊城，空新野设伏：曹仁大军入城屯扎，夜半火起满县，溃军出城遭关张截杀，白河水又淹，大败而退。", "nodes": [{"seq": 1, "kind": "进兵", "label": "曹仁曹洪继至", "desc": "操再遣大军，许褚为先锋攻新野。", "x": 734.0, "y": 529.8}, {"seq": 2, "kind": "设伏", "label": "空城藏火", "desc": "孔明迁民樊城，空城伏火待敌。", "x": 734.0, "y": 529.8}, {"seq": 3, "kind": "火攻", "label": "火烧新野", "desc": "夜半火起满县，曹军自相践踏。", "x": 734.0, "y": 529.8}, {"seq": 4, "kind": "截杀", "label": "关张白河截击", "desc": "溃军出城遭关羽张飞截杀，白河水又淹之。", "x": 724.9, "y": 552.0}, {"seq": 5, "kind": "结局", "label": "仁败退", "desc": "曹仁败还，备携民渡江走江夏，荆州易主。", "x": 810.8, "y": 618.5}]}, {"id": "chang_ban_battle", "name": "长坂坡之战", "event_id": "chang_ban_zhi_zhan", "year": 208, "date_text": "建安十三年（208）九月", "place_name": "长坂坡", "summary": "五千虎豹骑追及当阳长坂，备军溃。赵云单骑救阿斗七进七出，张飞断桥喝退追兵，刘备走汉津会关羽船队。", "nodes": [{"seq": 1, "kind": "追击", "label": "虎豹骑追及", "desc": "五千精骑一日一夜三百里，追及当阳长坂。", "x": 709.9, "y": 607.8}, {"seq": 2, "kind": "冲阵", "label": "云救阿斗", "desc": "赵云七进七出，怀抱阿斗突围。", "x": 709.9, "y": 607.8}, {"seq": 3, "kind": "断后", "label": "飞喝断桥", "desc": "张飞长坂桥三喝退敌，拆桥而走。", "x": 711.9, "y": 609.2}, {"seq": 4, "kind": "结局", "label": "汉津会师", "desc": "关羽船队接应渡汉水，与刘琦合兵江夏。", "x": 743.5, "y": 613.8}]}, {"id": "chi_bi_battle", "name": "赤壁之战", "event_id": "chi_bi_zhi_zhan", "year": 208, "date_text": "建安十三年（208）冬（十一月二十甲子祭风，火攻随后）", "place_name": "赤壁", "summary": "东南风大作，黄盖诈降火船直入曹军水寨，连环船一炬俱焚，火趁风威风助火势，曹军大溃。", "nodes": [{"seq": 1, "kind": "布阵", "label": "连环锁船", "desc": "曹军战船连锁屯江北，联军屯三江口。", "x": 783.1, "y": 654.0}, {"seq": 2, "kind": "借风", "label": "七星坛祭风", "desc": "孔明坛上祭风，东南风大起。", "x": 794.9, "y": 657.7}, {"seq": 3, "kind": "火攻", "label": "黄盖纵火", "desc": "诈降火船直入水寨，连环船一炬俱焚。", "x": 783.1, "y": 654.0}, {"seq": 4, "kind": "溃败", "label": "乌林败走", "desc": "曹军全面溃败，操自乌林陆路西走。", "x": 787.0, "y": 650.8}]}, {"id": "huarong_battle", "name": "华容道之战", "event_id": "chi_bi_zhi_zhan", "year": 208, "date_text": "建安十三年（208）冬", "place_name": "华容道", "summary": "操败走乌林、葫芦口、华容道三处伏兵皆过，最后华容道遇关羽。云长念昔日恩义，甘违军令状，放操一条生路。", "nodes": [{"seq": 1, "kind": "败走", "label": "乌林遇伏", "desc": "操自乌林西走，赵云截杀。", "x": 787.0, "y": 650.8}, {"seq": 2, "kind": "再败", "label": "葫芦口再败", "desc": "张飞截杀，曹军疲敝。", "x": 775.2, "y": 648.5}, {"seq": 3, "kind": "断后", "label": "华容对峙", "desc": "关羽五百校刀手拦路，曹军丧胆。", "x": 755.4, "y": 650.8}, {"seq": 4, "kind": "结局", "label": "义释曹操", "desc": "云长念旧恩放行，操走南郡。", "x": 755.4, "y": 650.8}]}, {"id": "hefei_battle", "name": "合肥之战", "event_id": "hefei_zhi_zhan", "year": 208, "date_text": "建安十三年末至十四年（208–209）", "place_name": "合肥", "summary": "权攻合肥不下，太史慈中伏箭亡，甘宁百骑夜劫曹营无一折损而还。", "nodes": [{"seq": 1, "kind": "围城", "label": "权攻合肥", "desc": "孙权大军围合肥，辽典进拒守。", "x": 928.7, "y": 560.3}, {"seq": 2, "kind": "夜袭", "label": "慈中辽伏", "desc": "太史慈夜袭中伏，箭伤而亡。", "x": 928.7, "y": 560.3}, {"seq": 3, "kind": "劫营", "label": "甘宁百骑", "desc": "宁领百骑夜劫曹营，全师而还。", "x": 933.4, "y": 556.2}, {"seq": 4, "kind": "结局", "label": "权军解围", "desc": "曹援将至，权退兵江东。", "x": 928.7, "y": 560.3}]}, {"id": "tongguan_battle", "name": "潼关之战", "event_id": "tongguan_zhi_zhan", "year": 211, "date_text": "建安十六年（211）", "place_name": "潼关", "summary": "超夺潼关杀得操割须弃袍；渭水许褚裸衣大战；贾诩反间离间超遂，操大破之。", "nodes": [{"seq": 1, "kind": "夺关", "label": "超占潼关", "desc": "超连破长安潼关，曹洪失关。", "x": 650.5, "y": 436.2}, {"seq": 2, "kind": "追杀", "label": "割须弃袍", "desc": "操为超追杀，割须弃袍，洪救主。", "x": 650.5, "y": 436.2}, {"seq": 3, "kind": "对峙", "label": "渭水褚超战", "desc": "许褚裸衣与超大战二百余合。", "x": 628.8, "y": 440.8}, {"seq": 4, "kind": "反间", "label": "离间超遂", "desc": "贾诩涂改书信，超疑韩遂。", "x": 628.8, "y": 440.8}, {"seq": 5, "kind": "结局", "label": "超败走羌中", "desc": "操乘乱掩杀，西凉联军溃散。", "x": 620.9, "y": 447.7}]}, {"id": "jiamengguan_battle", "name": "葭萌关之战", "event_id": "jiamengguan_zhi_zhan", "year": 214, "date_text": "建安十九年（214）", "place_name": "葭萌关", "summary": "张飞夜战马超二百余合不分胜负，孔明使反间计，李恢入羌中说降马超，超转攻成都。", "nodes": [{"seq": 1, "kind": "驰援", "label": "魏延先至", "desc": "魏延先率五百骑哨探，中马岱暗箭，岱误杀韩遂部将反为延所诱退。", "x": 468.2, "y": 539.1}, {"seq": 2, "kind": "单挑", "label": "飞战马超", "desc": "张飞与马超自午后酣战至夜，二百余合不分胜负。", "x": 468.2, "y": 539.1}, {"seq": 3, "kind": "夜战", "label": "添灯再战", "desc": "备怜飞，飞不肯休，两军添灯夜战又数十合，各有防备。", "x": 470.5, "y": 537.2}, {"seq": 4, "kind": "归降", "label": "李恢说超", "desc": "孔明反间使张鲁疑超，李恢入中说降，马超归刘。", "x": 462.6, "y": 544.6}]}, {"id": "xiaoyaojin_battle", "name": "逍遥津之战", "event_id": "xiaoyaojin_zhi_zhan", "year": 215, "date_text": "建安二十年（215）", "place_name": "合肥", "summary": "曹操密函教辽破敌：辽夜选八百壮士突入权麾下，权仓皇奔走，赖凌统死战得脱，吴人谈辽色变。", "nodes": [{"seq": 1, "kind": "围城", "label": "权围合肥", "desc": "孙权十万众围合肥，守军七千。", "x": 926.7, "y": 562.2}, {"seq": 2, "kind": "突袭", "label": "辽八百破阵", "desc": "张辽夜募八百人，平明突入权麾，权奔高冢自守。", "x": 929.5, "y": 559.4}, {"seq": 3, "kind": "追击", "label": "津北截击", "desc": "权退兵，辽觇之率骑追击于逍遥津北。", "x": 928.3, "y": 560.3}, {"seq": 4, "kind": "死战", "label": "凌统殁卫", "desc": "凌统三百亲卫陷围尽殁，身被数创护权得脱。", "x": 928.3, "y": 560.3}, {"seq": 5, "kind": "结局", "label": "权飞渡津", "desc": "谷利鞭马助势，权飞渡断桥而还，吴军丧胆。", "x": 927.5, "y": 561.2}]}, {"id": "dingjunshan_battle", "name": "定军山之战", "event_id": "dingjunshan_zhi_zhan", "year": 219, "date_text": "建安二十四年正月（219）", "place_name": "定军山", "summary": "法正居高临下以逸待劳，午时红旗一挥，黄忠驰下山连头带肩砍夏侯渊为两段，定军山蜀军全胜。", "nodes": [{"seq": 1, "kind": "对峙", "label": "隔山相持", "desc": "黄忠与法正屯定军山口，累次挑战，夏侯渊坚守不出。", "x": 508.9, "y": 503.5}, {"seq": 2, "kind": "夺山", "label": "夜夺对山", "desc": "二更杀上对面高山，杜袭弃山而走；法正居顶，白旗红旗为号。", "x": 507.7, "y": 504.9}, {"seq": 3, "kind": "突袭", "label": "斩夏侯渊", "desc": "午时曹兵倦怠，红旗招展，黄忠驰下山，连头带肩砍渊为两段。", "x": 510.1, "y": 502.2}, {"seq": 4, "kind": "追击", "label": "郃败走汉水", "desc": "黄忠陈式两下夹攻，张郃败走；刘封、孟达已夺山栅。", "x": 506.9, "y": 505.8}, {"seq": 5, "kind": "接应", "label": "云救黄忠", "desc": "汉水北山劫粮之役，赵云杀入重围救出黄忠、张著。", "x": 507.7, "y": 504.9}]}, {"id": "shuiyan_qijun_battle", "name": "水淹七军", "event_id": "shuiyan_qijun", "year": 219, "date_text": "建安二十四年八月（219）", "place_name": "樊城", "summary": "关羽观襄江水势，预造船筏，八月骤雨决水淹于禁七军于罾口川：禁降、德死，华夏皆惊。", "nodes": [{"seq": 1, "kind": "攻城", "label": "兵临樊城", "desc": "关平攻樊城，公自迎庞德；德军前抬榇誓死战。", "x": 724.9, "y": 552.0}, {"seq": 2, "kind": "单挑", "label": "德射关公", "desc": "庞德虚作拖刀暗箭射中关公左臂；于禁忌功鸣金收军。", "x": 726.1, "y": 552.9}, {"seq": 3, "kind": "水攻", "label": "决水罾口川", "desc": "秋雨骤雨，襄江泛涨，堰口放水，七军随波逐浪。", "x": 724.5, "y": 551.1}, {"seq": 4, "kind": "擒将", "label": "禁降德死", "desc": "于禁拜伏乞降；庞德堤上死战，被周仓生擒，骂贼受刑。", "x": 725.3, "y": 551.5}, {"seq": 5, "kind": "围城", "label": "樊城危急", "desc": "水围樊城，曹仁欲走，满宠谏固守，旬日水退。", "x": 724.9, "y": 552.0}]}, {"id": "xiaoting_battle", "name": "猇亭之战", "event_id": "xiaoting_zhi_zhan", "year": 222, "date_text": "章武元年至二年（221–222）", "place_name": "猇亭", "summary": "刘备亲征伐吴，陆逊以逸待劳，火烧连营七百里大破蜀军，备退保白帝城，蜀汉元气大伤。", "nodes": [{"seq": 1, "kind": "出师", "label": "御驾伐吴", "desc": "张飞遇害后刘备决意东征，自秭归推进，水陆并进声势震天。", "x": 665.6, "y": 607.8}, {"seq": 2, "kind": "拜将", "label": "逊拜都督", "desc": "孙权筑坛拜陆逊大都督假节钺，逊令诸将坚守隘口不许轻出。", "x": 697.2, "y": 622.2}, {"seq": 3, "kind": "对峙", "label": "移营避暑", "desc": "相持经夏，备移营山林依溪傍涧，夹江连营七百里四十余屯。", "x": 691.7, "y": 614.3}, {"seq": 4, "kind": "火攻", "label": "火烧连营", "desc": "初更东南风起，吴兵顺风举火，间屯而烧，蜀军全线崩溃。", "x": 697.2, "y": 622.2}, {"seq": 5, "kind": "结局", "label": "退保白帝", "desc": "赵云杀入重围救备，仅百余人入白帝城；逊见八阵图疑有伏而还。", "x": 623.6, "y": 599.1}]}, {"id": "qiqin_menghuo_battle", "name": "七擒孟获", "event_id": "qiqin_menghuo", "year": 225, "date_text": "建兴三年（225）", "place_name": "建宁", "summary": "诸葛亮南征，攻心为上，七擒孟获而七纵之，终使其倾心归服，南人不复反矣。", "nodes": [{"seq": 1, "kind": "南征", "label": "破三郡初擒", "desc": "亮用反间平雍闿朱褒高定三郡，锦带山魏延伏兵初擒孟获而纵之。", "x": 395.4, "y": 854.3}, {"seq": 2, "kind": "渡泸", "label": "渡泸再擒", "desc": "大军渡泸水，破三洞元帅，获再被擒再纵，蛮兵丧胆。", "x": 347.9, "y": 892.2}, {"seq": 3, "kind": "攻城", "label": "包土破三江", "desc": "获借朵思大王毒弩守三江城，亮令军士衣襟包土，一夜积蹬破城。", "x": 349.9, "y": 894.5}, {"seq": 4, "kind": "破法", "label": "假兽破兽兵", "desc": "木鹿大王驱虎豹毒蛇，亮出木刻巨兽吐火喷烟，真兽反奔，占银坑洞。", "x": 347.9, "y": 892.2}, {"seq": 5, "kind": "火攻", "label": "焚藤甲于盘蛇谷", "desc": "魏延连输十五阵赚兀突骨藤甲军入谷，地雷火炮齐发，三万藤甲尽焚。", "x": 347.9, "y": 890.8}, {"seq": 6, "kind": "归服", "label": "七纵南定", "desc": "马岱七擒孟获，获肉袒谢罪永不复反；亮令永为洞主，班师渡泸。", "x": 395.4, "y": 854.3}]}, {"id": "jieting_battle", "name": "街亭之战", "event_id": "jieting_zhi_zhan", "year": 228, "date_text": "建兴六年春（228）", "place_name": "街亭", "summary": "马谡熟读兵书而纸上谈兵，山上屯军被张郃断水围困，兵败失街亭；孔明借空城计退司马懿十五万，归而挥泪斩谡、自贬三等。", "nodes": [{"seq": 1, "kind": "布防", "label": "谡违平谏", "desc": "马谡舍五路总口当道之地，屯兵山上；王平引五千离山十里下寨，画图星夜报孔明。", "x": 469.0, "y": 420.9}, {"seq": 2, "kind": "围困", "label": "郃断汲道", "desc": "张郃断水围山自辰至戌，蜀兵不战自乱，半夜开寨门降魏。", "x": 470.1, "y": 422.8}, {"seq": 3, "kind": "溃败", "label": "延复失亭", "desc": "魏延复夺街亭反被懿抄后围困，王平杀入救出，郭淮袭取列柳城。", "x": 467.8, "y": 420.0}, {"seq": 4, "kind": "奇计", "label": "空城退敌", "desc": "懿十五万趋西城，亮二千五百人焚香操琴大开四门，懿疑伏而退。", "x": 470.5, "y": 423.2}, {"seq": 5, "kind": "正法", "label": "挥泪斩谡", "desc": "归汉中明正军法斩马谡，蒋琬救之不听；亮自贬三等。", "x": 522.0, "y": 503.1}]}, {"id": "chencang_battle", "name": "陈仓之战", "event_id": "chencang_zhi_zhan", "year": 229, "date_text": "建兴六年末至七年初（229）", "place_name": "陈仓", "summary": "郝昭死守陈仓二十余日，说降、云梯、冲车、地道诸法皆破；孔明粮尽退兵，密计使魏延斩王双；旋乘昭病重袭取陈仓，姜维计赚斩费耀。", "nodes": [{"seq": 1, "kind": "拒降", "label": "昭拒靳祥", "desc": "靳祥两度入城说降，郝昭拈弓厉声：但有死而已！", "x": 531.5, "y": 444.5}, {"seq": 2, "kind": "攻城", "label": "火箭烧梯", "desc": "云梯冲车地道轮番进攻，昭以火箭飞石重壕一一破之，相持二十余日。", "x": 531.9, "y": 445.8}, {"seq": 3, "kind": "斩将", "label": "双挫蜀锋", "desc": "王双连斩谢雄龚起，流星锤重伤张嶷，蜀兵折伤甚多。", "x": 533.1, "y": 446.8}, {"seq": 4, "kind": "诈降", "label": "维赚费耀", "desc": "姜维假密书诈降曹真，费耀五万兵中伏自刎，孔明直出祁山。", "x": 450.8, "y": 453.2}, {"seq": 5, "kind": "伏杀", "label": "延斩王双", "desc": "亮粮尽密退，王双追击，营中火起回军，山坡上被魏延一刀斩之。", "x": 530.3, "y": 443.5}, {"seq": 6, "kind": "破城", "label": "袭取陈仓", "desc": "郝昭病重，魏延姜维星夜袭城，昭惊死；亮怜其忠，扶柩归魏。", "x": 531.5, "y": 445.4}]}, {"id": "wu_zhang_yuan_battle", "name": "五丈原之战", "event_id": "wu_zhang_yuan_zhi_zhan", "year": 234, "date_text": "建兴十二年（234）", "place_name": "五丈原", "summary": "诸葛亮与司马懿相持五丈原，遗巾帼激战不得；禳星不果，秋风五丈原丞相归天，姜维杨仪按遗计退兵，木像惊走仲达。", "nodes": [{"seq": 1, "kind": "对峙", "label": "屯兵五丈原", "desc": "亮屯五丈原与懿隔渭相持，懿曰：若出渭南西止五丈原，方无事也。", "x": 547.7, "y": 445.4}, {"seq": 2, "kind": "火攻", "label": "上方谷之计", "desc": "懿父子中伏上方谷，忽天降大雨扑灭地雷火，懿得脱，遂坚壁不出。", "x": 548.5, "y": 444.5}, {"seq": 3, "kind": "激将", "label": "巾帼之辱", "desc": "亮遗巾帼妇衣激懿决战，懿受之不怒，问使寝食，食少事烦岂能长久。", "x": 548.1, "y": 445.8}, {"seq": 4, "kind": "禳星", "label": "主灯扑灭", "desc": "亮禳星六夜，魏延飞步入告扑灭主灯，死生有命不可禳也。", "x": 547.3, "y": 444.9}, {"seq": 5, "kind": "病卒", "label": "秋风五丈原", "desc": "亮强病遍观各营，叹再不能临阵讨贼，卒于军中，年五十四。", "x": 547.7, "y": 445.4}, {"seq": 6, "kind": "疑兵", "label": "死诸葛走生仲达", "desc": "姜维杨仪推木像回旗返鼓，懿惊奔五十余里，蜀中谚传死诸葛走生仲达。", "x": 546.9, "y": 446.3}]}, {"id": "xiang_ping_battle", "name": "襄平之战", "event_id": "gongsun_yuan_zhi_pan", "year": 238, "date_text": "景初二年（238）", "place_name": "襄平", "summary": "公孙渊僭号燕王，司马懿东征：弃辽隧捣虚襄平，围城一月不避大雨，城破斩渊父子，传首洛阳。", "nodes": [{"seq": 1, "kind": "对峙", "label": "辽隧僵持", "desc": "卑衍杨祚八万兵屯辽隧围堑二十余里，魏兵不与交战。", "x": 1160.9, "y": 126.9}, {"seq": 2, "kind": "捣虚", "label": "直趋襄平", "desc": "懿弃辽隧从小路径奔襄平，贼必往救，中途伏击。", "x": 1161.7, "y": 126.0}, {"seq": 3, "kind": "围困", "label": "雨困襄平", "desc": "秋雨一月平地水深三尺，懿斩谏移营者，运粮船直抵城下。", "x": 1162.5, "y": 125.1}, {"seq": 4, "kind": "破城", "label": "斩渊父子", "desc": "渊父子突围南走，四面围合就缚受戳，宗族七十余首级号令。", "x": 1162.1, "y": 125.5}]}, {"id": "huainan_sanzhong_battle", "name": "淮南三叛·诸葛诞之役", "event_id": "huainan_sanzhong_zhuge_dan", "year": 257, "date_text": "魏甘露二年—三年（257–258）", "place_name": "寿春", "summary": "诸葛诞讨司马昭，联吴困守寿春；钟会献策攻心，围城经年城破，诞死节，三叛俱平。", "nodes": [{"seq": 1, "kind": "起兵", "label": "斩乐綝举兵", "desc": "诞知贾充告变，攻扬州斩乐綝，聚兵十余万，质子入吴求援。", "x": 908.9, "y": 527.1}, {"seq": 2, "kind": "野战", "label": "以利诱敌", "desc": "钟会令弃牛马驴骡遍野，南兵争取无心恋战，伏兵杀出，诞大败退入寿春。", "x": 901.8, "y": 544.6}, {"seq": 3, "kind": "围城", "label": "三面留门", "desc": "钟会献策留南门大路容贼自走，走而击之，并断吴兵粮道。", "x": 908.9, "y": 527.1}, {"seq": 4, "kind": "援绝", "label": "朱异被斩", "desc": "孙綝怒斩累败之朱异，自回建业；全怿全端得家书开门出降。", "x": 943.7, "y": 513.2}, {"seq": 5, "kind": "攻心", "label": "文鸯来投", "desc": "诞杀文钦，鸯虎兄弟越壕降魏获封，绕城劝降，城内人心瓦解。", "x": 908.9, "y": 527.1}, {"seq": 6, "kind": "破城", "label": "寿春城破", "desc": "曾宣献北门，诞出走被胡奋斩于吊桥；部曲数百人无一降者。", "x": 908.9, "y": 527.1}]}, {"id": "toudu_yinping_battle", "name": "偷度阴平·绵竹之战", "event_id": "toudu_yinping_mianzhu", "year": 263, "date_text": "魏景元四年（263）", "place_name": "绵竹", "summary": "邓艾自阴平凿山裹毡七百里无人之境，江油纳降、涪城降附，绵竹力战破诸葛瞻父子，蜀汉遂亡。", "nodes": [{"seq": 1, "kind": "偷渡", "label": "裹毡下岭", "desc": "邓艾自阴平行七百里无人之境，裹毡滚下摩天岭，二千余人尽度。", "x": 430.2, "y": 510.5}, {"seq": 2, "kind": "纳降", "label": "江油献城", "desc": "马邈不备出降，其妻李氏骂夫自缢；涪城军民尽降。", "x": 430.2, "y": 578.3}, {"seq": 3, "kind": "对阵", "label": "木像退敌", "desc": "诸葛瞻列八阵，木刻武侯遗像惊走师纂邓忠，蜀兵掩杀二十余里。", "x": 411.2, "y": 584.3}, {"seq": 4, "kind": "死战", "label": "瞻父子殉国", "desc": "瞻扯书斩使，被围自刎报国，诸葛尚策马死于阵中，绵竹陷落。", "x": 411.2, "y": 584.3}, {"seq": 5, "kind": "亡国", "label": "后主出降", "desc": "谯周力主降魏，后主面缚舆榇出北门十里而降，姜维在剑阁闻讯大惊失语。", "x": 406.1, "y": 615.7}]}, {"id": "taoxi_battle", "name": "洮西之战", "event_id": "taoxi_dajie", "year": 255, "date_text": "正元二年（255）", "place_name": "狄道", "summary": "姜维洮西大破王经，经众数万溺于洮水，退保狄道；维围之，陈泰驰援解围，邓艾继起拒维。", "nodes": [{"seq": 1, "kind": "进军", "label": "维出阳平关", "desc": "姜维起兵二十万出阳平关伐魏，与夏侯霸议取陇西。", "x": 372.0, "y": 385.4}, {"seq": 2, "kind": "会战", "label": "洮西大战", "desc": "王经背洮水而阵，蜀军两翼夹击，魏兵大溃，溺死于洮水者数万。", "x": 398.5, "y": 397.8}, {"seq": 3, "kind": "围城", "label": "围狄道", "desc": "王经残部退保狄道，姜维乘胜进围。", "x": 398.5, "y": 397.8}, {"seq": 4, "kind": "解围", "label": "陈泰驰援", "desc": "陈泰星夜驰援，扬声截维归路，维粮尽解围而退。", "x": 396.6, "y": 400.2}, {"seq": 5, "kind": "拒守", "label": "邓艾继起", "desc": "魏以邓艾拒维，维退屯钟提，洮西之败震动关陇。", "x": 399.3, "y": 394.6}]}], "events": [{"id": "huang_jin_qi_yi", "name": "黄巾起义", "kind": "军事行动", "summary": "张角以太平道聚众数十万，八州同时举事，官军望风而靡，汉室自此动摇。"}, {"id": "shi_chang_shi_zhi_luan", "name": "十常侍之乱", "kind": "宫廷政变", "summary": "灵帝崩，蹇硕谋立刘协不成；大将军何进谋诛宦官反被张让所杀，袁绍尽诛宦官，张让劫少帝出奔北邙山——外兵董卓趁虚入京。"}, {"id": "dong_zhuo_fei_li", "name": "董卓废立", "kind": "政治事件", "summary": "董卓以「天子暗弱，不可以奉宗庙」废少帝为弘农王、立陈留王刘协，自专朝政；丁原、袁绍、卢植反抗者或死或走，何太后与弘农王随后遇害。"}, {"id": "meng_de_xian_dao", "name": "孟德献刀", "kind": "刺杀事件", "summary": "曹操持王允七宝刀入相府行刺董卓，事败托名献刀，逃出洛阳，中牟被擒得陈宫相释，误杀吕伯奢一家——「宁教我负天下人」定其枭雄底色。"}, {"id": "tao_dong_shi_ba_lu", "name": "十八路诸侯讨董", "kind": "军事行动", "summary": "曹操发矫诏，十八路诸侯会盟共讨董卓，袁绍为盟主。孙坚先破汜水关，刘关张虎牢关前战吕布；董卓焚洛阳迁都长安，联军队形涣散，止于虎牢——讨董无功而散。"}, {"id": "sun_jian_ni_xi", "name": "孙坚匿玺", "kind": "政治事件", "summary": "孙坚入洛阳救火，于南殿井中得传国玉玺，匿而辞归江东；袁绍索之不得，密令刘表于路截击——孙刘由此结怨，埋下孙坚之死。"}, {"id": "pan_he_xiang_zheng", "name": "磐河相争（界桥之战）", "kind": "军事行动", "summary": "袁绍用逢纪之策赚取冀州，又杀公孙越激怒公孙瓒；两军会于磐河，麴义斩严纲、瓒军大败，赵云突阵救主，刘关张来援，绍败走——董卓假天子诏和解。"}, {"id": "sun_jian_zhi_si", "name": "孙坚之死", "kind": "军事事件", "summary": "孙坚以刘表截击之恨起兵伐荆州，围襄阳；蒯良使吕公突围求救并诱坚追击，坚于岘山中伏，为乱箭滚石所杀——年仅三十七，孙策继业。"}, {"id": "lian_huan_ji", "name": "连环计·凤仪亭", "kind": "政治事件", "summary": "王允以貂蝉许吕布而献董卓，离间其父子；吕布与貂蝉私会凤仪亭，卓掷戟相向——父子仇隙既成，王允收吕布，诛董之局成。"}, {"id": "dong_zhuo_zhi_si", "name": "董卓之死", "kind": "政治事件", "summary": "王允与吕布定计，使李肃奉诏诱卓出郿坞；卓入朝至受禅台，布戟刺其喉——百姓歌舞于道，卓尸置市燃之，郿坞抄没。"}, {"id": "li_jue_guo_si_zhi_luan", "name": "李傕郭汜之乱", "kind": "军事行动", "summary": "贾诩一言激起凉州兵反攻长安，吕布出走、王允殉难；此后李傕郭汜把持朝政、自相攻杀，献帝颠沛——汉室名存实亡，曹操得迎奉之机。"}, {"id": "cao_tao_xuzhou_zhi_zhan", "name": "曹操东征徐州", "kind": "军事行动", "summary": "曹嵩过徐州被张闿所杀，曹操尽起大军东征，所到之处鸡犬不留；刘备、田楷、孔融驰援，吕布陈宫袭兖州，操被迫退兵。"}, {"id": "puyang_zhi_zhan", "name": "濮阳·兖州争夺", "kind": "军事行动", "summary": "陈宫张邈迎吕布入兖州，郡县响应，曹操仅余鄄城等三城。濮阳城内田氏诈降诱操入城，操中伏几死，赖典韦死战得出。相持岁余，蝗灾起，双方罢兵。"}, {"id": "lv_bu_xi_xuzhou", "name": "吕布袭徐州", "kind": "军事行动", "summary": "袁术许粮马金帛约吕布夹攻刘备；吕布夜袭下邳，张飞醉酒失城，刘备家小陷落。刘备进退无路，反屯小沛附布。"}, {"id": "yuanmen_sheji", "name": "辕门射戟", "kind": "政治事件", "summary": "纪灵三万兵攻刘备，布恐唇亡齿寒，设宴辕门、以射戟为赌：一箭中戟小枝，两家罢兵——「将军天威也」。"}, {"id": "wancheng_zhi_bian", "name": "宛城之变", "kind": "军事行动", "summary": "曹操纳张绣叔母邹氏，绣用贾诩计夜反；典韦失戟战死，曹昂让马救父、曹安民皆遇害——操平生最惨之败。"}, {"id": "xian_di_dong_gui", "name": "献帝东归", "kind": "政治事件", "summary": "李傕郭汜相攻，献帝与伏皇后随驾东归，杨奉董承韩暹等血战护驾；至洛阳宫室尽毁，曹操迎天子都许——「挟天子以令诸侯」自此始。"}, {"id": "sun_ce_ding_jiangdong", "name": "孙策定江东", "kind": "军事行动", "summary": "孙策以传国玺质袁术借兵三千渡江，牛渚首捷、曲阿破刘繇、收太史慈，下乌程破严白虎、奇袭会稽降王朗——数年之间尽有江东，为孙吴立国之基。"}, {"id": "yidai_zhao", "name": "衣带诏", "kind": "政治事件", "summary": "献帝以血书付董承，承与王子服等六人、马腾、刘备歃血为盟谋诛曹操；事泄三族被诛，董贵妃有孕亦被杀。"}, {"id": "yidai_zhao_shipou", "name": "衣带诏事泄", "kind": "宫廷政变", "summary": "董承受献帝衣带诏，联合六臣歃血谋曹；吉平下毒事泄，曹操兴大狱族诛董承、董妃，五臣皆死。"}, {"id": "liu_bei_juxuzhou", "name": "刘备据徐州反曹", "kind": "政治事件", "summary": "刘备借截击袁术脱身，斩车胄据徐州，令郑玄作书联袁绍，合力抗曹。"}, {"id": "sun_ce_yuci", "name": "孙策遇刺，孙权接位", "kind": "刺杀事件", "summary": "许贡门客刺孙策于丹徒西山，策伤重而亡，嘱弟孙权继领江东；江东自此转入孙权时代。"}, {"id": "guandu_zhi_zhan", "name": "官渡之战", "kind": "军事行动", "summary": "袁绍起七十万大军南征，曹军七万相拒官渡；许攸献计奇袭乌巢，袁军粮尽将降，河北精锐一朝丧尽。"}, {"id": "yuanshi_xiangzheng", "name": "袁氏兄弟相争", "kind": "权位之争", "summary": "袁绍病死，废长立幼传位袁尚；袁谭不服，兄弟构兵于黎阳、平原。曹操坐收渔利，谭请操助，吕旷吕翔兄弟阵亡，袁氏自此分崩。"}, {"id": "jizhou_pingding_guojia", "name": "冀州平定·郭嘉遗计", "kind": "征伐", "summary": "操决漳河灌邺城擒审配；谭背约被斩于南皮；尚熙投辽东，郭嘉病亡遗计，公孙康斩二袁首献曹，河北平定。"}, {"id": "sangu_miaolu", "name": "三顾茅庐定三分", "kind": "人才归附", "summary": "徐庶走马荐诸葛，司马徽再荐卧龙；刘备三顾茅庐，亮以隆中对定三分之策，出山相佐。"}, {"id": "jingzhou_yizhu_huoshaoinye", "name": "荆州易主·火烧新野", "kind": "政权更替", "summary": "刘表病亡，蔡瑁张允矫诏立刘琮降曹；刘备携民渡江不忍弃百姓，遂走江夏；曹仁入新野中孔明之火，狼狈败退。"}, {"id": "chang_ban_zhi_zhan", "name": "长坂坡之战·携民渡江", "kind": "战役", "summary": "曹操南征荆州，刘琮投降。刘备不忍弃十余万百姓，日行十里于当阳长坂被五千虎豹骑追及，妻子失散；赵云单骑救主七进七出，张飞据水断桥一声喝退曹军，刘备走汉津与关羽船队会合，与刘琦合兵江夏。"}, {"id": "sunliu_lianmeng", "name": "孙刘联盟缔结", "kind": "外交", "summary": "曹操檄文威胁江东，主降主战相持。鲁肃过江吊丧引诸葛亮同赴柴桑，亮舌战群儒、智激孙权周瑜，孙权拔剑砍案决计抗曹，孙刘联盟自此缔结。"}, {"id": "chi_bi_zhi_zhan", "name": "赤壁之战·火烧连环", "kind": "战役", "summary": "群英会蒋干盗书反间、草船借箭、黄盖苦肉计、阚泽献书、庞统献连环、孔明七星坛借东风，周瑜火攻大破曹军八十三万，曹操华容道遇关羽义释。"}, {"id": "nanjun_zhengduo", "name": "南郡之争", "kind": "征伐", "summary": "周瑜苦战曹仁于南郡，孔明坐收渔利：赵云趁瑜伤袭取南郡，张飞取荆、关羽取长沙等四郡，荆州尽归刘备，一气周瑜。"}, {"id": "meirenji_zhaoqin", "name": "美人计·周郎招亲", "kind": "计谋", "summary": "周瑜定美人计以孙权之妹招刘备入吴为质，孔明授锦囊三策，备招亲成礼携孙夫人偕逃，瑜追之不及，「赔了夫人又折兵」，二气周瑜。"}, {"id": "hefei_zhi_zhan", "name": "合肥之战·甘宁百骑劫营", "kind": "战役", "summary": "孙权攻合肥，张辽李典乐进出战。太史慈中箭而亡，甘宁领百骑夜劫曹营无一折损，威震曹军。"}, {"id": "tongguan_zhi_zhan", "name": "马超雪恨·潼关之战", "kind": "战役", "summary": "曹操诱杀马腾，马超与韩遂起西凉二十万军报仇，破长安占潼关，操割须弃袍而逃；许褚裸衣斗马超；贾诩反间计离间超遂，超败走羌中。"}, {"id": "zhangsong_xiantu", "name": "张松献图", "kind": "外交", "summary": "刘璋遣张松使曹求援，操慢待乱棒打出；亮遣赵云关羽道中礼待，松感备之德，暗献西川地图，与法正孟达约为内应，备取西川之局自此开。"}, {"id": "luofengpo_zhishang", "name": "落凤坡之殇", "kind": "人物", "summary": "庞统随刘备攻雒城，于落凤坡中张任伏兵，乱箭死于坡下，号凤雏止于此。"}, {"id": "jiamengguan_zhi_zhan", "name": "葭萌关之战", "kind": "征伐", "summary": "马超奉张鲁命攻葭萌关，与张飞昼夜酣战不分胜负；孔明反间，李恢说降马超。"}, {"id": "xiaoyaojin_zhi_zhan", "name": "逍遥津之战", "kind": "征伐", "summary": "曹操西征汉中，张辽以八百人破孙权十万之众于合肥，威震逍遥津。"}, {"id": "dandao_fuhui", "name": "单刀赴会", "kind": "外交", "summary": "鲁肃邀关羽赴陆口之会索还荆州，云长单刀赴会，谈笑间挟鲁肃脱身，荆州终不还。"}, {"id": "dingjunshan_zhi_zhan", "name": "定军山之战", "kind": "征伐", "summary": "黄忠据定军山对面高山，法正以逸待劳举旗为号，忠驰下斩夏侯渊；随后汉水之战赵云一身是胆，曹操弃汉中。"}, {"id": "shuiyan_qijun", "name": "水淹七军", "kind": "征伐", "summary": "关羽决襄江水淹于禁七军于罾口川，庞德抬榇死战被擒殉节，关羽威震华夏，曹操议迁都。"}, {"id": "maicheng_zhiluan", "name": "败走麦城", "kind": "人物", "summary": "荆州既失、徐晃解樊围，关羽进退无路退保麦城；上庸不救，突围夜走临沮，父子被擒殉难。"}, {"id": "shouchan_cuan_han", "name": "曹丕受禅篡汉", "kind": "人物", "summary": "华歆等逼献帝禅位，曹丕三让后登受禅坛即皇帝位，国号大魏，封献帝为山阳公，四百年汉室至此而亡。"}, {"id": "xiaoting_zhi_zhan", "name": "猇亭之战", "kind": "征伐", "summary": "刘备为关张复仇御驾伐吴，陆逊火烧连营七百里，蜀汉主力尽丧，三国鼎立格局至此定型。"}, {"id": "baidi_tuogu", "name": "白帝托孤", "kind": "人物", "summary": "刘备崩于永安宫，托孤诸葛亮，谓君可自取；亮叩头流血，誓竭股肱之力，继之以死。"}, {"id": "anju_pingwulu", "name": "安居平五路", "kind": "谋略", "summary": "曹丕用司马懿五路攻蜀之策，孔明安居相府运筹退四路，邓芝使吴退第五路，蜀汉转危为安。"}, {"id": "qiqin_menghuo", "name": "七擒孟获", "kind": "征伐", "summary": "诸葛亮采纳马谡攻心为上之策南征，七擒七纵孟获，南中平定，为北伐解除后顾之忧。"}, {"id": "chushi_biao_yichu_qishan", "name": "武侯上表一出祁山", "kind": "征伐", "summary": "马谡反间计去司马懿，孔明上《出师表》北驻汉中；一出祁山，却魏延子午谷奇计，从陇右大路进兵。"}, {"id": "jiangwei_guixiang", "name": "姜维归降", "kind": "人物", "summary": "天水姜伯约识破蜀计战赵云，遭反间为马遵所拒，被困降蜀；孔明执手曰今遇伯约吾愿足矣。祁山阵前武乡侯骂死王朗。"}, {"id": "jieting_zhi_zhan", "name": "街亭之战", "kind": "征伐", "summary": "马谡违令失街亭，诸葛亮空城退仲达、挥泪斩马谡、自贬三等，一出祁山无功而返。"}, {"id": "chencang_zhi_zhan", "name": "陈仓之战", "kind": "征伐", "summary": "二次北伐顿兵陈仓，郝昭死守二十余日不克；王双中伏被斩，孔明乘虚破城，三出祁山。"}, {"id": "mumen_dao_zhang_he", "name": "木门道张郃之死", "kind": "人物", "summary": "诸葛亮第四次北伐退军，以伏兵诱张郃追至剑阁木门道，万弩齐发，郃死于乱箭之下。"}, {"id": "wu_zhang_yuan_zhi_zhan", "name": "五丈原之战", "kind": "征伐", "summary": "诸葛亮第五次北伐与司马懿相持五丈原，丞相积劳病卒军中，蜀军依遗计全师而退。"}, {"id": "gongsun_yuan_zhi_pan", "name": "公孙渊之叛", "kind": "叛乱", "summary": "辽东公孙渊自立燕王起兵反魏，司马懿奉命东征，襄平城破斩渊，辽东复平。"}, {"id": "gaoping_ling_zhi_bian", "name": "高平陵之变", "kind": "政变", "summary": "曹爽兄弟随驾谒高平陵，司马懿闭城据武库屯洛水浮桥，赚爽纳印归府，诛爽三族，魏政自此归司马氏。"}, {"id": "huainan_sanzhong_zhuge_dan", "name": "淮南三叛·诸葛诞之役", "kind": "征伐", "summary": "诸葛诞拒贾充试探，起兵寿春讨司马昭，联吴拒守经年，城破死节，淮南三叛至此俱平。"}, {"id": "cao_mao_nan_que", "name": "曹髦驱车死南阙", "kind": "人物", "summary": "曹髦不堪坐受废辱，率宿卫三百人仗剑讨司马昭，被成济一戟刺死于南阙辇旁；陈泰披麻哭灵，言独斩贾充可谢天下。"}, {"id": "qishan_douzhen", "name": "姜维祁山斗阵破邓艾", "kind": "征伐", "summary": "姜维按武侯八阵法布阵，变长蛇卷地阵困邓艾于垓心，夺祁山九寨；邓艾遂行反间计，黄皓谗言召维班师。"}, {"id": "toudu_yinping_mianzhu", "name": "偷度阴平·绵竹之战", "kind": "征伐", "summary": "邓艾裹毡偷度阴平七百里险径，绵竹力战灭诸葛瞻父子，后主舆榇出降，蜀汉灭亡。"}, {"id": "ershi_zhenggong", "name": "二士争功·姜维计败", "kind": "人物", "summary": "钟会诬收邓艾，姜维诈降教会据蜀谋反；魏将内外相应兵变，会死于乱箭、维自刎、艾死于田续之手，复汉之谋终败。"}, {"id": "sanfen_gui_jin", "name": "三分归晋", "kind": "征伐", "summary": "杜预王濬大举伐吴，铁索横江一夕而破，王濬先入石头城，孙皓舆榇出降，三国归晋，天下一统。"}, {"id": "zhao_yun_jiejiang", "name": "赵云截江夺阿斗", "kind": "征伐", "summary": "孙夫人听吴国太病笃之诈，携阿斗登舟归吴；赵云弃马截江夺回阿斗，张飞随后到，杀周善，阿斗得还。"}, {"id": "zuoci_zhibei", "name": "左慈掷杯戏曹操", "kind": "神异", "summary": "左慈于宴间掷杯化鹤飞去，化羊遁走，操捕之不得，惊而成疾。"}, {"id": "guanlu_lunming", "name": "管辂论命", "kind": "神异", "summary": "平原神卜管辂应召为曹操卜东吴、西蜀吉凶，预言许都火灾与诸将死期，后皆一一应验。"}, {"id": "xu_sheng_huogong", "name": "徐盛火攻破曹丕", "kind": "征伐", "summary": "曹丕大举伐吴，徐盛一夜筑假城疑敌，沿江以芦苇缚草为人；曹丕被徐盛火攻烧舟，败退而还。"}, {"id": "sun_quan_chengdi", "name": "孙权称帝", "kind": "典制", "summary": "孙权于武昌郊天即皇帝位，迁都建业；蜀遣使贺，吴蜀约中分天下。"}, {"id": "sun_jun_zhu_zhugeke", "name": "孙峻诛诸葛恪", "kind": "政变", "summary": "诸葛恪新城大败而归，反更骄横专权，孙峻与吴主孙亮设计，宴间杀之，夷其三族。"}, {"id": "ding_feng_zhan_sunlin", "name": "丁奉定计斩孙綝", "kind": "政变", "summary": "孙綝专权废亮立休；孙休与丁奉、张布设计，腊日以祭祀为名缚斩孙綝。"}, {"id": "jiangwei_tuntian_bihu", "name": "姜维屯田避祸", "kind": "谋略", "summary": "姜维屡遭黄皓谗害，听郤正之策求沓中屯田以避祸，兼图再举，遂成汉中空虚之局。"}, {"id": "taoxi_dajie", "name": "洮西大捷", "kind": "征伐", "summary": "姜维洮西大破王经，经众数万溺于洮水；乘胜围狄道，陈泰解围，邓艾继起。"}, {"id": "mengda_zhifubing", "name": "司马懿克日擒孟达", "kind": "征伐", "summary": "孟达谋归蜀，司马懿未奏先斩、八日急行军，克日破新城，达死乱军。"}, {"id": "muliu_numa", "name": "诸葛亮造木牛流马", "kind": "发明", "summary": "孔明造木牛流马转运粮草，懿仿造反中计，粮为蜀军所劫。"}, {"id": "weiyan_zhisi", "name": "魏延之死", "kind": "人物", "summary": "武侯遗计，杨仪依锦囊激马岱，魏延「谁敢杀我」三呼而斩。"}], "scale_by_type": {"都城": 2.6, "州域": 1.5, "郡治": 2.8, "重镇": 2.8, "城": 3.2, "县": 3.2, "关隘": 3.4, "渡口": 3.0, "要津": 3.0, "战场": 3.0, "山": 3.0, "原": 3.0, "水系": 1.2, "宫殿": 3.6, "陵墓": 3.6}};
const C = DATA.canvas, GEO = DATA.geo;
const MC = MapCore;
const el = MC.el, esc = MC.esc;
const svg = document.getElementById('svg');

const REFS = MC.drawBase(svg, C, GEO);

/* ---------- 点位 ---------- */
const gPlaces = el('g', {}); svg.appendChild(gPlaces);
const DOT = new Map();
DATA.places.forEach(p => {
  const c = el('circle', { cx: p.x, cy: p.y, r: 3.4, fill: '#b3a690' });
  c.style.cursor = 'pointer';
  c.addEventListener('click', e => { e.stopPropagation(); selectPlace(p); });
  gPlaces.appendChild(c); DOT.set(p.id, c);
});
const gFocus = el('g', {}); svg.appendChild(gFocus);
const gBattle = el('g', {}); svg.appendChild(gBattle);

/* ---------- 视图 ----------
   pz（感知缩放）由 MapCore 按「显示宽 / 画布宽」折算：窗口不是 1400px 宽时，
   注记与选中名牌仍然保持设定的屏幕像素尺寸。 */
let view = null;
const FOCUS = MC.makeFocus(gFocus, C, () => (view ? view.pz() : 1), REFS);
const zlb = document.getElementById('zlb');
const scaleBox = document.getElementById('scale');

view = MC.createView(svg, C, {
  min: 1, max: 14,
  onApply: (V, pz) => {
    DOT.forEach(c => c.setAttribute('r', (3.4 / pz).toFixed(3)));
    MC.decorScale(REFS, svg, C, V.s);
    MC.applySpacing(gBattle, pz);
    FOCUS.place();
    const w = C.w / V.s, h = C.h / V.s;
    scaleBox.textContent = `视野 ${Math.round(w)}×${Math.round(h)} / 全图 ${C.w}×${C.h}`;
  },
  onZoomLabel: s => { zlb.textContent = s.toFixed(2) + '×'; }
});
view.bind({ zi: 'zi', zo: 'zo' });
document.getElementById('zfit').onclick = () => { stopAutoplay(); view.animateTo(C.w / 2, C.h / 2, 1); };

/* ---------- 详情面板 ---------- */
const detail = document.getElementById('detail');
function setDetail(html) { detail.className = 'detail'; detail.innerHTML = html; }

/* ---------- 地名定位：直接缩放过去 ---------- */
function selectPlace(p) {
  stopAutoplay();
  clearBattle();
  FOCUS.clear();
  FOCUS.add(p.x, p.y, p.name, '#9c2b1f');
  view.animateTo(p.x, p.y, p.zoom || 3);

  setDetail(`
    <h4>${esc(p.name)}<span class="k">${esc(p.type)}</span></h4>
    <div class="rows">
      <span class="k">今地</span><span class="v">${esc(p.modern || '—')}</span>
      <span class="k">时属</span><span class="v">${esc(p.adm || '—')}</span>
      <span class="k">经纬</span><span class="v">${p.lng.toFixed(2)}°E, ${p.lat.toFixed(2)}°N <span class="lit">${esc(p.prec || '')}</span></span>
      <span class="k">首见</span><span class="v">${p.ch ? '第 ' + p.ch + ' 回' : '—'}</span>
      <span class="k">像素</span><span class="v">(${p.x}, ${p.y})　${esc(C.tile_sheet)}</span>
    </div>
    <div class="desc">已定位到该点位，比例 ${(p.zoom || 3).toFixed(1)}×。地图可继续自由缩放，或拖拽查看周边。</div>`);

  document.querySelectorAll('.item.on').forEach(e => e.classList.remove('on'));
  const it = document.querySelector(`.item[data-id="${p.id}"]`);
  if (it) { it.classList.add('on'); it.scrollIntoView({ block: 'nearest' }); }
}
/* ---------- 县邑定位 ---------- */
function selectCounty(c) {
  stopAutoplay();
  clearBattle();
  FOCUS.clear();
  FOCUS.add(c.x, c.y, c.name, '#8a5a1f');
  view.animateTo(c.x, c.y, 5.5);
  setDetail(`
    <h4>${esc(c.name)}<span class="k">${c.tier === '都' ? '郡国治所' : '县邑'}</span></h4>
    <div class="rows">
      <span class="k">属郡</span><span class="v">${esc(c.adm)}</span>
      <span class="k">属州</span><span class="v">${esc(c.zhou)}</span>
    </div>
    <div class="desc">东汉县邑点位（据《后汉书·郡国志》比定，示意精度）。点击主点位可看该地在演义中的出典。</div>`);
  document.querySelectorAll('.item.on').forEach(e => e.classList.remove('on'));
  const it = document.querySelector(`.item[data-c="${c.name}|${c.adm}"]`);
  if (it) { it.classList.add('on'); it.scrollIntoView({ block: 'nearest' }); }
}

/* ---------- 战线动画 ---------- */
let timer = null;
function stopAutoplay() { if (timer) { clearInterval(timer); timer = null; } }
function clearBattle() { gBattle.innerHTML = ''; }

function playBattle(b) {
  stopAutoplay();
  FOCUS.clear();
  const xs = b.nodes.map(n => n.x), ys = b.nodes.map(n => n.y);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  const w = Math.max(...xs) - Math.min(...xs) + 140, h = Math.max(...ys) - Math.min(...ys) + 140;
  const sFit = Math.min(C.w / w, C.h / h, 9);
  gBattle.innerHTML = '';
  /* 全线虚影：给观众一条「整场推进」的参照，避免只看到当前一段 */
  MC.battlePath(gBattle, b.nodes, { ghost: true, sz: 2.2, dash: '9 7' });

  const ev = DATA.events.find(e => e.id === b.event_id);
  const head = `<h4>${esc(b.name)}<span class="k">战役</span></h4>
    <div class="rows"><span class="k">父事件</span><span class="v">${esc(ev ? ev.name : '—')}</span>
    <span class="k">时间</span><span class="v">${esc(b.date_text || b.year || '')}</span>
    <span class="k">地点</span><span class="v">${esc(b.place_name || '')}</span></div>
    <div style="margin:10px 0 6px;display:flex;align-items:center;gap:8px">
      <span style="font-size:11.5px;color:var(--ink3)" id="nst">0 / ${b.nodes.length}</span>
      <button class="btn" id="replay">重播</button>
      <span style="font-size:10.5px;color:var(--ink3)">滚轮/拖拽可接管镜头</span>
    </div>`;

  const draw = upto => {
    gBattle.querySelectorAll('.live').forEach(e => e.remove());
    const live = el('g', { class: 'live' });
    const pts = b.nodes.slice(0, upto + 1);
    if (pts.length > 1) MC.battlePath(live, pts, { sz: 2.6 });
    pts.forEach((n, idx) => {
      MC.battleNode(live, n, view.pz(), {
        past: idx !== upto, up: idx % 2 === 0,
        label: `${n.seq}. ${n.label}`
      });
    });
    gBattle.appendChild(live);
    MC.applySpacing(gBattle, view.pz());
    const n = b.nodes[upto];
    view.animateTo(n.x, n.y, 7, 700);
    setDetail(head + `<div style="margin-top:4px">`
      + b.nodes.map((x, k) => `<div class="nd${k <= upto ? ' on' : ''}"><b>${x.seq}</b>${esc(x.kind)}·${esc(x.label)}</div>`).join('')
      + `</div><div class="desc"><b style="font-weight:400;color:var(--accent)">${n.seq}. ${esc(n.kind)}·${esc(n.label)}</b>　${esc(n.desc)}</div>`);
    const st = document.getElementById('nst'); if (st) st.textContent = (upto + 1) + ' / ' + b.nodes.length;
    const rp = document.getElementById('replay'); if (rp) rp.onclick = () => playBattle(b);
  };

  view.animateTo(cx, cy, sFit, 600);
  setDetail(head + b.nodes.map(x => `<div class="nd"><b>${x.seq}</b>${esc(x.kind)}·${esc(x.label)}</div>`).join(''));
  if (window.__snap) { draw(b.nodes.length - 1); return; }   // 回归：直接落最终帧
  let i = 0;
  setTimeout(() => {
    if (!document.getElementById('nst')) return;   // 用户已切走
    draw(0);
    timer = setInterval(() => {
      i++;
      if (i >= b.nodes.length) { stopAutoplay(); return; }
      draw(i);
    }, 1300);
  }, 700);
}

/* ---------- 列表与检索 ---------- */
const list = document.getElementById('list'), q = document.getElementById('q');
document.getElementById('cnt-place').textContent = DATA.places.length;
document.getElementById('cnt-county').textContent = (GEO.counties || []).length;
let tab = 'place';
function render() {
  const kw = q.value.trim();
  if (tab === 'place') {
    const arr = DATA.places.filter(p => !kw || p.name.includes(kw) || (p.modern || '').includes(kw) || (p.adm || '').includes(kw));
    list.innerHTML = arr.map(p => `<div class="item" data-id="${p.id}">
        <div><span class="nm">${esc(p.name)}</span><span class="sub">${esc(p.modern || '')}</span></div>
        <span class="ty">${esc(p.type)}</span></div>`).join('')
      || '<div style="padding:14px;color:var(--ink3);font-size:12px">无匹配地名</div>';
    list.querySelectorAll('.item').forEach(e => e.onclick = () => selectPlace(DATA.places.find(p => p.id === e.dataset.id)));
  } else if (tab === 'county') {
    const arr = (GEO.counties || []).filter(c => !kw || c.name.includes(kw) || (c.adm || '').includes(kw) || (c.zhou || '').includes(kw));
    list.innerHTML = arr.map(c => `<div class="item" data-c="${esc(c.name)}|${esc(c.adm)}">
        <div><span class="nm">${esc(c.name)}</span><span class="sub">${esc(c.adm)} · ${esc(c.zhou)}</span></div>
        <span class="ty">${c.tier === '都' ? '治所' : '县'}</span></div>`).join('')
      || '<div style="padding:14px;color:var(--ink3);font-size:12px">无匹配县邑</div>';
    list.querySelectorAll('.item').forEach(e => e.onclick = () =>
      selectCounty((GEO.counties || []).find(c => c.name + '|' + c.adm === e.dataset.c)));
  } else {
    list.innerHTML = DATA.battles.map(b => `<div class="item" data-b="${b.id}">
        <div><span class="nm">${esc(b.name)}</span><span class="sub">${esc(b.date_text)} · ${esc(b.place_name)}</span></div>
        <span class="ty">${b.nodes.length} 节点</span></div>`).join('');
    list.querySelectorAll('.item').forEach(e => e.onclick = () => {
      document.querySelectorAll('.item.on').forEach(x => x.classList.remove('on'));
      e.classList.add('on');
      playBattle(DATA.battles.find(b => b.id === e.dataset.b));
    });
  }
}
document.querySelectorAll('.tabs div').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tabs div').forEach(x => x.classList.remove('on'));
  t.classList.add('on'); tab = t.dataset.tab;
  stopAutoplay();
  render();
});
q.oninput = render;

document.getElementById('canvas-meta').textContent = `${C.name}　${C.w}×${C.h}px　经纬 ${C.lng0}–${C.lng1}°E / ${C.lat0}–${C.lat1}°N`;
render();
view.apply();

/* 深链：#place=ID 定位某地，#county=县名 定位县邑，#battle=ID 播放战役；
   另支持 ?z=&cx=&cy= 确定性设置视野、?snap=1 瞬时落位（无头截图/回归脚本用，
   跳过动画与播放定时器，保证任何环境下截到的是最终状态而非中途帧） */
(function () {
  const qs = new URLSearchParams(location.search);
  if (qs.get('snap') != null) {
    /* 瞬时模式：animateTo 直接落位；战线自动播放改为只画最终一帧 */
    const jump = (cx, cy, s) => {
      view.V.cx = cx; view.V.cy = cy;
      view.V.s = Math.min(14, Math.max(1, s));
      view.clamp(); view.apply();
    };
    view.animateTo = jump;
    window.__snap = true;
  }
  if (qs.has('z')) {
    view.V.s = Math.min(14, Math.max(1, parseFloat(qs.get('z')) || 1));
    view.V.cx = parseFloat(qs.get('cx')) || C.w / 2;
    view.V.cy = parseFloat(qs.get('cy')) || C.h / 2;
    view.clamp(); view.apply();
  }
  const h = location.hash || '';
  let m = h.match(/^#place=(.+)$/);
  if (m) { const p = DATA.places.find(x => x.id === m[1]); if (p) setTimeout(() => selectPlace(p), 80); return; }
  m = h.match(/^#county=(.+)$/);
  if (m) { const nm = decodeURIComponent(m[1]); const c = (GEO.counties || []).find(x => x.name === nm); if (c) setTimeout(() => selectCounty(c), 80); return; }
  m = h.match(/^#battle=(.+)$/);
  if (m) { const b = DATA.battles.find(x => x.id === m[1]); if (b) setTimeout(() => playBattle(b), 80); }
})();
</script>
