/* ================= 人物库 ================= */
function primaryFaction(p) {
  const t = (p.tenure || []).slice().sort((a, b) => b.end_year - a.end_year);
  return t.length ? t[0].faction_id : 'han';
}
let pfFaction = null;   // P1-E：阵营筛选（null = 全部；再点一次同阵营取消）
function personHit(p, kw) {
  if (!kw) return true;
  const k = kw.trim();
  if (!k) return true;
  return p.name.includes(k) || (p.courtesy || '').includes(k) ||
    (p.display_aliases || []).some(a => a.includes(k)) ||
    (p.match_surfaces || []).some(s => s.includes(k));
}
function renderPersons() {
  const y = +$('yslider').value, filt = $('yfilter').checked, kw = ($('psrch').value || '').trim();
  $('yr').textContent = y + ' 年';
  $('side-hd').textContent = '阵营索引';
  const nAll = filt ? countInAny(y, null) : Object.keys(P).length;
  $('side-bd').innerHTML = `<div class="ch-item" data-f="*" style="${pfFaction ? '' : 'background:var(--on-bg);font-weight:600'}"
      onclick="toggleFaction(null)">
      <span style="width:9px;height:9px;border-radius:50%;background:var(--ink2);display:inline-block;margin-top:5px"></span>
      <span>全部阵营</span><b style="margin-left:auto">${nAll}</b></div>`
    + DATA.factions.map(f => {
    const n = countIn(y, filt, f.id), on = pfFaction === f.id;
    /* 开启年份过滤后隐藏该年无人的阵营（如 184 年的晋），不再灰显 */
    if (filt && !n && pfFaction !== f.id) return '';
    return `<div class="ch-item" data-f="${f.id}" style="${n ? '' : 'opacity:.38'}${on ? ';background:var(--on-bg);font-weight:600' : ''}"
      onclick="toggleFaction('${f.id}')">
      <span style="width:9px;height:9px;border-radius:50%;background:${f.color};display:inline-block;margin-top:5px"></span>
      <span>${f.name}</span><b style="margin-left:auto">${n}</b></div>`;
  }).join('');
  $('side-ft').style.display = 'none';

  let h = ''; let shown = 0;
  DATA.factions.forEach(f => {
    if (pfFaction && pfFaction !== f.id) return;
    const groups = {}; let total = 0;
    for (const id in P) {
      const p = P[id];
      if (!personHit(p, kw)) continue;
      (p.tenure || []).forEach(t => {
        if (t.faction_id !== f.id) return;
        if (filt && !(y >= t.start_year && y <= t.end_year)) return;
        (groups[t.role] = groups[t.role] || []).push({ p, t }); total++;
      });
    }
    if (!total) return;
    shown += total;
    h += `<div class="fgroup" id="fg-${f.id}" style="--fc:${f.color}"><div class="fh"><span class="dot" style="background:${f.color}"></span>
      <span class="nm">${f.name}</span><span class="cnt">${total} 个时间片${filt ? '（' + y + ' 年在任）' : ''}${kw ? '（检索中）' : ''}</span></div>`;
    DATA.roles.forEach(r => {
      const arr = groups[r]; if (!arr || !arr.length) return;
      arr.sort((a, b) => b.t.confidence - a.t.confidence || a.p.name.localeCompare(b.p.name, 'zh'));
      h += `<div class="rh">${r} · ${arr.length}</div><div class="grid">`;
      arr.forEach(({ p, t }) => {
        h += `<div class="pcard" data-id="${p.id}" style="--c:${FCOL[f.id]}">
          <div class="ava" style="--c:${FCOL[f.id]}">${esc(p.name[0])}</div>
          <div class="meta"><div class="nm">${esc(p.name)}${p.courtesy ? `<span style="font-size:15px;color:var(--ink3)"> ${esc(p.courtesy)}</span>` : ''}</div>
          <div class="tz">${t.start_year}–${t.end_year}${t.title ? ' · ' + esc(String(t.title).split('、')[0]) : ''}</div></div></div>`;
      });
      h += '</div>';
    });
    h += '</div>';
  });
  $('libwrap').innerHTML = h || `<div class="empty">${kw ? `无匹配「${esc(kw)}」的人物。` : '该时点下没有已建档人物。<br>试试关闭「只看该年在任者」，或拖动时间轴。'}</div>`;
  $('libwrap').querySelectorAll('.pcard').forEach(e => e.onclick = () => openEntity('person', e.dataset.id));
  $('pstat').textContent = `已建档 ${Object.keys(P).length} 人 · 时间片 ${Object.values(P).reduce((s, p) => s + (p.tenure || []).length, 0)} 段${kw ? ` · 检索命中 ${shown}` : ''}`;
}
window.toggleFaction = fid => { pfFaction = pfFaction === fid ? null : fid; renderPersons(); };
function countIn(y, filt, fid) {
  let n = 0;
  for (const id in P) (P[id].tenure || []).forEach(t => { if (t.faction_id === fid && (!filt || (y >= t.start_year && y <= t.end_year))) n++; });
  return n;
}
function countInAny(y, fid) {
  /* 该年「在世或在任」的人物数（在任按时间片，无时间片者按生卒年） */
  let n = 0;
  for (const id in P) {
    const p = P[id];
    let hit = false;
    (p.tenure || []).forEach(t => { if ((fid == null || t.faction_id === fid) && y >= t.start_year && y <= t.end_year) hit = true; });
    if (!hit && fid == null) {
      const a = p.active_years || (p.birth != null || p.death != null ? [p.birth, p.death] : null);
      if (a && a[0] != null && a[1] != null && y >= a[0] && y <= a[1]) hit = true;
    }
    if (hit) n++;
  }
  return n;
}

/* ================= 地图 =================
   底图 / 注记分级 / 缩放 / 锁定视图的唯一实现在 MapCore（app/map_core.js）。
   这里只保留阅读器专有的东西：点位层、详情面板、锁定式小图与战线推进。 */
const zoomFor = p => MC.zoomFor(p.type, DATA.scale_by_type);

/* 卡片小图取景：按「容器宽高比」直接算取景框，再交给 MapCore 分级注记。
   旧实现是「画布比例 + preserveAspectRatio=slice」：745×230 的扁条里要把画布
   1.17:1 的框铺满，上下被裁掉约三分之二，靶心按画布比例算出的 pz 也被低估，
   14px 的红圈实际胀到 30px+。这里所见即所取：不裁切、不留边、pz 与屏幕 1:1。
   wantW 给定时按该画布宽度取景（地点卡按地名类型定倍率），否则按对象外接框自适应。 */
function cardFrame(svg, xs, ys, opt) {
  opt = opt || {};
  const W = svg.clientWidth || 720, H = svg.clientHeight || 230;
  const pad = opt.pad || 1.14, minW = opt.minW || 260;
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  let vw = opt.wantW || 0;
  if (!vw) {                            /* 自适应：两轴各算一次所需宽度，取大者 */
    const sx = Math.max(x1 - x0, minW) * pad;
    const sy = Math.max(y1 - y0, minW * H / W) * pad;
    vw = sx / sy > W / H ? sx : sy * W / H;
  }
  vw = Math.max(vw, minW);
  let vh = vw * H / W;
  if (vw > C.w) { vw = C.w; vh = vw * H / W; }
  if (vh > C.h) { vh = C.h; vw = vh * W / H; }
  /* 取景框夹回画布内：贴近边界的点不再居中，但绝不把画布外的空白拉进来 */
  const cx = Math.min(Math.max((x0 + x1) / 2, vw / 2), C.w - vw / 2);
  const cy = Math.min(Math.max((y0 + y1) / 2, vh / 2), C.h - vh / 2);
  svg.setAttribute('viewBox',
    (cx - vw / 2).toFixed(1) + ' ' + (cy - vh / 2).toFixed(1) + ' ' + vw.toFixed(1) + ' ' + vh.toFixed(1));
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  /* 拿取景框当「画布」喂给 decorScale：meet 且宽高比已对齐容器，
     displayZoom 算出的 min(W/vw, H/vh) 就是屏幕上真实倍率，字号才不会失真 */
  MC.decorScale(svg._refs, svg, { w: vw, h: vh }, 1);
  MC.lockZoom(svg);
  return MC.displayZoom(svg, { w: vw, h: vh }, 1);
}
function renderPlaces() {
  stopBattleMapPlay();
  $('pdfoot').innerHTML = `共 ${Object.keys(L).length} 个点位<br>已在本 ${DATA.chapters.length} 回中出现 ${DATA.stats.places_linked} 个<br>
    <span style="color:var(--ink3)">地图可自由缩放，点击点位即定位</span>`;
  const svg = $('bigmap');
  svg._refs = MC.drawBase(svg, C, GEO);
  /* 州界路径按名称索引（底图按 zhoupoly 顺序生成，每条 2 个 path：晕底 + 虚线） */
  const zPoly = new Map();
  const zPaths = Array.from(svg._refs.zhouPoly.children);
  (GEO.zhoupoly || []).forEach((poly, i) => {
    zPoly.set(poly.name, { halo: zPaths[i * 2], line: zPaths[i * 2 + 1] });
  });
  /* 郡界路径按郡名索引（底图每郡一个 <g data-jun>，内含主环+飞地环若干 path） */
  const jPoly = new Map();
  if (svg._refs.junPoly) Array.from(svg._refs.junPoly.children).forEach(g => {
    jPoly.set(g.dataset.jun, Array.from(g.children));
  });
  /* 郡名别名表：地名页用简称（「颍川」），底图用全称（「颍川郡」）——两边都能查 */
  const junAlias = new Map();
  jPoly.forEach((_v, full) => {
    const short = full.replace(/(郡|国|尹|属国)$/, '');
    junAlias.set(full, full);
    if (short !== full && !jPoly.has(short)) junAlias.set(short, full);
  });
  const gP = el('g', { style: 'display:none' });   /* 红点默认隐藏：选中地名后才出现一个 */
  const dots = new Map();
  Object.values(L).forEach(p => {
    if (p.pixel_x == null) return;
    const c = el('circle', { cx: p.pixel_x, cy: p.pixel_y, r: 3.4, fill: p.mention_count ? '#9c2b1f' : '#b3a690', style: 'cursor:pointer' });
    c._r = p.mention_count ? 5 : 3.4;
    c.onclick = e => { e.stopPropagation(); selectPlaceOnMap(p); };
    gP.appendChild(c); dots.set(p.id, c);
  });
  const gF = el('g', {});
  svg.append(gP, gF);
  /* 可交互视图：滚轮/双击/拖拽/按钮由内核统一绑定；每次进入本视图重建，状态复位到全图 */
  MV = MC.createView(svg, C, {
    onApply: (V, pz) => {
      if (MV) MV.pz = pz;
      dots.forEach(c => c.setAttribute('r', (c._r || 3.4) / pz));
      MC.decorScale(svg._refs, svg, C, V.s);
      if (BM && BM.gPath) { MC.applySpacing(BM.gPath, pz); MC.applySpacing(BM.gLive, pz); }
      if (MV && MV.focus) MV.focus.place();
      const lb = $('mzlb'); if (lb) lb.textContent = V.s.toFixed(2) + '×';
    }
  });
  MV.dots = dots;
  MV.dotsWrap = gP;
  MV.svgZhouLb = svg._refs.zhouLb;
  MV.zPoly = zPoly;
  MV.zHi = null;      /* 当前高亮的州 {name, halo, line} */
  MV.jPoly = jPoly;
  MV.junAlias = junAlias;
  MV.jHi = null;      /* 当前高亮的郡 {name, paths} */
  MV.svgJunLb = svg._refs.junLb;
  /* 跨区域地理：名字 → 注记坐标（画名字用） */
  MV.rPt = new Map((DATA.geo.regionpoly || []).map(r => {
    const hit = Object.values(L).find(q => q.name === r.n && q.pixel_x != null);
    return [r.n, hit ? { x: hit.pixel_x, y: hit.pixel_y } : null];
  }));
  MV.rHi = null;
  MV.focus = MC.makeFocus(gF, C, () => (MV && MV.pz) || 1, svg._refs);   /* 选中地名：靶心 + 名牌 */
  MV.focus.place();
  MV.bind({ zi: 'mzi', zo: 'mzo' });
  $('mzfit').onclick = () => MV.animateTo(C.w / 2, C.h / 2, 1);
  MV.apply();
  renderPList();
}

/* ===== 地图视图的缩放状态（仅此一处可缩放）：状态机交给 MapCore.createView ===== */
let MV = null;
let BM = null;            /* 主图上正在推演的战役 {b,gPath,gLive,N,XY,i,timer,fitZ} */
let ptTab = 'place';      /* 左列表页签：place=地名 battle=战役 */
let ptSelId = null;       /* 地名词条当前选中 id（树高亮用） */
function applyMV() { if (MV) MV.apply(); }
function mvTo(cx, cy, s, dur) { if (MV) MV.animateTo(cx, cy, s, dur); }
/* 州界高亮：底图原州界描粗变色 + 州名加重放大；其余州界轻微淡出，凸显选区 */
function zhouHighlight(name) {
  const z = MV && MV.zPoly ? MV.zPoly.get(name) : null;
  if (!z) return;
  zhouClearHighlight();
  MV.zHi = { name: name };
  (GEO.zhoupoly || []).forEach(poly => {
    const q = MV.zPoly.get(poly.name);
    if (!q) return;
    const on = poly.name === name;
    q.line.setAttribute('stroke', on ? '#7d1f16' : '#8b5a9e');
    q.line.setAttribute('stroke-width', on ? 2.4 : 1.1);
    q.line.setAttribute('stroke-dasharray', on ? 'none' : '7 6');
    q.line.setAttribute('opacity', on ? 1 : .26);
    q.halo.setAttribute('stroke', on ? '#f6e3c8' : '#fdf8ea');
    q.halo.setAttribute('opacity', on ? .85 : .16);
    q.halo.setAttribute('stroke-width', on ? 6 : 3);
  });
  const ts = MV.svgZhouLb ? MV.svgZhouLb.querySelectorAll('text[data-zhou]') : [];
  for (let i = 0; i < ts.length; i++) {
    const on = ts[i].textContent === name;
    ts[i].setAttribute('fill', on ? '#7d1f16' : '#5d3f6b');
    ts[i].setAttribute('font-size', on ? 34 : 26);
    ts[i].setAttribute('font-weight', on ? 700 : 400);
    ts[i].setAttribute('opacity', on ? 1 : .5);
  }
}
function zhouClearHighlight() {
  if (!MV || !MV.zHi || !MV.zPoly) return;
  MV.zHi = null;
  MV.zPoly.forEach(q => {
    q.line.setAttribute('stroke', '#8b5a9e');
    q.line.setAttribute('stroke-width', 1.1);
    q.line.setAttribute('stroke-dasharray', '7 6');
    q.line.setAttribute('opacity', .62);
    q.halo.setAttribute('stroke', '#fdf8ea');
    q.halo.setAttribute('stroke-width', 3);
    q.halo.setAttribute('opacity', .3);
  });
  const ts = MV.svgZhouLb ? MV.svgZhouLb.querySelectorAll('text[data-zhou]') : [];
  for (let i = 0; i < ts.length; i++) {
    ts[i].setAttribute('fill', '#5d3f6b');
    ts[i].setAttribute('font-size', 26);
    ts[i].setAttribute('font-weight', 400);
    ts[i].setAttribute('opacity', .9);
  }
  if (typeof MC.decorScale === 'function' && MV.pz) MC.decorScale($('bigmap')._refs, $('bigmap'), C, MV.pz);
}

/* 郡界高亮：与州同一套「描粗变色 + 名字加重」的语言，但整体弱一档——
   州是 #7d1f16 实线 2.4px + 6px 晕底 + 字 34；郡是 #a35a24 实线 1.6px + 2.6px 淡晕 + 字 18。
   同屏若已高亮某州，郡高亮不覆盖州，二者可并存（州=背景行政域，郡=焦点分区）。 */
function junHighlight(name) {
  if (!MV || !MV.jPoly) return;
  const full = MV.junAlias.get(name) || (MV.junAlias.has(name) ? name : null);
  if (!full || !MV.jPoly.has(full)) return;
  junClearHighlight();
  MV.jHi = { name: full };
  MV.jPoly.forEach((paths, k) => {
    const on = k === full;
    paths.forEach(p => {
      p.setAttribute('stroke', on ? '#c2641f' : '#5c6f8e');
      p.setAttribute('stroke-width', on ? 3.2 : 0.75);
      p.setAttribute('stroke-dasharray', on ? 'none' : '3 3.5');
      p.setAttribute('opacity', on ? 1 : .28);
    });
  });
  const ts = MV.svgJunLb ? MV.svgJunLb.querySelectorAll('text') : [];
  for (let i = 0; i < ts.length; i++) {
    const on = ts[i].dataset.junlb === full;
    ts[i].setAttribute('fill', on ? '#c2641f' : '#4f6280');
    ts[i].setAttribute('font-weight', on ? 700 : 400);
    ts[i].setAttribute('opacity', on ? 1 : .45);
    ts[i]._fs = on ? 22 : 13;
    if (MV.pz) ts[i].setAttribute('font-size', (ts[i]._fs / MV.pz).toFixed(3));
  }
  /* 郡高亮时强制显名：除设 opacity 外还打 force 标记，
     让 decorScale 在后续缩放帧里不把这个状态覆盖回 0。 */
  if (MV.svgJunLb) { MV.svgJunLb.dataset.force = '1'; MV.svgJunLb.setAttribute('opacity', 1); }
}
function junClearHighlight() {
  if (!MV || !MV.jHi || !MV.jPoly) return;
  MV.jHi = null;
  MV.jPoly.forEach(paths => paths.forEach(p => {
    p.setAttribute('stroke', '#5c6f8e');
    p.setAttribute('stroke-width', 0.75);
    p.setAttribute('stroke-dasharray', '3 3.5');
    p.setAttribute('opacity', .42);
  }));
  const ts = MV.svgJunLb ? MV.svgJunLb.querySelectorAll('text') : [];
  for (let i = 0; i < ts.length; i++) {
    ts[i].setAttribute('fill', '#4f6280');
    ts[i].setAttribute('font-weight', 400);
    ts[i].setAttribute('opacity', .82);
    ts[i]._fs = 13;
  }
  if (MV.svgJunLb) { delete MV.svgJunLb.dataset.force; MV.svgJunLb.setAttribute('opacity', 0); }
  if (typeof MC.decorScale === 'function' && MV.pz) MC.decorScale($('bigmap')._refs, $('bigmap'), C, MV.pz);
}
/* 行政界线高亮统一复位（切地名/切战役/重绘时调用，避免残留） */
function clearAdminHighlight() { zhouClearHighlight(); junClearHighlight(); regionClearHighlight(); riverClearHighlight(); }

/* 跨区域地理高亮：江东/淮南是地理分区而非行政区，视觉语言必须与州（红实线）、
   郡（橙实线）都拉开——用青灰 45° 斜纹填充 + 青虚线界 + 青色地名加重。
   区域轮廓来自相关郡面的并集（build_regionpoly.py），只作示意。 */
function regionHighlight(name) {
  if (!MV) return;
  regionClearHighlight();
  const r = (DATA.geo.regionpoly || []).find(x => x.n === name);
  if (!r) return;
  const base = $('bigmap')._refs && $('bigmap')._refs.base;
  if (!base) return;
  const g = el('g', { 'pointer-events': 'none' });
  [r.p].concat(r.e || []).forEach(ring => {
    if (!ring || ring.length < 3) return;
    g.appendChild(el('path', {
      d: MC.dPoly(ring), fill: 'none', stroke: '#2f5153', 'stroke-width': 2.4,
      'stroke-dasharray': '12 6', 'stroke-linejoin': 'round', opacity: .98,
      'vector-effect': 'non-scaling-stroke'
    }));
    g.appendChild(el('path', {
      d: MC.dPoly(ring), fill: 'url(#hatchRegion)', stroke: 'none', opacity: 1
    }));
  });
  base.appendChild(g);
  /* 名字加重：底图没有常驻分区注记，用点位/外接框中心画一个青色大字（同州名高亮字号） */
  const p0 = MV.rPt && MV.rPt.get(name);
  let lx, ly;
  if (p0) { lx = p0.x; ly = p0.y; }
  else {
    const xs = r.p.map(q => q[0]), ys = r.p.map(q => q[1]);
    lx = (Math.min(...xs) + Math.max(...xs)) / 2;
    ly = (Math.min(...ys) + Math.max(...ys)) / 2;
  }
  const t = el('text', {
    x: lx, y: ly, 'text-anchor': 'middle', fill: '#2f5153', 'font-size': 34,
    'font-family': 'serif', opacity: 1, 'letter-spacing': 4, 'font-weight': 700,
    stroke: '#f7f2e6', 'stroke-width': 2, 'paint-order': 'stroke', 'stroke-linejoin': 'round',
    'vector-effect': 'non-scaling-stroke'
  });
  t.textContent = name;
  g.appendChild(t);
  MV.rHi = { name, g, t };
}
/* 树里点纯地理分区（无点位卡）：高亮 + 镜头对准分区外接框 */
function regionFocus(name) {
  if (!MV) return;
  const r = (DATA.geo.regionpoly || []).find(x => x.n === name);
  if (!r) return;
  clearAdminHighlight();
  MV.dots && MV.dots.forEach(c => { c.style.display = 'none'; });
  regionHighlight(name);
  const xs = r.p.map(q => q[0]), ys = r.p.map(q => q[1]);
  const span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys), 60);
  mvTo((Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2,
       Math.max(1.4, Math.min(C.w * .6 / span, C.h * .6 / span, 2.4)));
}

/* ===== 跨州水系高亮：整条河加粗描蓝 + 浅蓝晕边，与州/郡/分区都不同语言 =====
   opt.detail === false 时不动右侧详情面板（由 selectPlaceOnMap 自己写更全的地名信息）。 */
function riverHighlight(name, opt) {
  opt = opt || {};
  if (!MV) return;
  riverClearHighlight();
  const segs = (DATA.geo.rivers || []).filter(r => r.name === name);
  if (!segs.length) return;
  clearAdminHighlight();
  const base = $('bigmap')._refs && $('bigmap')._refs.base;
  if (!base) return;
  const g = el('g', { 'pointer-events': 'none' });
  const xs = [], ys = [];
  segs.forEach(r => {
    r.pts.forEach(p => { xs.push(p[0]); ys.push(p[1]); });
    /* 宽度按水系自身线宽放大（不写 non-scaling-stroke）：底图河宽是画布单位、
       随缩放变粗，高亮若固定 2.6 屏幕像素，放大后反而比底图河线更细。 */
    const w = r.w || 2;
    g.appendChild(el('path', { d: MC.dLine(r.pts), fill: 'none', stroke: '#7fb4d0',
      'stroke-width': (w * 3).toFixed(2), opacity: .30, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
    g.appendChild(el('path', { d: MC.dLine(r.pts), fill: 'none', stroke: '#15659e',
      'stroke-width': (w * 1.5).toFixed(2), opacity: .95, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
  });
  base.appendChild(g);
  MV.rivHi = { name, g };
  MV.dots && MV.dots.forEach(c => { c.style.display = 'none'; });
  if (MV.focus) MV.focus.clear();
  /* 取景按水系自身跨度自适应：旧版用 span 的 .6 再夹到 [1.2, 2.2]——长江贴着 1.2
     露不出全貌，汉水被 2.2 死死按住，在整张图上只是一小段。 */
  mvTo((Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2,
       MC.fitZoom(C, xs, ys, { pad: .86, minSpan: 320, maxZ: 6 }));
  /* 详情面板给一条水系说明（多数水系没有地点卡） */
  if (opt.detail !== false)
    $('pdetail').innerHTML = `<h5>${esc(name)}<span>水系</span></h5><div class="n">已用蓝色高亮整条「${esc(name)}」的干流走向（底图数据所画段落）。跨州大河是汉末群雄割据的天然分界。</div>`;
}
function riverClearHighlight() {
  if (!MV || !MV.rivHi) return;
  MV.rivHi.g.remove();
  MV.rivHi = null;
}

/* ===== 无地点卡的郡：点郡名 → 高亮郡界与郡名（与州/分区同一套语言） ===== */
function junFocus(nm) {
  if (!MV || !MV.jPoly) return;
  const full = (MV.junAlias && MV.junAlias.get(nm)) || nm;
  if (!MV.jPoly.has(full)) return;
  zhouClearHighlight(); regionClearHighlight();
  junHighlight(nm);
  const jp = (GEO.junpoly || []).find(j => j.n === full);
  if (jp && jp.s) mvTo(jp.s[0], jp.s[1], 2.6);
}
function regionClearHighlight() {
  if (!MV || !MV.rHi) return;
  MV.rHi.g.remove();
  MV.rHi = null;
}

/* ===== 行政层级判定：州 / 郡（供高亮分支用） =====
   不能只看 p.type：州的点位类型有「州域」「州治」两种（冀州是州域、徐州是州治），
   按 type 判会漏。改为三路取证，任一命中即认：
     1) 名字直接就是底图上的州名（冀州/徐州…）
     2) 地名树里该 id 的 level==='zhou'
     3) 该点位 modern_name/古属 里带「州」且去掉「州」后是州名
   郡同理：名字去掉「郡/国/尹」后缀后能在郡界索引里查到。 */
const zhouNameSet = new Set((DATA.geo.zhoupoly || []).map(z => z.name));
/* PT / ptLevelById 在文件后半段才声明，这里必须惰性取用：
   顶层立即引用会撞 TDZ（Cannot access 'PT' before initialization），
   而 zhouOf/junOf 可能在初始化阶段就被调用。 */
let _ptLv = null, _ptJun = null;
function ptMaps() {
  if (!_ptLv) {
    _ptLv = new Map(PT.map(it => [it.id, it.level]));
    _ptJun = new Map(PT.map(it => [it.id, it.jun || null]));
  }
  return [_ptLv, _ptJun];
}
function zhouOf(p) {
  if (!p) return null;
  if (zhouNameSet.has(p.name)) return p.name;
  const [lv] = ptMaps();
  if (lv.get(p.id) === 'zhou') {
    /* 别称州（江东/淮南等已迁出州级，这里只兜真正的州节点） */
    const n = p.name.replace(/州$/, '') + '州';
    return zhouNameSet.has(n) ? n : null;
  }
  return null;
}
/* 跨区域地理（江东/淮南）：地名树 level==='region' 的节点 */
function regionOf(p) {
  if (!p) return null;
  const [lv] = ptMaps();
  return lv.get(p.id) === 'region' ? p.name : null;
}
function junOf(p) {
  if (!p) return null;
  const [lv, jm] = ptMaps();
  /* 郡行（合成条目 __jun_*，无地点卡）→ 郡级，点它亮郡界。
     同名郡治县（颍川/巨鹿/中山…）已独立成 xian 条目，走下方县点分支 → 落红点。 */
  if (lv.get(p.id) === 'jun') return p.name;
  /* 点位类型为郡治/郡域：古属字段形如「豫州·颍川郡」，取郡段 */
  if (p.type === '郡治' || p.type === '郡域') {
    /* 有地点卡的郡治县：定位这个县，不亮整个郡 */
    if (p.pixel_x != null) return null;
    const m = String(p.ancient_admin || '').split(/[·・\/]/).map(s => s.trim()).find(s => /(郡|国|尹)$/.test(s));
    if (m) return m;
    const jn = jm.get(p.id);
    if (jn) return jn;
    return p.name;
  }
  return null;
}

/* 点击点位：只缩放定位 + 右侧详情，不弹卡片 */
function selectPlaceOnMap(p) {
  if (p.pixel_x == null) return;
  stopBattleMapPlay();
  if (MV.focus) MV.focus.clear();
  if (MV.dots) MV.dots.forEach(c => { c.style.display = 'none'; });   /* 一次只留一个红点 */
  /* 州级：不再依赖 type==='州域'。徐州等州治点位 type 是「州治」，旧判据把它们挡在门外，
     所以点冀州能亮、点徐州不能。改为「名字能在底图州界索引里查到」即视为州级——
     底图 zhoupoly 才是唯一事实来源。郡级同样按「名字能在郡界索引里查到」判定。 */
  const zhouName = zhouOf(p);
  const junName = junOf(p);
  const regName = regionOf(p);
  const zHit = !!(zhouName && MV.zPoly && MV.zPoly.has(zhouName));
  const jFull = junName ? (MV.junAlias.get(junName) || junName) : null;
  const jHit = !zHit && !!(jFull && MV.jPoly && MV.jPoly.has(jFull));
  const rHit = !zHit && !jHit && !!(regName && (DATA.geo.regionpoly || []).some(r => r.n === regName));
  /* 水系地名（长江/汉水/淯水…）：整条水系高亮 + 自适应取景，绝不落红点。
     放在最前：这些点位在底图州/郡索引里查不到，会掉进 else 分支变成一个红点。 */
  const wt = p.type === '水系' ? waterSegs(p.name) : [];
  if (wt.length) {
    clearAdminHighlight();
    if (MV.dotsWrap) MV.dotsWrap.style.display = 'none';
    riverHighlight(p.name, { detail: false });
  } else if (rHit) {
    /* 跨区域地理优先于州判定：region 节点的名字不是州名不会撞 zHit，但
       要把之前高亮的州/郡清掉——分区与行政界线不同时亮，避免语义混淆 */
    clearAdminHighlight();
    regionHighlight(regName);
    if (MV.dotsWrap) MV.dotsWrap.style.display = 'none';
    const r = (DATA.geo.regionpoly || []).find(x => x.n === regName);
    /* 镜头对准区域质心，比例按区域跨度自适应（江东跨得远拉到 1.6×，淮南窄推到 2.4×） */
    /* 镜头对准区域外接框中心（质心会被突出部带偏），比例按区域跨度自适应 */
    const xs = r.p.map(q => q[0]), ys = r.p.map(q => q[1]);
    const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
    const cy = (Math.min(...ys) + Math.max(...ys)) / 2;
    const span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys), 60);
    mvTo(cx, cy, Math.max(1.4, Math.min(C.w * .6 / span, C.h * .6 / span, 2.4)));
  } else if (zHit) {
    riverClearHighlight(); regionClearHighlight();
    zhouHighlight(zhouName);
    junClearHighlight();
    if (MV.dotsWrap) MV.dotsWrap.style.display = 'none';
    const z = GEO.zhou.find(z => z.name === zhouName) || { x: p.pixel_x, y: p.pixel_y };
    mvTo(z.x, z.y, 1.9);
  } else if (jHit) {
    /* 郡属州与当前高亮州一致才保留州界（如兖州亮着再点陈留郡），
       否则清掉——上一轮点徐州再点颍川（豫州），徐州亮着纯属误导 */
    riverClearHighlight(); regionClearHighlight();
    const jp0 = (GEO.junpoly || []).find(j => j.n === jFull);
    if (MV.zHi && (!jp0 || jp0.z !== MV.zHi.name)) zhouClearHighlight();
    junHighlight(junName);
    if (MV.dotsWrap) MV.dotsWrap.style.display = 'none';
    const jp = (GEO.junpoly || []).find(j => j.n === jFull);
    const c = jp ? jp.s : [p.pixel_x, p.pixel_y];
    mvTo(c[0], c[1], 2.6);
  } else {
    clearAdminHighlight();
    mvTo(p.pixel_x, p.pixel_y, zoomFor(p));
    if (MV.dotsWrap) MV.dotsWrap.style.display = '';
    const d = MV.dots && MV.dots.get(p.id); if (d) { d.style.display = ''; d.setAttribute('fill', '#9c2b1f'); }
    if (MV.focus) MV.focus.add(p.pixel_x, p.pixel_y, p.name, '#9c2b1f');
  }
  $('pdetail').innerHTML = `
    <h5>${esc(p.name)}<span>${esc(p.type)}</span></h5>
    <div class="r">
      <span class="k">今地</span><span class="v">${esc(p.modern_name || '—')}</span>
      <span class="k">时属</span><span class="v">${esc(p.ancient_admin || '—')}</span>
      <span class="k">经纬</span><span class="v">${p.lng.toFixed(2)}°E, ${p.lat.toFixed(2)}°N <span class="lit">${esc(p.coord_precision || '')}</span></span>
      <span class="k">首见</span><span class="v">${p.first_chapter ? '第 ' + p.first_chapter + ' 回' : '—'}</span>
      <span class="k">提及</span><span class="v">${p.mention_count || 0} 处</span>
    </div>
    <div class="n">${wt.length
      ? '已用蓝色高亮整条「' + esc(p.name) + '」的干流走向（底图数据所画段落），取景按水系跨度自适应。跨州大河是汉末群雄割据的天然分界。'
      : zHit
      ? '已高亮该州州界与州名（底图原有注记），压暗其余州界以便辨认。可继续缩放或拖拽查看。'
      : jHit
        ? '已高亮该郡郡界与郡名，其余郡界压暗。郡界按治所最近邻剖分近似生成，只作分区示意。'
        : rHit
          ? '「' + esc(p.name) + '」是地理分区而非行政区，已用青色斜纹标出大致范围（由相关郡域并集近似，非精确界线）。'
          : '已定位，比例 ' + zoomFor(p).toFixed(1) + '×。可继续缩放或拖拽查看周边。'}</div>`;
  ptSelId = p.id;
  $('plist').querySelectorAll('.row.on, .it.on').forEach(e => e.classList.remove('on'));
  const it = $('plist').querySelector(`.row[data-pid="${p.id}"]`) || $('plist').querySelector(`.it[data-id="${p.id}"]`);
  if (it) {
    it.classList.add('on');
    /* 逐级展开祖先，保证选中项可见 */
    let par = it.parentElement;
    it.scrollIntoView({ block: 'nearest' });
  } else {
    /* 命中被折叠的项：改由外部展开 */
  }
}
function focusPlaceOnMap(p) {
  if (p.pixel_x == null) return;
  selectPlaceOnMap(p);
}
function renderPList() {
  const kw = ($('pq').value || '').trim();
  if (ptTab === 'battle') {
    const arr = BT.filter(b => !kw || b.name.includes(kw) || (b.place_name || '').includes(kw) ||
      ((EV.find(e => e.id === b.event_id) || { name: '' }).name || '').includes(kw));
    $('plist').innerHTML = arr.map(b =>
      `<div class="it" data-bid="${b.id}">
        <div><span>${esc(b.name)}</span><span class="sub">${esc(b.place_name || '')}</span></div>
        <span class="ty">${b.year} 年</span></div>`).join('') || '<div class="empty" style="font-size:16px">无匹配</div>';
    $('plist').querySelectorAll('.it').forEach(e => e.onclick = () => selectBattleOnMap(BT.find(x => x.id === e.dataset.bid)));
    return;
  }
  renderPTree(kw);
}

/* ===== 地名三级树：州 → 郡 → 县 =====
   层级来自 DATA.place_tree（scripts/build_place_hierarchy.py 生成）：
   · 州治/郡治置顶并标注，其余按「有提及 → 首见回数 → 名称」排序
   · 非行政地名（山、关隘、战场…）一律挂在县级，斜体 + 虚线框与行政县区分
   · 跨州水系（48 条）单列「跨州水系」组；跨郡地理名词单列「地区」组
   折叠状态记在 ptOpen，切页签/检索都不丢。 */
const PT = (DATA.place_tree && DATA.place_tree.items) || [];
const ptOpen = new Set();          /* 展开的节点 key：'z:冀州' / 'j:冀州/魏郡'；默认全部收起 */

function ptBuild() {
  const nodes = new Map();
  PT.forEach(it => {
    /* 合成条目（州治县等）不在地点卡索引 L 里，用层级条目自带的像素坐标构造轻量 p */
    let p = L[it.id];
    if (!p && it.pixel_x != null) {
      p = { id: it.id, name: it.name, type: it.type, pixel_x: it.pixel_x, pixel_y: it.pixel_y,
            lng: it.lng, lat: it.lat, mention_count: 0, first_chapter: null, modern_name: '' };
      PT_SYNTH.set(it.id, p);
    }
    if (!p) p = {};
    const rec = { it, p, kids: [] };
    nodes.set(it.id, rec);
  });
  const byZhou = new Map(), orphans = [], regions = [];
  PT.forEach(it => {
    const rec = nodes.get(it.id);
    if (it.level === 'zhou') return;
    if (it.level === 'region') { regions.push(rec); return; }   /* 江东/淮南：地理分区，独立成组 */
    if (!it.zhou) { orphans.push(rec); return; }
    if (!byZhou.has(it.zhou)) byZhou.set(it.zhou, { jun: new Map(), direct: [] });
    const z = byZhou.get(it.zhou);
    if (it.level === 'jun') {
      if (!z.jun.has(it.jun)) z.jun.set(it.jun, { rec, kids: [] });
    } else if (it.jun) {
      if (!z.jun.has(it.jun)) z.jun.set(it.jun, { rec: null, kids: [] });
      z.jun.get(it.jun).kids.push(rec);
    } else {
      z.direct.push(rec);       /* 州内无郡归属的点位，直接挂州下 */
    }
  });
  /* 郡全集：三国时期实存的郡国（junpoly 底表+新置）全部列入树中，
     即使该书没有提及任何下辖县点（如谯郡、上庸）也能点郡名亮郡界 */
  (DATA.geo.junpoly || []).forEach(j => {
    if (!byZhou.has(j.z)) byZhou.set(j.z, { jun: new Map(), direct: [] });
    if (!byZhou.get(j.z).jun.has(j.n)) byZhou.get(j.z).jun.set(j.n, { rec: null, kids: [] });
  });
  const zhouRecs = PT.filter(it => it.level === 'zhou').map(it => nodes.get(it.id));
  /* 州全集：没有州域地点卡的州（如豫州）也要出现在树里——
     郡、县都挂在州名下，缺州行会整枝丢失。用 meta.juns 补合成州行。 */
  const META_Z = (DATA.place_tree.meta && DATA.place_tree.meta.juns) || {};
  const haveZ = new Set(zhouRecs.map(z => z.it.zhou || z.p.name || z.it.name));
  Object.keys(META_Z).forEach(zn => {
    if (haveZ.has(zn) || !zhouNameSet.has(zn)) return;   /* 只补真实州（meta 里混有把郡名当州名的脏键） */
    zhouRecs.push({ it: { id: '', name: zn, level: 'zhou', zhou: zn, seat_of: null, kind: 'admin' },
                    p: { name: zn }, kids: [] });
  });
  /* 跨州水系全集：底图上画了的水系全部列出（48 条），点击高亮完整水系而非红点 */
  const riverSeen = new Map();
  (DATA.geo.rivers || []).forEach(r => {
    if (r.name && (!riverSeen.has(r.name) || r.pts.length > riverSeen.get(r.name).length)) riverSeen.set(r.name, r);
  });
  const orphanNames = new Set(orphans.map(o => o.p.name || o.it.name));
  const mkRiver = nm => orphanNames.has(nm)
    ? orphans.find(o => (o.p.name || o.it.name) === nm)
    : { it: { id: '', name: nm, level: 'river', seat_of: null, kind: 'nonadmin' },
        p: { name: nm }, kids: [] };
  const rivers = ['黄河', '长江'].filter(nm => riverSeen.has(nm)).map(mkRiver)
    .concat([...riverSeen.keys()].filter(nm => nm !== '黄河' && nm !== '长江')
      .sort((a, b) => a.localeCompare(b, 'zh')).map(mkRiver));
  /* 地理分区全集：以底图 regionpoly（11 个跨郡地理名词）为准， */
  const REGION_ZHOU = { '河北': '冀·并·幽', '中原': '豫·兖·司隶', '关中': '司隶', '陇右': '凉州',
    '河西': '凉州', '荆襄': '荆州', '巴蜀': '益州', '南中': '益州', '辽东': '幽州' };
  const have = new Set(regions.map(r => r.p.name || r.it.name));
  (DATA.geo.regionpoly || []).forEach(r => {
    if (have.has(r.n)) return;
    regions.push({ it: { id: '', name: r.n, level: 'region', region_of: REGION_ZHOU[r.n] || null,
                         seat_of: null, kind: 'nonadmin' },
                   p: { name: r.n }, kids: [] });
  });
  return { nodes, byZhou, zhouRecs, orphans, rivers, regions };
}
let ptData = null;
const PT_SYNTH = new Map();        /* 合成条目（州治县等）→ 轻量地点对象 */

const ptHit = (rec, kw) => !kw || (rec.p.name || rec.it.name || '').includes(kw) || (rec.p.modern_name || '').includes(kw) ||
  (rec.p.ancient_admin || '').includes(kw) || (rec.it.jun || '').includes(kw) || (rec.it.zhou || '').includes(kw);

function ptSort(a, b) {
  const sa = !!a.it.seat_of, sb = !!b.it.seat_of;
  if (sa !== sb) return sa ? -1 : 1;                       /* 治所置顶 */
  const na = a.p.mention_count || 0, nb = b.p.mention_count || 0;
  if (na !== nb) return nb - na;
  const ca = a.p.first_chapter || 999, cb = b.p.first_chapter || 999;
  if (ca !== cb) return ca - cb;
  return a.p.name.localeCompare(b.p.name, 'zh');
}

/* 一行：返回 HTML；kind=zhou/jun/xian */
function ptRow(rec, kind, key, opts) {
  const p = rec.p, it = rec.it, o = opts || {};
  const hasKids = o.hasKids;
  const open = ptOpen.has(key) || (o.forceOpen);
  const cls = ['row', 'lv-' + kind];
  if (hasKids) { if (open) cls.push('open'); } else cls.push('leaf');
  if (kind === 'xian' && it.kind === 'nonadmin') cls.push('nonadm');
  if (ptSelId === it.id) cls.push('on');
  const seat = it.seat_of ? `<span class="seat">${esc(it.seat_of.replace(/^.*?治$/, m => m))}</span>` : '';
  const sub = kind === 'xian' && p.modern_name ? `<span class="sub">${esc(p.modern_name)}</span>`
    : kind === 'region' ? `<span class="sub">${esc(it.region_of ? '地理分区 · 约当' + it.region_of + '一带' : '地理分区 · 跨郡')}</span>`
    : kind === 'river' ? `<span class="sub">水系</span>` : '';
  const ty = (kind === 'xian' && it.kind === 'nonadmin') ? `<span class="ty">${esc(p.type || '')}</span>` : '';
  const cnt = hasKids ? `<span class="cnt">${o.n}</span>` : '';
  return `<div class="${cls.join(' ')}" data-key="${key}" data-pid="${it.id}" data-kind="${kind}">
    <span class="tw">▶</span><span class="nm">${esc(p.name || it.name)}</span>${seat}${sub}${ty}${cnt}</div>`;
}

function renderPTree(kw) {
  if (!ptData) ptData = ptBuild();
  const { byZhou, zhouRecs, orphans, rivers, regions } = ptData;
  /* 首次进入不预展开任何节点——地图页默认全折叠，由用户逐级点开 */
  const out = [];
  zhouRecs.sort(ptSort).forEach(zr => {
    const zn = zr.p.name || zr.it.name;
    const z = byZhou.get(zr.it.zhou || zn) || { jun: new Map(), direct: [] };
    const junList = [...z.jun.entries()].map(([jn, v]) => ({
      jn, rec: v.rec, kids: v.kids.slice().sort(ptSort)
    })).sort((a, b) => {
      const sa = a.rec && a.rec.it.seat_of, sb = b.rec && b.rec.it.seat_of;
      if (!!sa !== !!sb) return sa ? -1 : 1;
      const ca = (a.rec && a.rec.p.mention_count) || 0, cb = (b.rec && b.rec.p.mention_count) || 0;
      if (ca !== cb) return cb - ca;
      return a.jn.localeCompare(b.jn, 'zh');
    });
    const direct = (z.direct || []).slice().sort(ptSort);
    const zKey = 'z:' + zn;
    const zTotal = junList.length + direct.length;
    /* 检索模式：只保留「命中节点 + 祖先链」，全部展开；普通模式按折叠状态 */
    const dHit = kw ? direct.filter(k => ptHit(k, kw)) : direct;
    const jHit = kw ? junList.filter(j => (j.rec && ptHit(j.rec, kw)) || j.kids.some(k => ptHit(k, kw)))
                    : junList;
    const zMatch = ptHit(zr, kw);
    if (kw && !zMatch && !dHit.length && !jHit.length) return;   /* 该州整枝无命中 → 隐藏 */
    const zOpen = kw ? true : ptOpen.has(zKey);
    const rows = [ptRow(zr, 'zhou', zKey, { hasKids: zTotal > 0, n: zTotal, forceOpen: zOpen })];
    if (zTotal > 0 && zOpen) {
      jHit.forEach(j => {
        const jKey = 'j:' + zn + '/' + j.jn;
        /* 郡行与郡治县行是两条独立条目（行政区 vs 地点）：
           郡行无卡、点它亮郡界；郡治县有卡、点它落红点。二者不再合并。 */
        const jRec = (j.rec && j.rec.it)
          ? { it: j.rec.it, p: j.rec.p || {} }
          : { it: { id: '__jun_' + j.jn, name: j.jn, jun: j.jn, level: 'jun', seat_of: null },
              p: { name: j.jn } };
        const kids = kw ? j.kids.filter(k => ptHit(k, kw)) : j.kids;
        const nTotal = kids.length;
        const jOpen = kw ? true : ptOpen.has(jKey);
        rows.push(ptRow(jRec, 'jun', jKey, { hasKids: nTotal > 0, n: nTotal, forceOpen: jOpen }));
        if (jOpen) {
          kids.forEach(k => rows.push(ptRow(k, 'xian', 'x:' + k.it.id, {})));
        }
      });
      /* 州下只挂郡：无郡归属的点位收进「未分郡」合成组，保持 州→郡→县 三级不乱 */
      if (dHit.length) {
        const dKey = 'j:' + zn + '/未分郡';
        const dOpen = kw ? true : ptOpen.has(dKey);
        rows.push(ptRow({ it: { id: '', name: '未分郡', jun: '未分郡', level: 'jun', seat_of: null },
                          p: { name: '未分郡' } }, 'jun', dKey,
                         { hasKids: true, n: dHit.length, forceOpen: dOpen }));
        if (dOpen) dHit.forEach(k => rows.push(ptRow(k, 'xian', 'x:' + k.it.id, {})));
      }
    }
    out.push(`<div class="grp">${rows.join('')}</div>`);
  });
  /* 跨州水系：底图所画水系全部列出（长江/黄河/汉水…48 条）。
     点击行为见 bindPTree：高亮整条水系，而不是定位一个红点。 */
  if (rivers.length) {
    const rKey = 'z:跨州水系';
    const oHit = kw ? rivers.filter(k => ptHit(k, kw)) : rivers;
    if (!kw || oHit.length) {
      const oOpen = kw ? true : ptOpen.has(rKey);
      out.push(`<div class="grp grp-river">${ptRow({ it: { name: '水系', id: '' }, p: { name: '水系' } }, 'zhou', rKey, { hasKids: true, n: rivers.length, forceOpen: oOpen })}` +
        (oOpen ? oHit.sort((a, b) => {
          /* 黄河/长江恒置顶，其余按名称排序 */
          const top = n => ({ '黄河': 0, '长江': 1 })[n];
          const na = a.it.name || a.p.name, nb = b.it.name || b.p.name;
          const ta = top(na), tb = top(nb);
          if (ta !== undefined || tb !== undefined) return (ta ?? 9) - (tb ?? 9);
          return na.localeCompare(nb, 'zh');
        })
          .map(k => ptRow(k, 'river', 'r:' + (k.it.name || k.p.name), {})).join('') : '') + `</div>`);
    }
  }
  /* 跨区域地理（江东/淮南…）：单列一组，与行政州平级但样式区分——
     这类是史书里的地理分区，跨郡而不等于州，混进州列表会误导读者以为是个州。 */
  if (regions.length) {
    const rKey = 'z:地区';
    const rHit = kw ? regions.filter(k => ptHit(k, kw)) : regions;
    if (!kw || rHit.length) {
      const rOpen = kw ? true : ptOpen.has(rKey);   /* 地区组与州一致：默认收起，点 ▶ 展开 */
      out.push(`<div class="grp grp-region">${ptRow({ it: { name: '地区', id: '' }, p: { name: '地区' } }, 'zhou', rKey, { hasKids: true, n: regions.length, forceOpen: rOpen, regionHead: true })}` +
        (rOpen ? rHit.sort(ptSort).map(k => ptRow(k, 'region', 'x:' + k.it.id, {})).join('') : '') + `</div>`);
    }
  }
  $('plist').innerHTML = out.length ? `<div class="ptree">${out.join('')}</div>`
    : '<div class="empty" style="font-size:16px">无匹配</div>';
  bindPTree();
}

function bindPTree() {
  /* 手风琴：顶层组（州/水系/地区）同一时间只展开一个——换组时清掉旧州
     及其下郡的展开态；州内郡级仍可正常逐级展开。 */
  const ptToggleTop = key => {
    if (ptOpen.has(key)) { ptOpen.delete(key); return; }
    if (key.startsWith('z:')) {
      const zn = key.slice(2);
      [...ptOpen].forEach(k => {
        if (k.startsWith('z:') ? k !== key : (k.startsWith('j:') && !k.startsWith('j:' + zn + '/'))) ptOpen.delete(k);
      });
    }
    ptOpen.add(key);
  };
  $('plist').querySelectorAll('.row').forEach(r => {
    r.onclick = e => {
      const key = r.dataset.key, kind = r.dataset.kind;
      const hasKids = !r.classList.contains('leaf');
      const onTw = e.target.classList.contains('tw');
      if (kind === 'xian') {                        /* 县级行：点击即定位（合成州治县走暂存对象） */
        const p = (r.dataset.pid && (L[r.dataset.pid] || PT_SYNTH.get(r.dataset.pid))) || null;
        if (p) selectPlaceOnMap(p);
        return;
      }
      if (kind === 'region') {                      /* 跨区域地理行：高亮分区边界（有点位卡再带详情） */
        const rnm = (r.querySelector('.nm') || {}).textContent || '';
        if (r.dataset.pid && L[r.dataset.pid]) selectPlaceOnMap(L[r.dataset.pid]);
        else regionFocus(rnm);
        return;
      }
      if (kind === 'river') {                       /* 水系行：高亮完整水系，不落红点 */
        riverHighlight(r.dataset.key.replace(/^r:/, ''));
        return;
      }
      /* 州 / 郡 / 组行：点 ▶ 或组头切换折叠，全部默认收起、用 ptOpen 记展开 */
      if (onTw) {
        if (hasKids) {
          ptToggleTop(key);
          renderPTree(($('pq').value || '').trim());
          const back = $('plist').querySelector(`.row[data-key="${key}"]`);
          if (back) back.scrollIntoView({ block: 'nearest' });
        }
        return;
      }
      /* 郡行（行政区）：无论有无点位卡，点名字都高亮郡名与郡界——
         郡治县是另一条 xian 行，点它才落红点。 */
      if (kind === 'jun' && !onTw) { junFocus(r.dataset.jun || r.querySelector('.nm').textContent); return; }
      if (!r.dataset.pid) {
        if (hasKids) {
          ptToggleTop(key);
          renderPTree(($('pq').value || '').trim());
        }
        return;
      }
      if (hasKids && !ptOpen.has(key)) {
        ptToggleTop(key);
        renderPTree(($('pq').value || '').trim());
      }
      selectPlaceOnMap(L[r.dataset.pid]);
    };
  });
}


/* ===== 地图页 · 战役战线推演（左列表「战役」页签点入，主图播放） ===== */
function drawMapStep(i) {
  if (!BM) return;
  BM.i = i;
  BM.gLive.innerHTML = '';
  const pz = (MV && MV.pz) ? MV.pz : 1;
  const pts = BM.XY.slice(0, i + 1);
  if (pts.length > 1) MC.battlePath(BM.gLive, pts, { sz: 2.4 });
  pts.forEach((q, k) => MC.battleNode(BM.gLive, q, pz,
    { past: k !== i, up: k % 2, label: k === i ? BM.N[k].time_seq + '. ' + BM.N[k].label : null }));
  const n = BM.N[i];
  $('bmpn').textContent = (i + 1) + ' / ' + BM.N.length;
  $('bmpd').textContent = n.time_seq + '. ' + n.kind + '·' + n.label + '　' + n.desc;
}
function selectBattleOnMap(b) {
  stopBattleMapPlay();
  const svg = $('bigmap');
  if (!svg._refs) return;
  if (MV && MV.dotsWrap) MV.dotsWrap.style.display = 'none';   /* 推演时隐藏地名红点，减少遮挡 */
  if (MV && MV.focus) MV.focus.clear();
  if (MV && MV.dots) MV.dots.forEach(c => { c.style.display = 'none'; });
  clearAdminHighlight();
  const N = b.front_line;
  const XY = N.map(n => ({ x: n.pixel_x, y: n.pixel_y }));
  const xs = XY.map(q => q.x), ys = XY.map(q => q.y);
  const midX = (Math.min(...xs) + Math.max(...xs)) / 2, midY = (Math.min(...ys) + Math.max(...ys)) / 2;
  const fitZ = Math.min(C.w / (Math.max(...xs) - Math.min(...xs) + 160),
                         C.h / (Math.max(...ys) - Math.min(...ys) + 160), 7);
  const gPath = el('g', {}), gLive = el('g', {});
  svg.append(gPath, gLive);
  MC.battlePath(gPath, XY, { ghost: true, sz: 3, dash: '9 7' });
  BM = { b, gPath, gLive, N, XY, i: -1, timer: null, fitZ };
  drawMapStep(0);
  mvTo(midX, midY, fitZ, 600);
  $('bmpname').textContent = b.name;
  $('bmpbar').style.display = 'flex';
  const parent = EV.find(e => e.id === b.event_id);
  $('pdetail').innerHTML = `
    <h5>${esc(b.name)}<span>战役</span></h5>
    <div class="r">
      <span class="k">年份</span><span class="v">${b.year} 年　${esc(b.date_text || '')}</span>
      <span class="k">交战</span><span class="v">${esc((b.belligerents || []).map(x => x.side || x).join(' × ') || '—')}</span>
      <span class="k">结果</span><span class="v">${esc(b.result || '—')}</span>
      ${b.casualties_note ? `<span class="k">伤亡</span><span class="v">${esc(b.casualties_note)}</span>` : ''}
      <span class="k">地点</span><span class="v">${esc(b.place_name || '—')}</span>
    </div>
    <div class="n">${esc(b.summary || '')}${parent ? `<br><span class="lit">父事件 · ${esc(parent.name)}</span>` : ''}
      <br><span class="lit">战线已在主图标出，点「▶ 推演」播放推进；地图可自由缩放。</span></div>`;
  $('plist').querySelectorAll('.it.on').forEach(e => e.classList.remove('on'));
  const it = $('plist').querySelector(`.it[data-bid="${b.id}"]`);
  if (it) { it.classList.add('on'); it.scrollIntoView({ block: 'nearest' }); }
}
function stopBattleMapPlay() {
  if (BM) {
    if (BM.timer) clearInterval(BM.timer);
    if (BM.gPath) BM.gPath.remove();
    if (BM.gLive) BM.gLive.remove();
    BM = null;
  }
  const pb = $('bmpbar'); if (pb) pb.style.display = 'none';
}
/* 主图每步镜头：本步与相邻节点的跨度自适应，长距离行军拉远、短距离事件推近；mvTo 自带缓动 */
function battleStepCam(i) {
  const N = BM.N;
  const a = N[Math.max(0, i - 1)], c = N[i];
  const span = Math.max(Math.abs(c.pixel_x - a.pixel_x), Math.abs(c.pixel_y - a.pixel_y), 30);
  return {
    cx: (a.pixel_x + c.pixel_x) / 2, cy: (a.pixel_y + c.pixel_y) / 2,
    z: Math.max(2.5, Math.min(C.w * .5 / span, C.h * .5 / span, 14))
  };
}
$('bmpplay').onclick = () => {
  if (!BM) return;
  if (BM.timer) { clearInterval(BM.timer); BM.timer = null; return; }   // 再点一次暂停
  let i = 0;
  drawMapStep(0);
  const c0 = battleStepCam(0);
  mvTo(c0.cx, c0.cy, c0.z, 700);
  BM.timer = setInterval(() => {
    i++;
    if (i >= BM.N.length) { clearInterval(BM.timer); BM.timer = null; return; }
    drawMapStep(i);
    const c = battleStepCam(i);
    mvTo(c.cx, c.cy, c.z, 700);
  }, 1400);
};

/* ================= 大势：年份 → 十三州归属 =================
   数据来自 build/power.json（脚本 build_power.py 整理）：13 州在 10 个快照年的主控势力，
   逐年展示取「≤ 该年的最近快照」，界面上标出真实依据年，不假装中间年份也有独立考据。 */
const POWER = DATA.power || null;
const PWF = {}; ((POWER || {}).factions || []).forEach(f => PWF[f.id] = f);
const PW = { year: 184, timer: null, built: false };

function pwYears() { return POWER ? POWER.years : []; }
function pwFidColor(fid) { return (PWF[fid] && PWF[fid].color) || '#b3a690'; }
function pwFidName(fid) { return (PWF[fid] && PWF[fid].name) || fid; }

function renderPower(y) {
  if (!POWER) return;
  const ys = pwYears();
  y = Math.max(ys[0], Math.min(ys[ys.length - 1], Math.round(y)));
  PW.year = y;
  PW.built = true;
  const d = POWER.byYear[y];
  const snap = POWER.snapshots[d.from];
  $('pwyr').innerHTML = y + '<small>年</small>';
  if (+$('pwslider').value !== y) $('pwslider').value = y;
  $('pwsnap').textContent = (+d.from === y) ? ('据 ' + y + ' 年局势') : ('据 ' + d.from + ' 年局势');
  $('pwstat').textContent = Object.keys(snap.hold).length + ' 家 · ' + d.lords.length + ' 在位 · ' + d.events.length + ' 事';
  syncPowerList();
  drawPowerMap(y);
  renderPowerPane(y);
}

/* 郡名 → 势力 id（按快照年缓存） */
function pwOwnerMap(from) {
  PW.ownCache = PW.ownCache || {};
  if (PW.ownCache[from]) return PW.ownCache[from];
  const snap = POWER.snapshots[from];
  const m = {};
  Object.keys(snap.hold).forEach(fid => snap.hold[fid].forEach(j => m[j] = fid));
  PW.ownCache[from] = m;
  return m;
}

/* 势力边界线段：浏览器实时拓扑——郡多边形每条边按顶点(0.1px)建键，
   两郡共享且两侧归属不同的边即势力边界。返回 [[x,y],[x,y]] 数组。 */
function pwBoundary(from) {
  PW.edgeCache = PW.edgeCache || {};
  if (PW.edgeCache[from]) return PW.edgeCache[from];
  const own = pwOwnerMap(from);
  const E = {};
  (GEO.junpoly || []).forEach(j => {
    const fid = own[j.n];
    if (!fid) return;
    [j.p].concat(j.e || []).forEach(r => {
      for (let k = 0; k < r.length; k++) {
        const a = r[k], b = r[(k + 1) % r.length];
        const ka = Math.round(a[0] * 10) + ',' + Math.round(a[1] * 10);
        const kb = Math.round(b[0] * 10) + ',' + Math.round(b[1] * 10);
        if (ka === kb) continue;
        const key = ka < kb ? ka + '|' + kb : kb + '|' + ka;
        (E[key] = E[key] || []).push(fid);
      }
    });
  });
  const segs = [];
  Object.keys(E).forEach(key => {
    const fs = E[key];
    if (fs.length >= 2 && fs.some(f => f !== fs[0])) {
      segs.push(key.split('|').map(s => s.split(',').map(Number)));
    }
  });
  PW.edgeCache[from] = segs;
  return segs;
}

function drawPowerMap(y) {
  const svg = $('pwmap');
  const d = POWER.byYear[y];
  const snap = POWER.snapshots[d.from];
  const own = pwOwnerMap(d.from);
  const W = svg.clientWidth || 880, H = svg.clientHeight || 640;
  svg.setAttribute('viewBox', '0 0 ' + C.w + ' ' + C.h);
  svg.innerHTML = '';
  const s = Math.min(W / C.w, H / C.h) || 1;
  const k = 1 / s;

  /* 底图：地形 + 淡显水系（与主地图同一套内核图层） */
  MC.terrainLayer(svg, C, GEO);
  svg.appendChild(MC.waterLayer(GEO, .55));

  /* 郡面：按势力填色（none=灰白「不属/不明」），悬停显示郡名+归属 */
  const gj = el('g', {});
  (GEO.junpoly || []).forEach(j => {
    const fid = own[j.n];
    if (!fid) return;
    const p = el('path', {
      d: MC.dPoly([j.p].concat(j.e || [])),
      fill: pwFidColor(fid), 'fill-opacity': .62,
      stroke: 'none', 'stroke-linejoin': 'round'
    });
    const ti = document.createElementNS('http://www.w3.org/2000/svg', 'title');
    ti.textContent = j.n + ' · ' + pwFidName(fid);
    p.appendChild(ti);
    gj.appendChild(p);
  });
  svg.appendChild(gj);

  /* 争夺郡：次主斜纹覆盖在主控底色上 */
  const contest = snap.contest || {};
  const cfids = Array.from(new Set(Object.values(contest)));
  const defs = el('defs', {});
  svg.appendChild(defs);
  cfids.forEach((fid, i) => {
    const pt = el('pattern', {
      id: 'pwc' + i, width: 12, height: 12, patternUnits: 'userSpaceOnUse',
      patternTransform: 'rotate(38)'
    });
    pt.appendChild(el('rect', { width: 12, height: 12, fill: 'none' }));
    pt.appendChild(el('line', { x1: 0, y1: 0, x2: 0, y2: 12, stroke: pwFidColor(fid), 'stroke-width': 5, 'stroke-opacity': .6 }));
    defs.appendChild(pt);
  });
  const gc = el('g', {});
  Object.keys(contest).forEach(jn => {
    const j = (GEO.junpoly || []).find(q => q.n === jn);
    if (!j) return;
    const pid = 'pwc' + cfids.indexOf(contest[jn]);
    gc.appendChild(el('path', { d: MC.dPoly([j.p].concat(j.e || [])), fill: 'url(#' + pid + ')' }));
  });
  svg.appendChild(gc);

  /* 州界：虚线，仅作参照；不画郡界（势力界即有效边界） */
  const gz = el('g', { 'pointer-events': 'none' });
  (GEO.zhoupoly || []).forEach(poly => {
    gz.appendChild(el('path', {
      d: MC.dPoly(poly.pts || poly), fill: 'none',
      stroke: '#5f5540', 'stroke-opacity': .5, 'stroke-width': 1.1,
      'stroke-dasharray': (7 * 1) + ' ' + (5 * 1), 'stroke-linejoin': 'round'
    }));
  });
  svg.appendChild(gz);

  /* 势力边界：实线深墨，一气呵成一条 path */
  const segs = pwBoundary(d.from);
  svg.appendChild(el('path', {
    d: segs.map(sg => 'M' + sg[0][0] + ',' + sg[0][1] + 'L' + sg[1][0] + ',' + sg[1][1]).join(''),
    fill: 'none', stroke: '#33291a', 'stroke-opacity': .8,
    'stroke-width': 1.8, 'stroke-linecap': 'round', 'pointer-events': 'none'
  }));

  /* 注记：势力名（大字）+ 州名（小字灰色）。
     州名锚点（州域质心）常与势力名锚点（郡面代表点）同落区域中心——
     贪心避让：州名若与已放置标签的包围盒相撞，按候选偏移找空位，找不到才放弃。 */
  const gl = el('g', { 'pointer-events': 'none' });
  const placed = [];   // {x, y, hw, hh} 已放置标签的半宽/半高
  const fontK = 1;     // 字号已乘 k，包围盒同用屏幕坐标
  const place = (x, y, txt, fs, ls) => {
    const hw = (txt.length * (fs + ls)) / 2 + 2, hh = fs / 2 + 2;
    for (const p of placed) if (Math.abs(x - p.x) < hw + p.hw && Math.abs(y - p.y) < hh + p.hh) return false;
    return true;
  };
  Object.keys(snap.labels || {}).forEach(fid => {
    const f = PWF[fid];
    if (!f) return;
    const xy = snap.labels[fid];
    const fs = 15 * k, ls = 1.5 * k;
    if (!place(xy[0], xy[1], f.name, fs, ls)) return;   // 势力名互撞（少见）：后放者让位放弃
    placed.push({ x: xy[0], y: xy[1], hw: (f.name.length * (fs + ls)) / 2 + 2, hh: fs / 2 + 2 });
    const t = el('text', {
      x: xy[0], y: xy[1], 'text-anchor': 'middle',
      'font-size': fs.toFixed(2), fill: f.color, 'font-family': 'serif',
      'font-weight': 700, 'letter-spacing': ls.toFixed(2),
      stroke: '#f7f2e6', 'stroke-width': (3 * k).toFixed(2), 'paint-order': 'stroke', 'stroke-linejoin': 'round'
    });
    t.textContent = f.name;   // 写势力全名（韩遂不写「遂」），标签锚点按整域代表点预计算，可容纳 2–4 字
    gl.appendChild(t);
  });
  const zfs = 13 * k, zls = 3 * k, zhw = z => (z.length * (zfs + zls)) / 2 + 2, zhh = zfs / 2 + 2;
  const OFFS = [[0, 0], [0, 1], [-1, .6], [1, .6], [0, -1], [-1, -.6], [1, -.6], [-1, 0], [1, 0], [0, 2]];
  Object.keys(POWER.zhou_labels || {}).forEach(z => {
    const xy0 = POWER.zhou_labels[z];
    const R = 30 * k;   // 候选偏移半径
    let best = null;
    for (const o of OFFS) {
      const x = xy0[0] + o[0] * R, y = xy0[1] + o[1] * R * .7;
      if (place(x, y, z, zfs, zls)) { best = [x, y]; break; }
    }
    if (!best) return;   // 全程无处安放：该时点略去此州名（仅参照信息，不画也不误读）
    placed.push({ x: best[0], y: best[1], hw: zhw(z), hh: zhh });
    const t = el('text', {
      x: best[0].toFixed(1), y: best[1].toFixed(1), 'text-anchor': 'middle',
      'font-size': zfs.toFixed(2), fill: '#6f6450', 'font-family': 'serif',
      'letter-spacing': zls.toFixed(2), 'font-style': 'italic',
      stroke: '#f7f2e6', 'stroke-width': (2.5 * k).toFixed(2), 'paint-order': 'stroke', 'stroke-linejoin': 'round'
    });
    t.textContent = z;
    gl.appendChild(t);
  });
  svg.appendChild(gl);

  /* 图例：当年出现的势力，按控制郡数降序 */
  const cnt = {};
  Object.keys(snap.hold).forEach(fid => { cnt[fid] = snap.hold[fid].length; });
  const list = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]);
  let lg = list.map(f => `<span class="lg"><i class="sw" style="background:${pwFidColor(f)}"></i>${esc(pwFidName(f))}<em>${cnt[f]}</em></span>`).join('');
  lg += `<div class="zz">色块为郡级实控（数字＝郡数）；实线＝势力边界，虚线＝州界（仅作参照）；斜纹＝两雄争夺之郡；灰白＝不属/史载不明。</div>`;
  /* 默认收起：只留一枚小图例按钮，点开才铺开，避免遮挡地图 */
  $('pwlegend').innerHTML = `<div class="lgt">图例 ▸</div><div class="lgb">${lg}</div>`;
  $('pwlegend').querySelector('.lgt').onclick = function () {
    const p = this.parentNode; p.classList.toggle('open');
    this.textContent = '图例 ' + (p.classList.contains('open') ? '▾' : '▸');
  };
}

function pwStop() { if (PW.timer) { clearInterval(PW.timer); PW.timer = null; } }
function pwPlay() {
  if (PW.timer) { pwStop(); $('pwplay').textContent = '▶ 推演'; return; }
  const ys = pwYears();
  if (PW.year >= ys[ys.length - 1]) renderPower(ys[0]);
  $('pwplay').textContent = '❙❙ 暂停';
  PW.timer = setInterval(() => {
    const next = PW.year + 1;
    if (next > ys[ys.length - 1]) { pwStop(); $('pwplay').textContent = '▶ 推演'; return; }
    renderPower(next);
  }, 900);
}

/* ================= 事件 ================= */
const EV_ERAS = [
  [184, 189, '乱起 · 黄巾与凉州'], [190, 199, '群雄割据'], [200, 207, '官渡与河北'],
  [208, 219, '赤壁与三分前夜'], [220, 229, '三国鼎立'], [230, 249, '相持与内变'],

];
let EVFILT = 'all', EVKW = '';
function evJump(id) {

/* 右栏详情：点击卡片就地展开，不再弹全屏卡 */
function renderEvDetail(id) {
  const e = EV.find(x => x.id === id), b = BT.find(x => x.id === id);

  else if (b) h += `<h3>${esc(b.name)}</h3><span class="k" style="font-size:14.5px;color:var(--accent);border:1px solid rgba(156,43,31,.35);border-radius:2px;padding:1px 5px">战役</span>`;

    h += `<div class="sec"><div class="sum">${esc(e.date_text || (e.start_year + ' 年'))}　·　${esc(e.summary)}</div></div>`;

      h += `<span class="chip" ${p ? `onclick="openPerson('${x.person_id}')"` : 'style="opacity:.55" title="未建档"'}>${esc(p ? p.name : x.person_id)}<span class="r">${esc(x.role_desc || '')}</span></span>`;
    });
    h += `</div></div>`;
    if ((e.timeline || []).length) {
      h += `<div class="sec"><h4>事件发展</h4><div class="tline">`;
      e.timeline.forEach(x => h += `<div class="tli ${x.importance >= 3 ? 'hi' : ''}"><b>${x.year}</b>${esc(x.title)}<div class="d">${esc(x.description)}</div></div>`);
      h += `</div></div>`;
    }

    h += `<div class="sec"><h4>原文</h4><div class="chips">` +
      e.passage_ids.map(pid => `<span class="chip" onclick="jump(${pid})">第 ${Math.floor(pid / 1000)} 回 · 段 ${pid % 1000}</span>`).join('') + `</div></div>`;
  } else if (b) {
    const parent = EV.find(x => x.id === b.event_id);
    h += `<div class="sec"><div class="sum">${esc(b.date_text || b.year + ' 年')}${parent ? `　·　父事件 <span class="lnk" onclick="renderEvDetail('${parent.id}')">${esc(parent.name)}</span>` : ''}<br>${esc(b.summary)}</div></div>`;
    h += `<div class="sec"><h4>战线推进 <span class="locked">比例锁定</span></h4>
      <div class="bmwrap"><svg class="minimap" id="evbm" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="playbar"><button class="btn" id="evplay">▶ 推演战线</button><span class="nsteps" id="evnst"></span></div>
      <div class="stepdesc" id="evsd"></div></div>`;
    h += `<div class="sec"><h4>战况</h4><div class="kv">
      <span class="k">交战</span><span>${esc((b.belligerents || []).map(x => x.side || x).join(' × ') || '—')}</span>
      <span class="k">结果</span><span>${esc(b.result || '—')}</span>
      ${b.casualties_note ? `<span class="k">伤亡</span><span>${esc(b.casualties_note)}</span>` : ''}
      <span class="k">地点</span><span><span class="lnk" onclick="openPlace('${b.place_id}')">${esc(b.place_name)}</span></span>
    </div></div>`;
    if (b.detail) h += `<div class="sec"><h4>战斗详述</h4><div class="bio">${esc(b.detail)}</div></div>`;
  } else {
    h += `<div class="empty" style="height:calc(100vh - 140px);display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div class="emptyfig"></div>

    MC.setBigNode(true);

      $('evsd').innerHTML = `<b style="color:var(--accent)">${n.time_seq}. ${esc(n.kind)}·${esc(n.label)}</b>　${esc(n.desc)}`;
    });

    MC.lockZoom($('evbm'));
    sc.fit(0); sc.draw(0, OPEN_MS);
    let bi = 0;
    $('evplay').onclick = () => {
      if (timer) { clearInterval(timer); timer = null; }
      bi = 0; sc.draw(0, 700);
      timer = setInterval(() => { bi++; if (bi >= sc.N.length) { clearInterval(timer); timer = null; return; } sc.draw(bi, 700); }, 1200);
    };
    /* 单击小地图 → 全屏战线推演（沿用原弹窗设计的 openBattleStage） */
    $('evbm').onclick = () => openBattleStage(id);
  }
}
/* 事件类型 → 五大类，用于时间轴标签配色（军事/政治/外交/神异/人物） */
function kcls(k) {
  k = k || '';
  if (/军|战|伐|谋|叛|计/.test(k)) return 'k-mil';
  if (/政|变|权|典制|更替/.test(k)) return 'k-pol';
  if (/外交|归附/.test(k)) return 'k-dip';
  if (/神|异|发明/.test(k)) return 'k-mys';
  return 'k-per';
}
let EVCOMP = false, EVT = 0;        /* 事件检索：组词中标记 + 防抖定时器（全局，见 render） */

function renderEvents() {
  /* 事件页不使用左侧索引（与中轴重复）：搜索结果经 evJump 直接定位时间轴卡片 */
  document.body.classList.add('noside');
  /* 中栏 = 编年时间轴（战役卡紧随其父事件卡之后——附属关系即排版关系，不按年份全局混排） */
  const evIds = new Set(EV.map(e => e.id));
  const kidsOf = {};
  const orphan = [];
  BT.forEach(b => {
    if (b.event_id && evIds.has(b.event_id)) (kidsOf[b.event_id] = kidsOf[b.event_id] || []).push(b);
    else orphan.push({ y: b.year || b.start_year, tp: 'battle', o: b });
  });
  const items = EV.map(e => ({ y: e.start_year, tp: 'event', o: e }))
    .concat(orphan).sort((a, b) => a.y - b.y);
  let h = `<div class="evstats">
      <div><b>${EV.length}</b><br><span>起事件</span></div>
      <div><b>${BT.length}</b><br><span>场战役</span></div>
      <div><b>184–280</b><br><span>时间跨度</span></div></div>
    <div class="evfilt">${[['all', '全部'], ['event', '仅事件'], ['battle', '仅战役']].map(([v, t]) =>
      `<button data-f="${v}" class="${EVFILT === v ? 'on' : ''}">${t}</button>`).join('')}
      <input id="evsrch" class="evsearch" placeholder="模糊检索：事件 / 战役 / 人名 / 地名" value="${esc(EVKW || '')}"
        style="margin-left:auto;width:250px;padding:4px 10px;font-size:13.5px"></div>`;
  let era = '';
  /* 检索（模糊 = 子串匹配）：命中事件 → 事件卡 + 全部子战役卡；命中战役 → 父事件卡 + 命中战役卡 */
  const EVKW_ = (EVKW || '').trim().toLowerCase();
  const hitB = b => !EVKW_ || (String(b.name) + (b.summary || '') + (b.place_name || '') +
    (b.belligerents || []).map(x => x.side || x).join(' ')).toLowerCase().includes(EVKW_);
  const hitE = e => !EVKW_ || (String(e.name) + (e.summary || '') + (e.place || '') +
    e.participants.map(p => { const q = P[p.person_id]; return q ? q.name + ' ' + (q.display_aliases || []).join(' ') : p.person_id; }).join(' ')).toLowerCase().includes(EVKW_);
  const eraHead = y => {
    const e0 = EV_ERAS.find(r => y >= r[0] && y <= r[1]);
    if (e0 && e0[2] !== era) { era = e0[2]; h += `<div class="evera">${esc(era)}</div>`; }
  };
  const btRow = (b, par) => {
    /* 战役卡：无年份列、无节点圆点（附属卡）；仅当年份与父事件不一致时才标年份 */
    const y = b.year || b.start_year;
    const yDiffer = !par || par.start_year !== y;
    return `<div class="evt bt" id="evc-${b.id}"><div class="yy">${yDiffer ? y : ''}</div>
         <div class="evcard" data-b="${b.id}"><div class="t">${esc(b.name)}<span class="k k-mil">战役</span>
         <span style="font-size:15px;color:var(--ink3);margin-left:auto">${esc(b.date_text || '')}</span></div>
         <div class="s">${esc(b.summary)}</div>
         <div class="m">战线 ${b.front_line.length} 个节点 · 结果 ${esc(b.result)}</div></div></div>`;
  };
  const evCardE = (e, y) => `<div class="evt" id="evc-${e.id}"><div class="yy">${y}</div><div class="nd"></div>
         <div class="evcard" data-id="${e.id}"><div class="t">${esc(e.name)}<span class="k ${kcls(e.kind)}">${esc(e.kind)}</span>
         <span style="font-size:15px;color:var(--ink3);margin-left:auto">${esc(e.date_text || '')}</span></div>
         <div class="s">${esc(e.summary)}</div>
         <div class="m">相关人物 ${e.participants.length} · 挂载战役 ${(e.battle_ids || []).length} · 原文 ${e.passage_ids.length} 处</div></div></div>`;
  items.forEach(it => {
    if (EVFILT === 'battle') return;
    const e = it.o;
    if (EVKW_) {
      const eb = (kidsOf[e.id] || []).filter(hitB);
      if (!hitE(e) && !eb.length) return;           /* 事件与子战役均未命中 → 整组隐藏 */
      eraHead(it.y);
      h += evCardE(e, it.y);
      /* 命中事件 → 连同全部子战役展示；仅子战役命中 → 事件卡 + 命中战役卡 */
      if (EVFILT === 'all') (hitE(e) ? (kidsOf[e.id] || []).slice() : eb)
        .sort((a, b) => (a.year || 0) - (b.year || 0)).forEach(b => { h += btRow(b, e); });
      return;
    }
    eraHead(it.y);
    h += evCardE(e, it.y);
    if (EVFILT === 'all') {
      (kidsOf[e.id] || []).sort((a, b) => (a.year || 0) - (b.year || 0)).forEach(b => { h += btRow(b, e); });
    }
  });
  if (EVFILT === 'battle')
    BT.slice().sort((a, b) => (a.year || 0) - (b.year || 0))
      .filter(b => hitB(b)).forEach(b => { eraHead(b.year || 0); h += btRow(b, EV.find(e => e.id === b.event_id)); });
  $('evwrap').innerHTML = h;
  const si = $('evsrch');
  if (si && EVKW_) { si.focus(); si.setSelectionRange(si.value.length, si.value.length); }
  if (si) {
    /* 中文输入法保护：组词（composition）期间不重渲染，避免输入框被销毁打断 IME；
       松散输入加 250ms 防抖。compositionend 才真正触发过滤。
       ⚠ 定时器与组词标记都必须挂在模块级：renderEvents() 会把输入框整个重建，
       若用局部 let，旧闭包里的定时器谁都 clearTimeout 不到，250ms 后会用旧值重渲染。 */
    si.addEventListener('compositionstart', () => { EVCOMP = true; });
    si.addEventListener('compositionend', () => { EVCOMP = false; EVKW = si.value; renderEvents(); });
    si.oninput = () => {
      if (EVCOMP) return;
      clearTimeout(EVT);
      EVT = setTimeout(() => { EVKW = $('evsrch') ? $('evsrch').value : EVKW; renderEvents(); }, 250);
    };
  }
  $('evwrap').querySelectorAll('.evfilt button').forEach(b => b.onclick = () => { EVFILT = b.dataset.f; renderEvents(); });
  $('evwrap').querySelectorAll('.evcard').forEach(e =>
    e.onclick = () => { renderEvDetail(e.dataset.b || e.dataset.id); e.closest('.evt').classList.add('flash'); setTimeout(() => e.closest('.evt').classList.remove('flash'), 1400); });
  if (!$('evdt').innerHTML) renderEvDetail(null);
}

/* ================= 卡片 ================= */
function openEntity(t, id) {
  if (t === 'person') openPerson(id);
  else if (t === 'place') openPlace(id);
  else if (t === 'event') openEvent(id);
  else if (t === 'battle') openBattle(id);
}

// 弱链接轻提示：就地在锚点下方浮一句，说明「这里是按前文推定的，未展开」
let wlTipEl = null, wlTipTimer = 0;
function showWeakTip(el, ev) {
  if (ev) ev.stopPropagation();
  const p = P[el.dataset.id];
  const name = p ? p.name : (el.textContent || '');
  const basis = el.getAttribute('title') || '';
  if (wlTipEl) { wlTipEl.remove(); wlTipEl = null; }
  clearTimeout(wlTipTimer);
  const tip = document.createElement('div');
  tip.className = 'wltip';
  tip.id = 'wltip';
  tip.innerHTML = `此处按同段前文推定为 <b>${esc(name)}</b>，证据不足以展开人物卡`;
  document.body.appendChild(tip);
  const r = el.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = r.left + r.width / 2 - tw / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));
  let top = r.bottom + 6;
  if (top + th > window.innerHeight - 8) top = r.top - th - 6;
  tip.style.left = left + 'px';
  tip.style.top = Math.max(8, top) + 'px';
  wlTipEl = tip;
  wlTipTimer = setTimeout(() => { if (wlTipEl) { wlTipEl.remove(); wlTipEl = null; } }, 2600);
}
window.showWeakTip = showWeakTip;
document.addEventListener('click', () => { if (wlTipEl) { wlTipEl.remove(); wlTipEl = null; } });
function showCard(html) {
  $('card').innerHTML = `<div class="x" onclick="closeCard()">×</div>` + html;

}
window.closeCard = () => $('mask').classList.remove('on');
$('mask').onclick = e => { if (e.target.id === 'mask') closeCard(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

function openPerson(id) {

  const f = primaryFaction(p);

  const prec = { exact: '', approx: '约', unknown: '不详', disputed: '存疑' }[p.date_precision] || '';
  const avaHtml = `<div class="chd"><div class="ava lg" style="--c:${FCOL[f]}">${esc(p.name[0])}</div><div class="who">`;

  const tenureHtml = (p.tenure || []).length

  let h = avaHtml + `<h2>${esc(p.name)}${p.courtesy ? `<em>字 ${esc(p.courtesy)}</em>` : ''}</h2>

  // 2026-10-28 定案：史异注不折叠，固定放在卡片最底部（「出现位置」之前）
  if (p.history_conflict_type && p.history_conflict_note) {
    h += `<div class="hcwrap"><div class="hchd">史异注 <span class="hctype">${esc(p.history_conflict_type)}</span></div>` +

  $('appear').innerHTML = app.map(c => `<span class="chip" onclick="closeCard();goCh(${c})">第 ${c} 回</span>`).join('')
    || '<span class="note">本批原文中未出现</span>';

window.openPerson = openPerson;

/* 水系段：底图上同名河段 + 同名湖泊面。
   阅读页点「长江 / 汉水 / 淯水」这类水系地名时，要亮的是整条水，不是某个坐标——
   河是一条线，点位语义对它是错的。 */
function waterSegs(name) {
  const out = [];
  (GEO.rivers || []).forEach(r => { if (r.name === name) out.push({ pts: r.pts, w: r.w }); });
  (GEO.lakes || []).forEach(l => { if (l.name === name) out.push({ pts: l.pts, lake: true, w: 2 }); });
  return out;
}

function openPlace(id) {
  const p = L[id];
  if (!p) return;
  const wt = waterSegs(p.name);
  const water = p.type === '水系' && wt.length > 0;
  let h = `<div class="chd"><div class="who"><h2>${esc(p.name)}<em>${esc(p.type)}</em>
     ${p.pixel_x == null ? '' : water ? '<span class="locked">整条高亮 · 自适应取景</span>'
       : `<span class="locked">比例锁定 ${cardZoom(p)}×</span>`}</h2>
    <div class="life">${esc(p.modern_name || '')}　<span style="color:var(--ink3)">${esc(p.province || '')}</span></div>
    </div></div><div class="cbd">`;
  if (p.pixel_x != null) {
    h += `<div class="sec"><svg class="minimap" id="mm"></svg>
      <div class="note">${water
        ? `整条「${esc(p.name)}」按底图所画河段以蓝色高亮，取景按水系外接框自适应。`
        : `该地点居中显示，比例由地名类型预设（${esc(p.type)} → ${cardZoom(p)}×），滚轮与双击缩放已禁用。`}</div></div>`;
  }
  h += `<div class="sec"><h4>地名信息</h4><div class="kv">
    <span class="k">今地</span><span>${esc(p.modern_name || '—')}</span>
    <span class="k">时属</span><span>${esc(p.ancient_admin || '—')}</span>
    <span class="k">坐标</span><span>${p.lng != null ? p.lng.toFixed(2) + '°E, ' + p.lat.toFixed(2) + '°N' : '—'}
      ${p.coord_precision ? `<span style="color:var(--accent);font-size:15px"> ${esc(p.coord_precision)}</span>` : ''}</span>
    <span class="k">首现</span><span>${p.first_chapter ? '第 ' + p.first_chapter + ' 回' : '—'}</span>
    <span class="k">本书</span><span>出现 ${p.mention_count} 次${(p.chapters || []).length ? '（第 ' + p.chapters.join('、') + ' 回）' : ''}</span>
    ${p.coord_note ? `<span class="k">备注</span><span>${esc(p.coord_note)}</span>` : ''}
  </div></div></div>`;
  showCard(h);
  if (p.pixel_x == null) return;
  const svg = $('mm');
  svg._refs = MC.drawBase(svg, C, GEO);
  if (water) localWaterCard(svg, p.name, wt);
  else localPlaceCard(svg, p);
}

/* 地点卡小图：底图 + 与地图页同源的选中态。
   2026-10-30 定案：不再撒「全图棕点」——四百多个 3px 圆点把地形糊成一片麻子，
   而且默认就该干净。位置参照改由底图郡名承担（见 junNamesForCard）。
   州/郡不画靶心，改高亮行政界线，与地图页 selectPlaceOnMap 保持同一套语言。 */
/* 卡片取景倍率：按地名类型；水系若底图没画河段（檀溪），退回 3.2——
   1.2 是「看整条大河」的倍率，套在一条小溪上会退到几乎全图。 */
const cardZoom = p => (p.type === '水系' && !waterSegs(p.name).length) ? 3.2 : zoomFor(p);

function localPlaceCard(svg, p) {
  const pz = cardFrame(svg, [p.pixel_x], [p.pixel_y], { wantW: C.w / cardZoom(p) });
  const g = el('g', {});
  svg.appendChild(g);
  const zN = zhouOf(p), jN = junOf(p), rN = regionOf(p);
  const lit = rN ? localRegionHighlight(svg._refs, rN) : localAdminHighlight(svg._refs, zN, jN);
  if (!lit) {                       /* 普通点位：靶心 + 米白名牌 */
    const f = MC.makeFocus(g, C, () => pz, svg._refs);
    f.add(p.pixel_x, p.pixel_y, p.name, '#9c2b1f');
  }
  softenZhouLabels(svg._refs, pz, lit === 'zhou' ? zN : null);
  junNamesForCard(svg._refs, pz);
}

/* 卡片小图里的州名收一档：底图 26px 的州名塞进 500×154 的取景框会喧宾夺主
   （两三个紫字压住整张图），压到 17px、其余淡到 .32，只当地理背景；
   当前高亮的那一州保持 .9，否则「点冀州却看不出哪个是冀州」。 */
function softenZhouLabels(refs, pz, hi) {
  if (!refs || !refs.zhouLb) return;
  refs.zhouLb.setAttribute('opacity', 1);
  refs.zhouLb.querySelectorAll('text[data-zhou]').forEach(t => {
    const on = hi && t.textContent === hi;
    t.setAttribute('font-size', ((on ? 20 : 17) / pz).toFixed(3));
    t.setAttribute('opacity', on ? .92 : .4);
  });
}

/* 卡片小图的郡名参照：底图郡名要 pz≥2.2 才显形，卡片永远到不了这个倍率，
   「这个县城在哪一郡」就一点线索都没有（去掉棕点后尤其明显）。
   这里把郡名放出来（12px 屏幕恒定），只显取景框内那几枚——不画点，也不喧宾夺主。 */
function junNamesForCard(refs, pz) {
  if (!refs || !refs.junLb) return;
  /* 郡被高亮时（点的是郡名）已经是 1，别把它压回去 */
  const cur = +(refs.junLb.getAttribute('opacity') || 0);
  refs.junLb.dataset.force = '1';
  refs.junLb.setAttribute('opacity', Math.max(cur, .75));
  refs.junLb.querySelectorAll('text').forEach(t => t.setAttribute('font-size', (12 / pz).toFixed(3)));
}

/* 水系卡小图：整条水系高亮 + 按外接框自适应取景（与地图页 riverHighlight 同一套配色） */
function localWaterCard(svg, name, segs) {
  const xs = [], ys = [];
  segs.forEach(s => s.pts.forEach(q => { xs.push(q[0]); ys.push(q[1]); }));   /* 长江 800+ 点 */
  /* 求极值不用 Math.min(...xs)：上千个实参在 Safari 上会撞调用栈上限 */
  const bx = MC.extent(xs), by = MC.extent(ys);
  const pz = cardFrame(svg, [bx[0], bx[1]], [by[0], by[1]], { pad: 1.16, minW: 300 });
  const g = el('g', { 'pointer-events': 'none' });
  segs.forEach(s => {
    const d = s.lake ? MC.dPoly(s.pts) : MC.dLine(s.pts);
    /* 描边宽度按「水系自身线宽的倍数」给，且**随图缩放**（不加 non-scaling-stroke）：
       底图河宽是画布单位（汉水 2.2、长江 3.0），放大后跟着变粗；
       高亮若用固定屏幕像素，放大到 3× 时反倒比底图河线更细，等于没高亮。 */
    const w = s.w || 2;
    g.appendChild(el('path', {                      /* 浅蓝晕边：让河在晕渲地形上浮起来 */
      d: d, fill: s.lake ? 'rgba(64,132,176,.22)' : 'none',
      stroke: '#7fb4d0', 'stroke-width': (w * 3).toFixed(2), opacity: .30,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round'
    }));
    g.appendChild(el('path', {                      /* 干流：深蓝实线 */
      d: d, fill: 'none', stroke: '#15659e', 'stroke-width': (w * 1.5).toFixed(2), opacity: .95,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round'
    }));
  });
  svg._refs.base.appendChild(g);
  /* 水名：在最长一段干流上挑一个离州名最远的落点，别让「长江」压在「荆州」上 */
  const longest = segs.reduce((a, b) => (b.pts.length > a.pts.length ? b : a), segs[0]);
  const spot = waterLabelSpot(longest.pts);
  const t = el('text', {
    x: spot[0], y: spot[1] - 13 / pz, 'text-anchor': 'middle', fill: '#0f5386',
    'font-size': 18 / pz, 'font-family': 'serif', 'font-weight': 700, 'letter-spacing': 1 / pz,
    stroke: '#fdfaf1', 'stroke-width': 3.6 / pz, 'paint-order': 'stroke', 'stroke-linejoin': 'round'
  });
  t.textContent = name;
  g.appendChild(t);
}

/* 水名落点：沿干流取 5 个候选，选离所有州名（26px 大字）最远的一个。
   州名是底图上最重的注记，水名压在它上面两边都读不清。y 方向权重放大，
   因为汉字横排的视觉宽度远大于字高。 */
function waterLabelSpot(pts) {
  const anchors = (GEO.zhou || []).map(z => [z.x, z.y]);   /* GEO.zhou 只含 12 州，不含羌中注记 */
  let best = pts[Math.floor(pts.length / 2)] || pts[0], bestD = -1;
  [.28, .4, .52, .66, .8].forEach(f => {
    const m = pts[Math.min(pts.length - 1, Math.round(pts.length * f))];
    if (!m) return;
    let d = 1e9;
    anchors.forEach(a => { d = Math.min(d, Math.hypot(a[0] - m[0], (a[1] - m[1]) * 1.8)); });
    if (d > bestD) { bestD = d; best = m; }
  });
  return best;
}

/* 小图（锁定比例）里的行政域高亮：与地图页同一套配色，只是不需要「压暗其余 + 定格缩放」那套交互。
   返回 'zhou' / 'jun' 表示已按州/郡高亮，调用方就不再画红点靶心；false 表示无行政域可亮。 */
function localAdminHighlight(refs, zN, jN) {
  if (!refs) return false;
  if (zN && refs.zhouPoly) {
    const paths = Array.from(refs.zhouPoly.children);
    (DATA.geo.zhoupoly || []).forEach((poly, i) => {
      const on = poly.name === zN;
      if (on) {
        paths[i * 2].setAttribute('stroke', '#f6e3c8');
        paths[i * 2].setAttribute('stroke-width', 6);
        paths[i * 2].setAttribute('opacity', .85);
        paths[i * 2 + 1].setAttribute('stroke', '#7d1f16');
        paths[i * 2 + 1].setAttribute('stroke-width', 2.4);
        paths[i * 2 + 1].setAttribute('stroke-dasharray', 'none');
        paths[i * 2 + 1].setAttribute('opacity', 1);
      } else {
        paths[i * 2 + 1].setAttribute('opacity', .26);
      }
    });
    if (refs.zhouLb) refs.zhouLb.querySelectorAll('text[data-zhou]').forEach(t => {
      if (t.textContent === zN) { t.setAttribute('fill', '#7d1f16'); t.setAttribute('font-weight', 700); t.setAttribute('opacity', 1); }
    });
    return 'zhou';
  }
  if (jN && refs.junPoly) {
    const full = [...refs.junPoly.children].map(g => g.dataset.jun)
      .find(n => n === jN || n.replace(/(郡|国|尹|属国)$/, '') === jN);
    if (!full) return false;
    Array.from(refs.junPoly.children).forEach(gg => {
      const on = gg.dataset.jun === full;
      Array.from(gg.children).forEach(pa => {
        pa.setAttribute('stroke', on ? '#c2641f' : '#5c6f8e');
        pa.setAttribute('stroke-width', on ? 1.6 : 0.75);
        pa.setAttribute('stroke-dasharray', on ? 'none' : '3 3.5');
        pa.setAttribute('opacity', on ? .95 : .25);
      });
    });
    if (refs.junLb) {
      refs.junLb.setAttribute('opacity', 1);
      refs.junLb.querySelectorAll('text').forEach(t => {
        const on = t.dataset.junlb === full;
        t.setAttribute('fill', on ? '#c2641f' : '#4f6280');
        t.setAttribute('font-weight', on ? 700 : 400);
        t.setAttribute('opacity', on ? 1 : .4);
      });
    }
    return 'jun';
  }
  return false;
}

/* 小图里的跨区域地理高亮：斜纹 + 青虚线，与地图页 regionHighlight 同语言（无需状态管理） */
function localRegionHighlight(refs, name) {
  if (!refs || !refs.base) return false;
  const r = (DATA.geo.regionpoly || []).find(x => x.n === name);
  if (!r) return false;
  const g = el('g', {});
  [r.p].concat(r.e || []).forEach(ring => {
    if (!ring || ring.length < 3) return;
    g.appendChild(el('path', {
      d: MC.dPoly(ring), fill: 'url(#hatchRegion)', stroke: '#3d5a5c', 'stroke-width': 1.6,
      'stroke-dasharray': '10 5', 'stroke-linejoin': 'round', 'vector-effect': 'non-scaling-stroke'
    }));
  });
  refs.base.appendChild(g);
  return true;
}

function openEvent(id) {

    h += `</div></div>`;

window.openEvent = openEvent;

let timer = null;
function openBattle(id) {
  const b = BT.find(x => x.id === id);
  if (!b) return;
  /* ?snap=1：回归专用，跳过开场推近动画直接落定（无头截图 rAF 相位不定，
     700ms 推近会让基线对比漂移 5%+；map_test.html 的 snap 同语义） */
  const SNAP = /[?&]snap=1/.test(location.search || '');
  const OPEN_MS = SNAP ? 0 : 700;
  const parent = EV.find(e => e.id === b.event_id);
  let h = `<div class="chd"><div class="who"><h2>${esc(b.name)}<em>战役</em></h2>
    <div class="life">${esc(b.date_text || b.year + ' 年')}　<span style="color:var(--ink3)">父事件 ·
      <span class="lnk" onclick="openEvent('${b.event_id}')">${esc(parent ? parent.name : b.event_id)}</span></span></div>
    <div class="sum">${esc(b.summary)}</div></div></div><div class="cbd">`;
  h += `<div class="sec"><h4>战线推进 <span class="locked">比例锁定</span></h4>
    <div class="bwrap"><svg class="minimap" id="bm" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="zhint">🔍 单击放大 · 可播放推演</div></div>
    <div class="playbar"><button class="btn" id="play">▶ 推演战线</button><span class="nsteps" id="nst"></span></div>
    <div class="stepdesc" id="sd"></div></div>`;
  h += `<div class="sec"><h4>战况</h4><div class="kv">
    <span class="k">交战</span><span>${esc((b.belligerents || []).map(x => x.side || x).join(' × ') || '—')}</span>
    <span class="k">结果</span><span>${esc(b.result || '—')}</span>
    ${b.casualties_note ? `<span class="k">伤亡</span><span>${esc(b.casualties_note)}</span>` : ''}
    <span class="k">地点</span><span><span class="lnk" onclick="openPlace('${b.place_id}')">${esc(b.place_name)}</span></span>
  </div></div>`;
  /* 战役档无 passage_ids，回链父事件的原文段落 */
  const blit = b.passage_ids || (parent && parent.passage_ids) || [];
  if (blit.length)
    h += `<div class="sec"><h4>原文</h4><div class="chips">` +
      blit.map(pid => `<span class="chip" onclick="closeCard();jump(${pid})">第 ${Math.floor(pid / 1000)} 回 · 段 ${pid % 1000}</span>`).join('') + `</div></div>`;
  if (b.detail) h += `<div class="sec"><h4>战斗详述</h4><div class="bio">${esc(b.detail)}</div></div>`;
  h += `</div>`;
  showCard(h);

  /* 先全局，再推演（小图锁定镜头）；单击放大进全屏推演页 */
  const sc = buildBattleScene($('bm'), b, (i, n) => {
    $('nst').textContent = (i + 1) + ' / ' + sc.N.length;
    $('sd').innerHTML = `<b style="color:var(--accent)">${n.time_seq}. ${esc(n.kind)}·${esc(n.label)}</b>　${esc(n.desc)}`;
  });
  MC.lockZoom($('bm'));        // 小图镜头由脚本推进，用户不能缩放
  sc.fit(0);               // 先全局总览（标全部节点）
  sc.draw(0, OPEN_MS);         // 再平滑推近第一步（snap=1 时瞬时落定）
  let bi = 0;
  $('play').onclick = () => {
    if (timer) { clearInterval(timer); timer = null; }
    bi = 0; sc.draw(0, 700);
    timer = setInterval(() => { bi++; if (bi >= sc.N.length) { clearInterval(timer); timer = null; return; } sc.draw(bi, 700); }, 1200);
  };
  $('bm').onclick = () => openBattleStage(id);
}

/* ===== 战线推演场景构建器：卡片小图 / 全屏页共用（底图 + 幽灵全程线 + 实况层） =====
   节点走同一套「data-sz 屏幕像素」协议；draw(upto) 镜头推进，fit() 回全局。 */
function buildBattleScene(svg, b, hook) {
  svg.innerHTML = '';
  svg._refs = MC.drawBase(svg, C, GEO);
  const gPath = el('g', {}), gLive = el('g', {});
  svg.append(gPath, gLive);
  const N = b.front_line;
  const XY = N.map(n => ({ x: n.pixel_x, y: n.pixel_y }));
  const xs = XY.map(q => q.x), ys = XY.map(q => q.y);
  const midX = (Math.min(...xs) + Math.max(...xs)) / 2, midY = (Math.min(...ys) + Math.max(...ys)) / 2;
  const fitZ = Math.min(C.w / (Math.max(...xs) - Math.min(...xs) + 150),
                         C.h / (Math.max(...ys) - Math.min(...ys) + 150), 15);
  MC.battlePath(gPath, XY, { ghost: true, sz: 3, dash: '9 7' });
  /* 节点层：allLab=全局总览时标全部节点，推演中只标当前步，减少遮挡 */
  const renderNodes = (upto, allLab) => {
    gLive.innerHTML = '';
    const pts = XY.slice(0, upto + 1);
    if (pts.length > 1) MC.battlePath(gLive, pts, { sz: 2.4 });
    pts.forEach((q, k) => MC.battleNode(gLive, q, 1, {
      past: k !== upto, up: k % 2,
      label: (allLab || k === upto) ? N[k].time_seq + '. ' + N[k].label : null
    }));
  };
  /* viewBox 平滑插值（对数缩放 + 缓出），锁定场景的镜头动画 */
  let cur = null, anim = null;
  const applyVB = () => {
    svg.setAttribute('viewBox', MC.viewBoxStr(cur.cx, cur.cy, cur.z, C.w, C.h));
    const pz = MC.displayZoom(svg, C, cur.z);
    MC.decorScale(svg._refs, svg, C, cur.z);
    MC.applySpacing(gPath, pz); MC.applySpacing(gLive, pz);
  };
  const setVB = (t, dur) => {
    if (anim) { cancelAnimationFrame(anim); anim = null; }
    if (!cur || !dur) { cur = { cx: t.cx, cy: t.cy, z: t.z }; applyVB(); return; }
    const a = { ...cur }, t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      cur = { cx: a.cx + (t.cx - a.cx) * e, cy: a.cy + (t.cy - a.cy) * e,
              z: Math.exp(Math.log(a.z) + (Math.log(t.z) - Math.log(a.z)) * e) };
      applyVB();
      if (k < 1) anim = requestAnimationFrame(step); else anim = null;
    };
    anim = requestAnimationFrame(step);
  };
  /* 每步镜头自适应：本步与相邻节点的跨度决定比例，长距离行军拉远、短距离事件推近 */
  const camFor = i => {
    const a = XY[Math.max(0, i - 1)], c = XY[i];
    const span = Math.max(Math.abs(c.x - a.x), Math.abs(c.y - a.y), 30);
    return { cx: (a.x + c.x) / 2, cy: (a.y + c.y) / 2,
             z: Math.max(2.5, Math.min(C.w * .55 / span, C.h * .55 / span, 14)) };
  };
  return {
    N, fitZ, midX, midY, gPath, gLive,
    draw(upto, dur) {
      this._i = upto;
      renderNodes(upto, false);
      setVB(camFor(upto), dur || 0);
      if (hook) hook(upto, N[upto]);
    },
    fit(dur) {
      renderNodes(this._i == null ? 0 : this._i, true);
      setVB({ cx: midX, cy: midY, z: fitZ }, dur || 0);
    }
  };
}

let stageTimer = null;

function openBattleStage(id) {
  const b = BT.find(x => x.id === id);

}

function graphPersonActive(p, y) {
  const ts = p.tenure || [];
  for (const t of ts) {
    if (t.role === '追谥') continue;   // 追谥/追尊段不代表本人生前在世，避免把已亡人物续命到王朝末年
    if (y >= (t.start_year || -9999) && y <= (t.end_year || 9999)) return true;
  }
  if (p.birth != null && y < p.birth) return false;
  if (p.death != null && y > p.death) return false;
  return p.birth == null && p.death == null;   // 生卒不详（如貂蝉）视为全程在世
}

function graphEdgeSet(y, wantLord, wantFoe) {
  const seen = {}, E = [];
  const push = (a, b, k, note) => {
    const key = k + (a < b ? a + '|' + b : b + '|' + a);
    if (seen[key] || a === b || !P[a] || !P[b]) return;
    seen[key] = 1; E.push({ a, b, k, note });
  };
  if (wantLord) for (const id in P) (P[id].tenure || []).forEach(t => {
    if (t.lord_id && y >= (t.start_year || -9999) && y <= (t.end_year || 9999))
      push(id, t.lord_id, 'lord', `${P[id].name} 臣属于 ${P[t.lord_id].name}（${t.start_year}–${t.end_year} ${t.title || t.role || ''}）`);
  });
  if (wantFoe) BT.forEach(b => {
    if (b.belligerents && b.belligerents.length >= 2 && Math.abs((b.year || 0) - y) <= 1)
      for (let i = 0; i < b.belligerents.length; i++) for (let j = i + 1; j < b.belligerents.length; j++)
        (b.belligerents[i].commanders || []).forEach(u => (b.belligerents[j].commanders || []).forEach(v =>
          push(u, v, 'foe', `${P[u] ? P[u].name : u} × ${P[v] ? P[v].name : v}（${b.name}·${b.year}）`)));
  });
  return E;
}

let graphIds = [];   // 当前时点在世的人物 id 集（供侧栏列表渲染）
const GFOLD = {};    // 阵营折叠状态（undefined = 默认折叠）
function renderGraphList() {

  if (gSel) {
