    if (it) it.scrollIntoView({ block: 'nearest' });
  }
}
window.gfToggle = fid => {
  if (GFOLD[fid]) delete GFOLD[fid];                 // 再点一次收起
  else { for (const k in GFOLD) delete GFOLD[k]; GFOLD[fid] = true; }   // 手风琴：同屏只展开一个阵营
  renderGraphList();
};

function renderGraph() {
  const y = +$('gyslider').value;
  $('gyyr').textContent = y + ' 年';
  // 侧栏：图谱 · 人物索引（此前未接管，会残留上一视图的列表）
  $('side-hd').textContent = '图谱 · 人物索引';
  $('side-ft').style.display = 'none';
  $('side-bd').classList.remove('pwlist');
  const wantLord = $('ge-lord').checked, wantFoe = $('ge-foe').checked;

  let ids = Object.keys(P).filter(id => graphPersonActive(P[id], y));
  if (ids.length > 300) ids = ids.sort((a, b) => (GM[b] || 0) - (GM[a] || 0)).slice(0, 300);  // 降级显主干
  const inSet = {}; ids.forEach(id => inSet[id] = 1);
  let edges = graphEdgeSet(y, wantLord, wantFoe).filter(e => inSet[e.a] && inSet[e.b]);
  // 孤立节点（无边且提及少）降密度：只留提及 ≥3 的
  const deg = {}; edges.forEach(e => { deg[e.a] = (deg[e.a] || 0) + 1; deg[e.b] = (deg[e.b] || 0) + 1; });
  ids = ids.filter(id => deg[id] || (GM[id] || 0) >= 3);

  // ---- 侧栏：搜索框（持久） + 按阵营分组的人物列表 ----
  graphIds = ids;
  const prevS = document.getElementById('gsearch');
  const gkwVal = prevS ? prevS.value : '';
  const caret = prevS && document.activeElement === prevS ? prevS.selectionStart : null;
  $('side-bd').innerHTML = `<div style="padding:8px 12px;border-bottom:1px solid var(--line)">
      <input id="gsearch" value="${gkwVal.replace(/"/g, '&quot;')}" placeholder="搜索人名 / 字 / 别名"
        style="width:100%;box-sizing:border-box;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fffdf8;font-size:17px;outline:none"/></div>
    <div id="glist"></div>`;
  const gs = document.getElementById('gsearch');
  gs.oninput = renderGraphList;
  if (caret != null) { gs.focus(); try { gs.setSelectionRange(caret, caret); } catch (e) {} }
  renderGraphList();

  // ---- 力导向布局（FR 简化）----
  const W = 1200, H = 860, n = ids.length;
  const pos = {}; ids.forEach((id, i) => {
    const f = primaryFaction(P[id]);
    const ang = Object.keys(FCOL).indexOf(f) * 2.399;      // 黄金角散开
    const r0 = 60 + (i % 7) * 24;
    pos[id] = [W / 2 + r0 * Math.cos(ang + i * .7), H / 2 + r0 * Math.sin(ang + i * .7)];
  });
  const k2 = 5600, rep = .5, att = .011, grav = .009;
  for (let it = 0; it < 260; it++) {
    const F = {}; ids.forEach(id => F[id] = [0, 0]);
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const a = pos[ids[i]], b = pos[ids[j]];
      let dx = a[0] - b[0], dy = a[1] - b[1], d2 = dx * dx + dy * dy + 40;
      const f = rep * k2 / d2, d = Math.sqrt(d2);
      dx /= d; dy /= d;
      F[ids[i]][0] += dx * f; F[ids[i]][1] += dy * f;
      F[ids[j]][0] -= dx * f; F[ids[j]][1] -= dy * f;
    }
    edges.forEach(e => {
      const a = pos[e.a], b = pos[e.b];
      if (!a || !b) return;
      const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.sqrt(dx * dx + dy * dy) || 1;
      const f = att * (d - 150);
      F[e.a][0] += dx / d * f; F[e.a][1] += dy / d * f;
      F[e.b][0] -= dx / d * f; F[e.b][1] -= dy / d * f;
    });
    ids.forEach(id => {
      const p = pos[id];
      p[0] += (W / 2 - p[0]) * grav + Math.max(-18, Math.min(18, F[id][0]));
      p[1] += (H / 2 - p[1]) * grav + Math.max(-18, Math.min(18, F[id][1]));
      p[0] = Math.max(24, Math.min(W - 24, p[0])); p[1] = Math.max(24, Math.min(H - 24, p[1]));
    });
  }

  // ---- 渲染 SVG ----
  const gNbr = {};
  if (gSel) edges.forEach(e => { if (e.a === gSel) gNbr[e.b] = 1; if (e.b === gSel) gNbr[e.a] = 1; });
  const svg = $('graph');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = `<g id="gz" transform="translate(0,0) scale(1)"></g>`;
  const gz = svg.querySelector('#gz');
  const mk = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  mk.innerHTML = edges.map(e => {
    const a = pos[e.a], b = pos[e.b];
    return `<line class="gedge ${e.k}" data-a="${e.a}" data-b="${e.b}" x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"><title>${esc(e.note || '')}</title></line>`;
  }).join('');
  gz.appendChild(mk);
  const ng = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  ng.innerHTML = ids.map(id => {
    const p = P[id], r = Math.min(26, 4 + Math.sqrt(GM[id] || 1) * 1.5);
    const col = FCOL[primaryFaction(p)] || '#888';
    // text 始终创建：data-th 记录「未选中时按阈值是否有名字」，nolab 控制显隐
    const th = (GM[id] || 0) >= 5 || deg[id] >= 2 ? '1' : '';
    const lab = `<text data-th="${th}" class="${th ? '' : 'nolab'}" x="${pos[id][0].toFixed(1)}" y="${(pos[id][1] + r + 11).toFixed(1)}" text-anchor="middle">${esc(p.name)}</text>`;
    return `<g class="gnode" data-id="${id}"><title>${esc(p.name)} · 提及 ${GM[id] || 0} 次 · ${FNAME[primaryFaction(p)]}</title>` +
      `<circle cx="${pos[id][0].toFixed(1)}" cy="${pos[id][1].toFixed(1)}" r="${r.toFixed(1)}" fill="${col}" fill-opacity=".85"></circle>${lab}</g>`;
  }).join('');
  gz.appendChild(ng);

  $('gystat').textContent = `${n} 节点 / ${edges.length} 边（君臣 ${edges.filter(e => e.k === 'lord').length} · 敌对 ${edges.filter(e => e.k === 'foe').length}）`;

  // 选中态：滑杆拖动后重放（本人+邻居高亮 + 标签 + 镜头跟随）
  if (gSel) graphApplySel(gz, gSel);

  gz.querySelectorAll('.gnode').forEach(el => el.onclick = () => {
    if (el.dataset.moved) { el.dataset.moved = ''; return; }
    // 虚化的节点用户根本看不清，点它视为「取消选中」而非切换
    if (el.classList.contains('dim')) { lastSel = null; graphUnfocus(); return; }
    const id = el.dataset.id;
    graphUnfocus();
    if (lastSel !== id) { lastSel = id; graphFocus(id, true); } else lastSel = null;
  });
  // 点空白 = 取消选中（平移拖拽不算）
  svg.addEventListener('click', ev => {
    if (ev.target.closest('.gnode') || svg.dataset.panned === '1') { svg.dataset.panned = ''; return; }
    lastSel = null; graphUnfocus();
  });
  gz.querySelectorAll('.gnode').forEach(el => el.ondblclick = () => openEntity('person', el.dataset.id));
  bindGraphDrag(svg, gz, pos);
}

const GV = { vk: 1, vx: 0, vy: 0 };
function graphApply(gz) { gz.setAttribute('transform', `translate(${GV.vx},${GV.vy}) scale(${GV.vk})`); }
let gSel = null;            // 当前选中 person_id（供滑杆/标签逻辑使用）
let gSliderSave = null;     // 滑杆原始状态，取消选中时还原
function graphYearRange(p) {
  const a = APP[p.id];
  const chY = ch => CH_YEAR[ch] != null ? CH_YEAR[ch] : 190;
  // 一律按登场–末次登场（生卒年区间里可能有大段「有年份无人物」的空白）
  const lo = a ? chY(a[0]) : (p.birth != null ? p.birth : 184);
  const hi0 = a ? chY(a[1]) : (p.death != null ? p.death : 220);
  // ★ 末次「提及」≠ 退场：后人回忆/台词引用会把董卓、刘协这类早亡者的提及拖到第 120 回。
  //   用生卒年或非追谥在任年末截断——逝者不因被提及而复活。
  const tEnd = (p.tenure || []).filter(t => t.role !== '追谥').reduce((m, t) => Math.max(m, t.end_year || -9999), -9999);
  const ends = [p.death, tEnd > -9999 ? tEnd : null].filter(v => v != null);
  const lifeEnd = ends.length ? Math.max(...ends) : null;
  let hi = lifeEnd != null ? Math.min(hi0, lifeEnd) : hi0;
  hi = Math.max(hi, lo);
  const atEnd = !!(a && a[1] >= 120 && (lifeEnd == null || lifeEnd >= 275));   // 触到数据边界且生前确实活到王朝末：滑杆延展到全局 280
  return [lo, atEnd ? Math.max(hi, 280) : hi, atEnd];
}
function graphApplySel(gz, selId) {
  // 邻居 = 当前年份边集里与选中节点相连的人
  const nbr = {};
  if (selId) gz.querySelectorAll(`line.gedge[data-a="${selId}"], line.gedge[data-b="${selId}"]`)
    .forEach(L => { nbr[L.dataset.a] = 1; nbr[L.dataset.b] = 1; });
  gz.querySelectorAll('.gnode').forEach(n => {
    const sel = n.dataset.id === selId, near = !!nbr[n.dataset.id];
    n.classList.toggle('focus', sel);
    n.classList.toggle('focus2', near);
    n.classList.toggle('dim', !!selId && !sel && !near);
    const t = n.querySelector('text');
    if (t) {
      // 未选中：按渲染时的阈值；选中：本人+邻居必显
      const show = selId ? (sel || near) : t.dataset.th === '1';
      t.classList.toggle('nolab', !show);
    }
  });
  gz.querySelectorAll('line.gedge').forEach(L =>
    L.classList.toggle('dim', !!selId && L.dataset.a !== selId && L.dataset.b !== selId));
  // 选中时给未虚化的边加关系标注（君臣/敌对），挂中点
  graphUpdateEdgeLabels(gz);
  // 选中时镜头跟随：保持该节点在画布中心
  if (selId) {
    const c = gz.querySelector(`.gnode[data-id="${selId}"] circle`);
    if (c) {
      const cx = +c.getAttribute('cx'), cy = +c.getAttribute('cy');
      GV.vx = 600 - cx * GV.vk; GV.vy = 430 - cy * GV.vk;
      graphApply(gz);
    }
  }
}

function graphUpdateEdgeLabels(gz) {
  let labs = gz.querySelector('#gelabs');
  if (!labs) { labs = document.createElementNS('http://www.w3.org/2000/svg', 'g'); labs.id = 'gelabs'; labs.setAttribute('pointer-events', 'none'); gz.appendChild(labs); }
  labs.innerHTML = '';
  gz.querySelectorAll('line.gedge:not(.dim)').forEach(L => {
    const x1 = +L.getAttribute('x1'), y1 = +L.getAttribute('y1'), x2 = +L.getAttribute('x2'), y2 = +L.getAttribute('y2');
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.dataset.a = L.dataset.a; t.dataset.b = L.dataset.b;
    t.setAttribute('x', (x1 + x2) / 2); t.setAttribute('y', (y1 + y2) / 2 - 4);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('class', 'elab');
    t.textContent = L.classList.contains('lord') ? '君臣' : '敌对';
    labs.appendChild(t);
  });
}

// 拖节点时同步相关边的标注位置
function graphMoveEdgeLabels(gz, id) {
  const labs = gz.querySelector('#gelabs');
  if (!labs) return;
  labs.querySelectorAll('text').forEach(t => {
    if (t.dataset.a !== id && t.dataset.b !== id) return;
    const L = gz.querySelector(`line.gedge[data-a="${t.dataset.a}"][data-b="${t.dataset.b}"], line.gedge[data-a="${t.dataset.b}"][data-b="${t.dataset.a}"]`);
    if (!L) return;
    t.setAttribute('x', (+L.getAttribute('x1') + +L.getAttribute('x2')) / 2);
    t.setAttribute('y', (+L.getAttribute('y1') + +L.getAttribute('y2')) / 2 - 4);
  });
}

function graphFocus(id, center) {
  const gz = document.querySelector('#gz');
  if (!gz) return;
  gSel = id;
  const sl = $('gyslider'), gm = $('gmode');
  if (id) {
    if (!gSliderSave) gSliderSave = { min: sl.min, max: sl.max, value: sl.value };
    const [lo, hi, atEnd] = graphYearRange(P[id]);
    sl.min = Math.round(lo); sl.max = Math.round(Math.max(hi, lo + 1));
    if (+sl.value < lo || +sl.value > hi) sl.value = Math.round(lo);
    gm.textContent = `登场–退场（约 ${lo}–${hi}）`;
    gm.style.display = '';
    renderGraph();   // 滑杆年份变了，立即按新年份重画（否则图还停在旧时点）
  } else if (gSliderSave) {
    sl.min = gSliderSave.min; sl.max = gSliderSave.max; sl.value = gSliderSave.value;
    gSliderSave = null; gm.style.display = 'none';
    renderGraph();   // 恢复全局时点同样立即生效
  }
  graphApplySel(gz, id);
  const gb = document.getElementById('gclear');
  if (gb) gb.classList.toggle('on', !!id);
  let it = document.querySelector(`#side-bd [data-gp="${id}"]`);
  if (!it && id && P[id]) { GFOLD[primaryFaction(P[id])] = true; renderGraphList(); it = document.querySelector(`#side-bd [data-gp="${id}"]`); }
  if (it) { it.classList.add('on'); it.scrollIntoView({ block: 'nearest' }); }
}
function graphUnfocus() {
  graphFocus(null);
  document.querySelectorAll('#side-bd [data-gp]').forEach(it => it.classList.remove('on'));
}
function bindGraphDrag(svg, gz, pos) {
  graphApply(gz);
  svg.onwheel = ev => {
    ev.preventDefault();
    const r = svg.getBoundingClientRect();
    const mx = (ev.clientX - r.left) * (1200 / r.width), my = (ev.clientY - r.top) * (860 / r.height);
    const f = ev.deltaY < 0 ? 1.15 : 1 / 1.15, nk = Math.max(.4, Math.min(6, GV.vk * f));
    GV.vx = mx - (mx - GV.vx) * (nk / GV.vk); GV.vy = my - (my - GV.vy) * (nk / GV.vk); GV.vk = nk; graphApply(gz);
  };
  svg.onmousedown = ev => {
    const g = ev.target.closest('.gnode');
    if (g) {
      const id = g.dataset.id; let moved = false;
      const sx = ev.clientX, sy = ev.clientY;
      const mv = e2 => {
        if (Math.abs(e2.clientX - sx) + Math.abs(e2.clientY - sy) > 4) moved = true;
        const r = svg.getBoundingClientRect();
        const x = ((e2.clientX - r.left) * (1200 / r.width) - GV.vx) / GV.vk, y = ((e2.clientY - r.top) * (860 / r.height) - GV.vy) / GV.vk;
        pos[id] = [x, y];
        const c = g.querySelector('circle'); c.setAttribute('cx', x); c.setAttribute('cy', y);
        const t = g.querySelector('text'); if (t) { t.setAttribute('x', x); t.setAttribute('y', y + +c.getAttribute('r') + 11); }
        gz.querySelectorAll('line.gedge').forEach(L => {
          if (L.dataset.a === id) { L.setAttribute('x1', x); L.setAttribute('y1', y); }
          if (L.dataset.b === id) { L.setAttribute('x2', x); L.setAttribute('y2', y); }
        });
        graphMoveEdgeLabels(gz, id);
      };
      const up = () => { if (moved) { g.dataset.moved = '1'; svg.dataset.panned = '1'; } document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); };
      document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
    } else {
      // 空白处拖拽 = 平移画布
      let sx = ev.clientX, sy = ev.clientY, vx0 = GV.vx, vy0 = GV.vy, panned = false;
      svg.classList.add('grabbing');
      const mv = e2 => {
        const r = svg.getBoundingClientRect();
        const dx = (e2.clientX - sx) * (1200 / r.width), dy = (e2.clientY - sy) * (860 / r.height);
        if (Math.abs(e2.clientX - sx) + Math.abs(e2.clientY - sy) > 4) { panned = true; svg.dataset.panned = '1'; }
        GV.vx = vx0 + dx; GV.vy = vy0 + dy; graphApply(gz);
      };
      const up = () => { svg.classList.remove('grabbing'); document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); };
      document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
    }
  };
}

window.renderGraph = renderGraph;
function setView(v) {
  if (view === 'power' && v !== 'power') pwStop();
  view = v;
  document.querySelectorAll('#nav div').forEach(d => d.classList.toggle('on', d.dataset.v === v));
  ['read', 'persons', 'places', 'power', 'events', 'graph'].forEach(k => $('v-' + k).classList.toggle('on', k === v));
  $('side-bd').classList.toggle('pwlist', v === 'power');
  document.body.classList.toggle('noside', v === 'places' || v === 'events');
  document.body.classList.toggle('readview', v === 'read');
  if (v === 'read') renderChapterList();
  else if (v === 'persons') renderPersons();
  else if (v === 'places') renderPlaces();
  else if (v === 'power') renderPowerView();
  else if (v === 'events') renderEvents();
  else if (v === 'graph') renderGraph();
}
document.querySelectorAll('#nav div').forEach(d => d.onclick = () => setView(d.dataset.v));

$('yslider').oninput = renderPersons;
$('gyslider').oninput = renderGraph;
$('gclear').onclick = () => { lastSel = null; graphUnfocus(); };
$('ge-lord').onchange = renderGraph;
$('ge-foe').onchange = renderGraph;
$('yfilter').onchange = renderPersons;
$('psrch').oninput = renderPersons;
$('pq').oninput = renderPList;
$('ptabs').querySelectorAll('button').forEach(b => b.onclick = () => {
  ptTab = b.dataset.t;
  $('ptabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  renderPList();
});
$('tg-p').onchange = e => document.body.classList.toggle('hide-p', !e.target.checked);
$('tg-l').onchange = e => document.body.classList.toggle('hide-l', !e.target.checked);

/* ================= 启动 ================= */
renderChapter(curCh);

/* 深链：#places / #persons / #events 直达视图，#place=ID 直达某地，#chapter=N 直达某回 */
(function () {
  const h = location.hash || '';
  let m;
  if ((m = h.match(/^#place=(.+)$/)) && L[m[1]]) { setView('places'); selectPlaceOnMap(L[m[1]]); }
  else if (h === '#places') setView('places');
  else if ((m = h.match(/^#placecard=(.+)$/)) && L[m[1]]) openPlace(m[1]);       /* 直达地点卡（调试/回归） */
  else if ((m = h.match(/^#battle=(.+)$/))) openBattle(m[1]);                    /* 直达战线图（调试/回归） */
  else if ((m = h.match(/^#event=(.+)$/))) openEvent(m[1]);
  else if ((m = h.match(/^#person=(.+)$/)) && P[m[1]]) { setView('persons'); openPerson(m[1]); }  /* 直达人物卡（调试/回归） */
  else if (h === '#persons') setView('persons');
  else if ((m = h.match(/^#persons\?f=(\w+)$/))) { pfFaction = m[1]; setView('persons'); }
  else if (h === '#events') setView('events');
  else if (h === '#graph') setView('graph');
  else if ((m = h.match(/^#power(?:=(\d+))?$/))) { setView('power'); if (m[1]) renderPower(+m[1]); }
  else if ((m = h.match(/^#chapter=(\d+)$/))) { document.body.classList.add('readview'); curCh = +m[1]; renderChapter(curCh); }
  else { document.body.classList.add('readview'); }   /* 默认视图 = 原文：章回侧栏加宽 */
})();
</script>
